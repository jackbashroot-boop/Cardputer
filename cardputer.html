<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cardputer EMU — M5Stack Cardputer emulator</title>
<meta name="description" content="Cross-platform M5Stack Cardputer emulator with hot-pluggable Grove modules, auto-updates and a full 240x135 LCD / 56-key hardware model.">
<style>
/* =========================================================== Cardputer EMU */
:root {
  --bg: #0b0d12;
  --bg-2: #11141b;
  --bg-3: #171b24;
  --line: #232935;
  --line-2: #2f3646;
  --txt: #e6ebf3;
  --txt-dim: #94a0b4;
  --txt-mute: #68748a;
  --accent: #5eead4;
  --accent-2: #38bdf8;
  --amber: #fbbf24;
  --red: #f87171;
  --green: #4ade80;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, Inter, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background:
    radial-gradient(1200px 600px at 15% -10%, #16202e 0%, transparent 60%),
    radial-gradient(900px 500px at 110% 10%, #1b1a2b 0%, transparent 55%),
    var(--bg);
  color: var(--txt);
  font: 13px/1.45 var(--sans);
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: #2b3341; border-radius: 6px; }
::-webkit-scrollbar-track { background: transparent; }

.app { display: flex; flex-direction: column; min-height: 100%; }

/* ------------------------------------------------------------------ topbar */
.topbar {
  display: flex; align-items: center; gap: 14px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(23, 27, 36, .95), rgba(11, 13, 18, .85));
  backdrop-filter: blur(8px);
  position: sticky; top: 0; z-index: 30;
}
.logo { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 13px; letter-spacing: .12em; }
.logo b { color: #fff; }
.logo i { color: var(--accent); font-style: normal; }
.logo-sub { color: var(--txt-mute); letter-spacing: .04em; font-size: 11px; margin-left: 6px; }
.logo-grid {
  width: 20px; height: 20px; border-radius: 5px;
  background:
    linear-gradient(135deg, var(--accent) 0 48%, transparent 48%),
    linear-gradient(315deg, var(--accent-2) 0 48%, transparent 48%), #0f141c;
  box-shadow: 0 0 0 1px #263042 inset, 0 0 12px rgba(94, 234, 212, .25);
}
.spacer { flex: 1; }
.pills { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 9px; border-radius: 999px;
  background: var(--bg-3); border: 1px solid var(--line);
  font-family: var(--mono); font-size: 11px; color: var(--txt-dim);
  white-space: nowrap;
}
.pill.accent { color: var(--accent); border-color: #1f4d4a; background: #0d1a19; }
.pill.low, #statusBattery.low { color: var(--red); }
.pill #statusApp { color: var(--txt); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--txt-mute); }
.dot.run { background: var(--green); box-shadow: 0 0 8px var(--green); animation: pulse 2.4s infinite; }
.dot.off { background: #4b5563; }
.dot.dl { background: var(--amber); box-shadow: 0 0 8px var(--amber); }
@keyframes pulse { 50% { opacity: .45; } }

/* ------------------------------------------------------------------- layout */
main {
  flex: 1;
  display: grid;
  grid-template-columns: minmax(0, 1fr) 452px;
  gap: 16px;
  padding: 16px;
  align-items: start;
}
.stage { min-width: 0; }
.console {
  display: flex; flex-direction: column;
  background: linear-gradient(180deg, #12161e, #0e1117);
  border: 1px solid var(--line); border-radius: 14px;
  max-height: calc(100vh - 108px);
  position: sticky; top: 62px;
  overflow: hidden;
}
@media (max-width: 1180px) {
  main { grid-template-columns: minmax(0, 1fr); }
  .console { position: static; max-height: none; }
}

/* ------------------------------------------------------------------ device */
.device-shell { display: flex; gap: 14px; align-items: flex-start; }
.device-body {
  flex: 1; min-width: 0;
  position: relative;
  padding: 14px 14px 16px;
  border-radius: 16px;
  background: linear-gradient(160deg, #f4f6f9, #d9dfe7 55%, #c3cad4);
  box-shadow:
    0 26px 60px -22px rgba(0, 0, 0, .85),
    0 2px 0 rgba(255, 255, 255, .7) inset,
    0 -3px 0 rgba(0, 0, 0, .12) inset;
  transition: filter .3s, opacity .3s;
}
.device-body[data-variant="cardputer"] { background: linear-gradient(160deg, #e3e7ec, #c6ccd4 60%, #b2b9c2); }
.device-body[data-variant="v11"] { background: linear-gradient(160deg, #eef1f5, #d3d9e0 60%, #bcc3cc); }
.device-body[data-variant="adv"] { background: linear-gradient(160deg, #fbfcfd, #e6eaef 55%, #ced5de); }
.device-body:not(.powered) .screen-inner { filter: grayscale(.6) brightness(.5); }
.device-body:not(.powered) .led-strip { opacity: .25; }

.device-topline { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.brand-mini { font-family: var(--mono); font-size: 10px; letter-spacing: .14em; color: #6b7480; text-transform: uppercase; }
.brand-mini b { color: #2b323c; }
.led-strip {
  flex: 1; max-width: 90px; height: 4px; border-radius: 3px; background: #111;
  transition: background .25s, box-shadow .25s;
}
.ir-window {
  width: 14px; height: 8px; border-radius: 3px; background: #2b1b1b;
  box-shadow: inset 0 0 0 1px #000, 0 0 0 1px rgba(255, 255, 255, .35);
  cursor: pointer; transition: background .12s, box-shadow .12s;
}
.ir-window.blast { background: #ff5b5b; box-shadow: 0 0 14px #ff5b5b; }

.screen-bezel {
  padding: 8px; border-radius: 10px;
  background: linear-gradient(180deg, #14161a, #0a0b0e);
  box-shadow: 0 1px 0 rgba(255, 255, 255, .5), inset 0 0 0 1px #000;
}
.screen-inner { position: relative; border-radius: 5px; overflow: hidden; background: #000; aspect-ratio: 240 / 135; }
#lcd {
  display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges;
  -ms-interpolation-mode: nearest-neighbor;
}
.lcd-dim { position: absolute; inset: 0; pointer-events: none; background: #000; opacity: 0; transition: opacity .12s linear; }
.lcd-glare {
  position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(118deg, rgba(255, 255, 255, .07) 0 12%, rgba(255, 255, 255, .015) 24%, transparent 38%);
}
.lcd-scanlines {
  position: absolute; inset: 0; pointer-events: none; opacity: .055;
  background: repeating-linear-gradient(180deg, rgba(0, 0, 0, .5) 0 1px, transparent 1px 3px);
}
.deck { display: flex; align-items: center; gap: 12px; margin: 9px 2px 6px; }
.grille {
  width: 58px; height: 14px; border-radius: 3px;
  background-image: radial-gradient(#9aa3af 1px, transparent 1.2px);
  background-size: 5px 5px; opacity: .85;
}
.mic-hole { width: 8px; height: 8px; border-radius: 50%; background: #2a2f37; box-shadow: inset 0 0 0 1px #0b0d10; }
.deck-labels {
  margin-left: auto; display: flex; gap: 10px;
  font-family: var(--mono); font-size: 9px; letter-spacing: .1em; color: #7b8490; text-transform: uppercase;
}

/* keyboard */
.keyboard {
  display: grid;
  grid-template-columns: repeat(var(--cols, 14), minmax(0, 1fr));
  gap: 3px;
  padding: 6px;
  border-radius: 8px;
  background: linear-gradient(180deg, #b9c0c9, #a7aeb8);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .6), inset 0 -1px 0 rgba(0, 0, 0, .25);
  user-select: none; touch-action: none;
}
.key {
  position: relative;
  height: 26px; min-width: 0;
  border: 0; border-radius: 4px; padding: 0;
  background: linear-gradient(180deg, #3c4350, #262c36);
  box-shadow: 0 1.5px 0 #14181f, inset 0 1px 0 rgba(255, 255, 255, .12);
  color: #e9edf3;
  font-family: var(--mono); font-size: 9.5px; letter-spacing: .02em;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: transform .04s, box-shadow .06s, background .06s;
}
.key .fnlabel {
  position: absolute; top: 1px; right: 2.5px;
  font-size: 6.5px; color: var(--amber); opacity: .78; letter-spacing: 0;
}
.key.key-mod { background: linear-gradient(180deg, #333945, #20252d); color: var(--accent); font-size: 8px; }
.key.key-wide { font-size: 8px; }
.key:hover { background: linear-gradient(180deg, #454d5c, #2c333e); }
.key.down {
  transform: translateY(1.5px);
  background: linear-gradient(180deg, #0f766e, #115e59);
  box-shadow: 0 0 0 #000, inset 0 1px 0 rgba(255, 255, 255, .18), 0 0 12px rgba(94, 234, 212, .45);
}
.key.down .legend { color: #ecfeff; }
.key.down .fnlabel { color: #d1fae5; }

/* side rail */
.device-rail { display: flex; flex-direction: column; gap: 6px; width: 68px; }
.rail-btn {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 7px 4px; border-radius: 9px;
  background: linear-gradient(180deg, #1b202a, #12161d);
  border: 1px solid var(--line-2);
  color: var(--txt-dim); font-family: var(--mono); font-size: 9px; letter-spacing: .06em;
  cursor: pointer; transition: .15s;
}
.rail-btn .ico { font-size: 13px; line-height: 1; }
.rail-btn:hover { border-color: #3b4757; color: var(--txt); transform: translateY(-1px); }
.rail-btn.on { color: var(--accent); border-color: #1e5f58; background: linear-gradient(180deg, #0f2b28, #0b1a19); }
.rail-btn:disabled { opacity: .35; cursor: not-allowed; }
.rail-btn.strike { transform: scale(.94); }

/* chassis foot */
.chassis-foot { display: flex; gap: 16px; align-items: center; margin-top: 14px; flex-wrap: wrap; }
.tilt-wrap { display: flex; align-items: center; gap: 10px; }
.tilt-pad {
  position: relative; width: 82px; height: 82px; border-radius: 12px;
  background: radial-gradient(circle at 50% 50%, #16202c, #0d1218 70%);
  border: 1px solid var(--line-2);
  box-shadow: inset 0 0 18px rgba(0, 0, 0, .8);
  cursor: grab; touch-action: none;
  display: grid; place-items: center;
}
.tilt-pad::before, .tilt-pad::after {
  content: ''; position: absolute; background: #1e2836;
}
.tilt-pad::before { width: 1px; height: 70%; }
.tilt-pad::after { height: 1px; width: 70%; }
.tilt-knob {
  width: 18px; height: 18px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #7dd3fc, #0ea5e9 60%, #075985);
  box-shadow: 0 0 14px rgba(56, 189, 248, .65);
  transition: transform .06s linear;
}
.tilt-label { position: absolute; bottom: 3px; font-family: var(--mono); font-size: 7px; letter-spacing: .16em; color: var(--txt-mute); }
.tilt-read { font-family: var(--mono); font-size: 10px; color: var(--txt-dim); line-height: 1.5; }
.hintlist { display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: var(--txt-mute); }
.hintlist kbd {
  font-family: var(--mono); font-size: 10px; padding: 1px 4px; border-radius: 4px;
  background: var(--bg-3); border: 1px solid var(--line-2); color: var(--txt-dim);
}

/* ----------------------------------------------------------------- console */
.tabs { display: flex; gap: 2px; padding: 8px 8px 0; border-bottom: 1px solid var(--line); }
.tab {
  flex: 1; padding: 7px 6px; border: 0; border-radius: 8px 8px 0 0;
  background: transparent; color: var(--txt-mute);
  font-family: var(--mono); font-size: 11px; letter-spacing: .05em; cursor: pointer;
  border-bottom: 2px solid transparent;
}
.tab:hover { color: var(--txt); }
.tab.active { color: var(--accent); background: #0f141b; border-bottom-color: var(--accent); }
.pane { padding: 12px; overflow-y: auto; flex: 1; min-height: 0; }
.pane.serial-pane { display: flex; flex-direction: column; overflow: hidden; padding-bottom: 10px; }
.pane-title {
  display: flex; align-items: baseline; gap: 8px;
  font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--txt-dim); margin: 2px 0 8px;
}
.pane-sub {
  display: flex; align-items: baseline; gap: 8px;
  font-size: 12px; color: var(--txt); margin: 14px 0 7px; font-weight: 600;
}
.muted { color: var(--txt-mute); font-weight: 400; font-size: 11px; }
.muted.small { font-size: 11px; line-height: 1.5; }
.card {
  background: linear-gradient(180deg, #141922, #10141b);
  border: 1px solid var(--line); border-radius: 10px;
  padding: 11px; margin-bottom: 10px;
}
.card-title { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--txt-mute); margin-bottom: 9px; }
.row { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; margin-top: 7px; }
.notice {
  padding: 8px 10px; border-radius: 8px; margin-bottom: 8px;
  background: #2a2213; border: 1px solid #4d3c17; color: #fcd34d; font-size: 11.5px;
}
.empty-slot {
  padding: 12px; border-radius: 9px; text-align: center;
  border: 1px dashed var(--line-2); color: var(--txt-mute); font-size: 11.5px;
}

/* ports */
.ports { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
.port {
  padding: 8px; border-radius: 9px; background: #10151c;
  border: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px;
}
.port.filled { border-color: #1e5f58; background: linear-gradient(180deg, #0e2320, #0c1618); }
.port-name { font-size: 11px; color: var(--txt); font-weight: 600; }
.port-count { font-family: var(--mono); font-size: 10px; color: var(--accent); }
.port-note { font-size: 9.5px; color: var(--txt-mute); line-height: 1.35; }
.port .btn { margin-top: 5px; }

/* module cards */
.mod-card {
  border: 1px solid #1f4d4a; border-radius: 10px; padding: 9px 10px; margin-bottom: 9px;
  background: linear-gradient(180deg, #0f1c1c, #0d1418);
}
.mod-head { display: flex; align-items: center; gap: 8px; }
.mod-dot { width: 9px; height: 9px; border-radius: 3px; flex: none; box-shadow: 0 0 8px currentColor; }
.mod-title { flex: 1; min-width: 0; }
.mod-name { font-size: 12.5px; font-weight: 600; color: #ecfeff; }
.mod-sku { font-family: var(--mono); font-size: 9.5px; color: var(--txt-mute); }
.addr-row { display: flex; gap: 5px; flex-wrap: wrap; margin: 7px 0 0; }
.addr-row code, .cat-meta code {
  font-family: var(--mono); font-size: 9.5px; padding: 1.5px 5px; border-radius: 4px;
  background: #0a1a19; color: var(--accent); border: 1px solid #17423e;
}
.live-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 10px; margin-top: 8px; }
.live-row { display: flex; gap: 6px; font-size: 10.5px; }
.live-v { margin-left: auto; }
.live-k { color: var(--txt-mute); text-transform: capitalize; }
.live-v { font-family: var(--mono); color: #a7f3d0; }
.controls { display: flex; flex-direction: column; gap: 7px; margin-top: 9px; padding-top: 8px; border-top: 1px dashed #17423e; flex-wrap: wrap; }
.controls:has(button) { flex-direction: row; }

/* sliders / controls */
.ctl { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--txt-dim); }
.ctl > span:first-child { min-width: 84px; color: var(--txt-mute); }
.ctl.inline { flex: 1; min-width: 120px; }
.ctl.wide { flex: 1 1 100%; min-width: 100%; }
.ctl.wide .search { flex: 1; margin: 0; }
.ctl input[type=range] {
  -webkit-appearance: none; appearance: none; flex: 1; height: 3px; border-radius: 3px;
  background: #263041; outline: none;
}
.ctl input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%;
  background: var(--accent); box-shadow: 0 0 8px rgba(94, 234, 212, .6); cursor: pointer;
}
.ctl input[type=range]::-moz-range-thumb {
  width: 12px; height: 12px; border: 0; border-radius: 50%; background: var(--accent); cursor: pointer;
}
.ctl-val { font-family: var(--mono); font-size: 10px; color: var(--accent); min-width: 46px; text-align: right; }
.ctl input[type=color] { width: 30px; height: 20px; border: 1px solid var(--line-2); border-radius: 5px; background: none; padding: 0; }
.toggle { display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--txt-dim); cursor: pointer; }
.toggle input { accent-color: var(--accent); }
.toggle.disabled { opacity: .4; cursor: not-allowed; }
.switch-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; }

/* buttons */
.btn {
  padding: 5px 11px; border-radius: 7px; cursor: pointer;
  background: #1a2130; border: 1px solid var(--line-2); color: var(--txt);
  font-size: 11.5px; transition: .13s;
}
.btn:hover { border-color: #43516a; background: #212a3b; }
.btn.primary { background: linear-gradient(180deg, #0d9488, #0f766e); border-color: #14b8a6; color: #f0fdfa; }
.btn.primary:hover { filter: brightness(1.1); }
.btn.danger { color: #fca5a5; border-color: #5b2626; background: #231314; }
.btn.tiny { padding: 3px 8px; font-size: 10.5px; border-radius: 6px; }
.btn:disabled { opacity: .42; cursor: not-allowed; }

/* catalog */
.search {
  width: 100%; padding: 6px 9px; border-radius: 7px;
  background: #0c1017; border: 1px solid var(--line-2); color: var(--txt);
  font-size: 11.5px; margin: 6px 0;
}
.search:focus { outline: none; border-color: #2b6f68; }
.chipbar { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 6px; }
.chip {
  padding: 2.5px 9px; border-radius: 999px; cursor: pointer; font-size: 10.5px;
  background: #121821; border: 1px solid var(--line); color: var(--txt-mute);
}
.chip.active { background: #0f2b28; border-color: #1e5f58; color: var(--accent); }
.catalog { display: flex; flex-direction: column; gap: 5px; }
.cat-row {
  display: flex; align-items: flex-start; gap: 8px;
  padding: 7px 8px; border-radius: 8px; background: #0f141b; border: 1px solid var(--line);
}
.cat-row:hover { border-color: var(--line-2); }
.cat-row.blocked { opacity: .62; }
.cat-main { flex: 1; min-width: 0; }
.cat-name { font-size: 12px; color: var(--txt); display: flex; gap: 6px; align-items: baseline; }
.cat-name .sku { font-family: var(--mono); font-size: 9px; color: var(--txt-mute); }
.cat-sum { font-size: 10.5px; color: var(--txt-mute); line-height: 1.35; }
.cat-meta { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; align-items: center; }
.tag {
  font-family: var(--mono); font-size: 9px; padding: 1px 5px; border-radius: 4px;
  background: #151b24; border: 1px solid var(--line); color: var(--txt-mute); text-transform: uppercase;
}
.tag.warn { color: var(--amber); border-color: #4d3c17; background: #221b0d; }
.cat-why { font-size: 10px; color: #fca5a5; margin-top: 3px; }

/* system bits */
.variant-grid { display: flex; flex-direction: column; gap: 6px; }
.variant {
  text-align: left; padding: 8px 10px; border-radius: 9px; cursor: pointer;
  background: #10151c; border: 1px solid var(--line); color: var(--txt);
}
.variant:hover { border-color: var(--line-2); }
.variant.active { border-color: #1e5f58; background: linear-gradient(180deg, #0e2320, #0c1618); }
.variant-name { font-size: 12px; font-weight: 600; }
.variant-sku { font-family: var(--mono); font-size: 9.5px; color: var(--txt-mute); }
.variant-feats { font-size: 9.5px; color: var(--accent); margin-top: 2px; letter-spacing: .02em; }
table.kv { width: 100%; border-collapse: collapse; }
table.kv th {
  text-align: left; font-weight: 400; font-size: 10.5px; color: var(--txt-mute);
  padding: 2.5px 8px 2.5px 0; white-space: nowrap; vertical-align: top;
}
table.kv td { font-family: var(--mono); font-size: 10.5px; color: var(--txt-dim); padding: 2.5px 0; word-break: break-word; }
.batt { margin-bottom: 4px; }
.batt-bar { height: 9px; border-radius: 5px; background: #0c1017; border: 1px solid var(--line-2); overflow: hidden; }
.batt-bar i { display: block; height: 100%; background: linear-gradient(90deg, #0d9488, #5eead4); }
.batt-txt { font-family: var(--mono); font-size: 10px; color: var(--txt-mute); margin-top: 4px; }
.nlist { margin: 0; padding-left: 16px; color: var(--txt-dim); font-size: 11.5px; line-height: 1.7; }
pre.code {
  background: #0a0e14; border: 1px solid var(--line); border-radius: 8px;
  padding: 9px; font-family: var(--mono); font-size: 10px; line-height: 1.5;
  color: #a5d6ff; overflow-x: auto; margin: 0 0 8px;
}

/* serial */
.serial-bar { display: flex; gap: 6px; align-items: center; margin-bottom: 7px; }
.serial-bar .search { margin: 0; flex: 1; }
.serial {
  font-family: var(--mono); font-size: 10.5px; line-height: 1.5;
  background: #06090d; border: 1px solid var(--line); border-radius: 9px;
  padding: 7px 8px; flex: 1; min-height: 220px; overflow-y: auto; color: #9fb3c8;
}
.sline { white-space: pre-wrap; word-break: break-word; }
.sline .st { color: #37475a; margin-right: 7px; }
.sline.boot { color: #7dd3fc; }
.sline.info { color: #9fb3c8; }
.sline.ok { color: #4ade80; }
.sline.warn { color: #fbbf24; }
.sline.error { color: #f87171; }
.sline.app { color: #c4b5fd; }

/* updates */
.ver-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.ver-big { font-family: var(--mono); font-size: 20px; color: #fff; letter-spacing: .04em; }
.badge {
  font-family: var(--mono); font-size: 10px; padding: 2px 8px; border-radius: 999px;
  border: 1px solid var(--line-2); color: var(--txt-dim);
}
.badge.ok { color: var(--green); border-color: #1c4a2c; background: #0d1c14; }
.badge.up { color: var(--amber); border-color: #4d3c17; background: #221b0d; }
.rel-list { display: flex; flex-direction: column; gap: 8px; }
.rel { border-left: 2px solid var(--line-2); padding-left: 9px; }
.rel.current { border-left-color: var(--accent); }
.rel-head { display: flex; gap: 7px; align-items: center; font-size: 11.5px; flex-wrap: wrap; }
.notes { margin: 3px 0 0; padding-left: 15px; color: var(--txt-mute); font-size: 10.5px; line-height: 1.5; }
.app-list { display: flex; flex-direction: column; gap: 4px; }
.app-row { display: flex; align-items: center; gap: 8px; font-size: 11.5px; }
.app-ic {
  width: 18px; height: 18px; border-radius: 5px; display: grid; place-items: center;
  font-family: var(--mono); font-size: 8.5px; color: #0b0d12; font-weight: 700;
}
.app-name { flex: 1; }
.uplog {
  font-family: var(--mono); font-size: 10px; color: var(--txt-mute);
  max-height: 130px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px;
}
.uplog .st { color: #37475a; margin-right: 6px; }

/* foot + toasts */
.footbar {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 16px; border-top: 1px solid var(--line);
  font-family: var(--mono); font-size: 10px; color: var(--txt-mute);
  background: #0a0c11;
}
.toasts {
  position: fixed; right: 16px; bottom: 46px; z-index: 60;
  display: flex; flex-direction: column; gap: 7px; align-items: flex-end;
  pointer-events: none;
}
.toast {
  padding: 8px 13px; border-radius: 9px; font-size: 11.5px;
  background: #141a24; border: 1px solid var(--line-2); color: var(--txt);
  box-shadow: 0 12px 28px -12px #000;
  animation: toastIn .18s ease-out;
  max-width: 320px;
}
.toast.ok { border-color: #1e5f58; color: #a7f3d0; }
.toast.error { border-color: #5b2626; color: #fca5a5; }
.toast.out { opacity: 0; transform: translateY(6px); transition: .4s; }
@keyframes toastIn { from { opacity: 0; transform: translateY(8px); } }
@media (max-width: 620px) {
  .key { height: 22px; font-size: 8px; }
  .key .fnlabel { display: none; }
  .device-rail { width: 54px; }
}

/* flash / bench ---------------------------------------------------------- */
.dropzone {
  display: flex; flex-direction: column; gap: 4px; align-items: center; justify-content: center;
  padding: 16px 12px; margin: 8px 0; text-align: center;
  border: 1px dashed #2c3442; border-radius: 10px; background: #0c1016;
  color: var(--txt-mute); font-size: 11px; transition: .15s;
}
.dropzone.over { border-color: #2f80ed; background: #101a26; color: var(--txt); }
.dropzone b { color: var(--txt); font-size: 12px; font-weight: 600; }
.dropzone .btn { margin-top: 6px; }

.prog { height: 5px; border-radius: 3px; background: #131922; overflow: hidden; margin: 6px 0; }
.prog i { display: block; height: 100%; background: linear-gradient(90deg, #2f80ed, #38bdf8); transition: width .2s; }

.code-editor {
  width: 100%; box-sizing: border-box; min-height: 190px; resize: vertical;
  margin: 6px 0; padding: 9px 10px; border-radius: 8px;
  background: #0a0e14; color: #cfe3ff; border: 1px solid var(--line-2);
  font-family: var(--mono); font-size: 11px; line-height: 1.5; tab-size: 2;
}

table.ptable { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 10px; }
table.ptable th { text-align: left; color: var(--txt-mute); font-weight: 500; padding: 3px 5px; border-bottom: 1px solid var(--line); }
table.ptable td { padding: 3px 5px; color: var(--txt); border-bottom: 1px solid #131922; }
table.ptable tr.active td { background: #0f1a26; color: #9fd0ff; }

.filelist { display: flex; flex-direction: column; gap: 2px; margin: 6px 0; }
.file-row {
  display: flex; align-items: center; gap: 8px;
  padding: 4px 6px; border-radius: 6px; background: #0c1017; font-size: 11px;
}
.file-row:nth-child(even) { background: #0a0e14; }
.file-row .fname { flex: 1; color: var(--txt); cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-row .fname:hover { color: #9fd0ff; }

/* titles with an inline hint: keep the hint from butting into the label */
.card-title { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.card-title .muted { font-size: 9.5px; letter-spacing: 0; text-transform: none; color: var(--txt-dim); font-family: var(--mono); }
.pane-title .muted { text-transform: none; letter-spacing: 0; }
/* thermal gauge reuses .batt-bar but must not read as "full" at 25 % */
.card .batt-bar + .batt-txt { margin-top: 5px; }
.pill-action { cursor: pointer; }
.pill-action:hover { border-color: #2f80ed; color: #cfe3ff; }

  sleep(on) { this.asleep = !!on; this.dirty = true; }
  setBacklight(v) { this.backlight = clamp(v, 0, 1); this.dirty = true; }
  push(count = 1) { this.frameCount += count; this.dirty = true; }

  _xy(x, y) {
    // rotation-aware coordinate mapping into the native landscape buffer
    x |= 0; y |= 0;
    if (this.rotation === 0) return [x, y];
    if (this.rotation === 1) return [y, this.nativeH - 1 - x];
    if (this.rotation === 2) return [this.nativeW - 1 - x, this.nativeH - 1 - y];
    return [this.nativeW - 1 - y, x];
  }
  pixel(x, y, c) {
    if (x < this.clipX || y < this.clipY || x >= this.clipX + this.clipW || y >= this.clipY + this.clipH) return;
    if (x < 0 || y < 0 || x >= this.w || y >= this.h) return;
    const [nx, ny] = this._xy(x, y);
    this.buf[ny * this.nativeW + nx] = c & 0xffff;
    this.dirty = true;
  }
  getPixel(x, y) {
    const [nx, ny] = this._xy(x, y);
    if (nx < 0 || ny < 0 || nx >= this.nativeW || ny >= this.nativeH) return 0;
    return this.buf[ny * this.nativeW + nx];
  }
  // Liang–Barsky clip of a segment against the visible window; null if fully outside.
  _clipSegment(x0, y0, x1, y1) {
    const xmin = Math.max(this.clipX, 0), ymin = Math.max(this.clipY, 0);
    const xmax = Math.min(this.clipX + this.clipW, this.w), ymax = Math.min(this.clipY + this.clipH, this.h);
    const dx = x1 - x0, dy = y1 - y0;
    let t0 = 0, t1 = 1;
    const edges = [[-dx, x0 - xmin], [dx, xmax - x0], [-dy, y0 - ymin], [dy, ymax - y0]];
    for (const [p, q] of edges) {
      if (p === 0) { if (q < 0) return null; continue; }
      const r = q / p;
      if (p < 0) { if (r > t1) return null; if (r > t0) t0 = r; }
      else { if (r < t0) return null; if (r < t1) t1 = r; }
    }
    return [x0 + t0 * dx, y0 + t0 * dy, x0 + t1 * dx, y0 + t1 * dy];
  }
  // --- primitives ---
  fillScreen(c) { this.buf.fill(c & 0xffff); this.dirty = true; this.cursorX = this.cursorY = 0; }
  fillRect(x, y, w, h, c) {
    const r = this._clampRect(x, y, w, h);
    for (let j = r.y; j < r.y + r.h; j++) for (let i = r.x; i < r.x + r.w; i++) this.pixel(i, j, c);
  }
  drawRect(x, y, w, h, c) {
    this.drawFastHLine(x, y, w, c); this.drawFastHLine(x, y + h - 1, w, c);
    this.drawFastVLine(x, y, h, c); this.drawFastVLine(x + w - 1, y, h, c);
  }
  drawFastHLine(x, y, w, c) {
    const r = this._clampRect(x, y, w, 1);
    for (let i = r.x; i < r.x + r.w; i++) this.pixel(i, r.y, c);
  }
  drawFastVLine(x, y, h, c) {
    const r = this._clampRect(x, y, 1, h);
    for (let i = r.y; i < r.y + r.h; i++) this.pixel(r.x, i, c);
  }
  drawLine(x0, y0, x1, y1, c) {
    if (![x0, y0, x1, y1].every(Number.isFinite)) return;
    // Clip to the window before walking pixels: a fuzzed 1e9-pixel line must not hang.
    const seg = this._clipSegment(x0, y0, x1, y1);
    if (!seg) return;
    ({ x0, y0, x1, y1 } = { x0: Math.round(seg[0]), y0: Math.round(seg[1]), x1: Math.round(seg[2]), y1: Math.round(seg[3]) });
    const dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0);
    const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
    let err = dx - dy;
    for (;;) {
      this.pixel(x0, y0, c);
      if (x0 === x1 && y0 === y1) break;
      const e2 = 2 * err;
      if (e2 > -dy) { err -= dy; x0 += sx; }
      if (e2 < dx) { err += dx; y0 += sy; }
    }
  }
  fillCircle(cx, cy, r, c) {
    if (![cx, cy, r].every(Number.isFinite) || r < 0) return;
    // only sweep the rows that can actually touch the window
    const yTop = Math.max(-r, Math.floor(Math.max(this.clipY, 0) - cy));
    const yBot = Math.min(r, Math.ceil(Math.min(this.clipY + this.clipH, this.h) - cy));
    for (let y = yTop; y <= yBot; y++) {
      const dx = Math.floor(Math.sqrt(r * r - y * y));
      this.drawFastHLine(cx - dx, cy + y, dx * 2 + 1, c);
    }
  }
  drawCircle(cx, cy, r, c) {
    if (![cx, cy, r].every(Number.isFinite) || r < 0) return;
    if (r > 4096) return;                     // far outside any plausible window
    let x = r, y = 0, err = 1 - r;
    while (x >= y) {
      this.pixel(cx + x, cy + y, c); this.pixel(cx + y, cy + x, c);
      this.pixel(cx - y, cy + x, c); this.pixel(cx - x, cy + y, c);
      this.pixel(cx - x, cy - y, c); this.pixel(cx - y, cy - x, c);
      this.pixel(cx + y, cy - x, c); this.pixel(cx + x, cy - y, c);
      y++;
      if (err < 0) err += 2 * y + 1; else { x--; err += 2 * (y - x) + 1; }
    }
  }
  fillTriangle(x0, y0, x1, y1, x2, y2, c) {
    const minY = Math.max(0, Math.floor(Math.min(y0, y1, y2)));
    const maxY = Math.min(this.h - 1, Math.ceil(Math.max(y0, y1, y2)));
    for (let y = minY; y <= maxY; y++) {
      let lo = Infinity, hi = -Infinity;
      const edges = [[x0, y0, x1, y1], [x1, y1, x2, y2], [x2, y2, x0, y0]];
      for (const [ax, ay, bx, by] of edges) {
        if (ay === by) { if (y === ay) { lo = Math.min(lo, ax, bx); hi = Math.max(hi, ax, bx); } continue; }
        const t = (y - ay) / (by - ay);
        if (t < 0 || t > 1) continue;
        const x = ax + (bx - ax) * t;
        lo = Math.min(lo, x); hi = Math.max(hi, x);
      }
      if (lo <= hi) this.drawFastHLine(Math.round(lo), y, Math.round(hi - lo) + 1, c);
    }
  }
  fillRoundRect(x, y, w, h, r, c) {
    r = Math.min(r, Math.floor(Math.min(w, h) / 2));
    this.fillRect(x + r, y, w - 2 * r, h, c);
    this.fillRect(x, y + r, r, h - 2 * r, c);
    this.fillRect(x + w - r, y + r, r, h - 2 * r, c);
    this.fillCircle(x + r, y + r, r, c); this.fillCircle(x + w - r - 1, y + r, r, c);
    this.fillCircle(x + r, y + h - r - 1, r, c); this.fillCircle(x + w - r - 1, y + h - r - 1, r, c);
  }
  drawRoundRect(x, y, w, h, r, c) {
    this.drawLine(x + r, y, x + w - r, y, c); this.drawLine(x + r, y + h - 1, x + w - r, y + h - 1, c);
    this.drawLine(x, y + r, x, y + h - r, c); this.drawLine(x + w - 1, y + r, x + w - 1, y + h - r, c);
    const q = [[x + r, y + r, 2], [x + w - r - 1, y + r, 3], [x + r, y + h - r - 1, 1], [x + w - r - 1, y + h - r - 1, 0]];
    for (const [cx, cy, qd] of q) {
      let px = 0, py = r, d = 3 - 2 * r;
      while (px <= py) {
        const pts = [[px, py], [py, px]];
        for (const [a, b] of pts) {
          const sx = qd === 1 || qd === 2 ? -1 : 1;
          const sy = qd === 0 || qd === 1 ? -1 : 1;
          this.pixel(cx + a * sx, cy + b * sy, c);
          this.pixel(cx + b * sx, cy + a * sy, c);
        }
        if (d < 0) d += 4 * px + 6; else { d += 4 * (px - py) + 10; py--; }
        px++;
      }
    }
  }
  // --- text ---
  setTextColor(fg, bg = null) { this.textColor = fg; this.textBg = bg; }
  setTextSize(s) { this.textSize = clamp(s | 0 || 1, 1, 8); }
  setCursor(x, y) { this.cursorX = x; this.cursorY = y; }
  setTextWrap(v) { this.wrap = !!v; }
  drawChar(x, y, code, color = this.textColor, bg = this.textBg, size = this.textSize) {
    if (![x, y].every(Number.isFinite)) return 0;
    // TFT_eSPI allows 1..7; clamping also stops a fuzzed size from exploding the loop
    size = Math.max(1, Math.min(8, Math.round(Number.isFinite(size) ? size : 1)));
    const b = glyphBytes(code);
    for (let col = 0; col < FONT_W; col++) {
      for (let row = 0; row < FONT_H + 1; row++) {
        const on = row < FONT_H ? (b[col] >> row) & 1 : 0;
        if (on) this.fillRect(x + col * size, y + row * size, size, size, color);
        else if (bg !== null) this.fillRect(x + col * size, y + row * size, size, size, bg);
      }
    }
    return (FONT_W + 1) * size;
  }
  drawString(x, y, str, color = this.textColor, size = this.textSize) {
    let cx = Math.round(x);
    for (const ch of xlate(str)) {
      const code = ch.codePointAt(0);
      this.drawChar(cx, Math.round(y), code, color, null, size);
      cx += (FONT_W + 1) * size;
    }
    return cx;
  }
  print(s) {
    for (const ch of xlate(s)) {
      if (ch === '\n') { this.cursorX = 0; this.cursorY += (FONT_H + 1) * this.textSize; continue; }
      if (ch === '\r') { this.cursorX = 0; continue; }
      if (this.wrap && this.cursorX + (FONT_W + 1) * this.textSize > this.w) {
        this.cursorX = 0; this.cursorY += (FONT_H + 1) * this.textSize;
      }
      if (this.textBg !== null) this.fillRect(this.cursorX, this.cursorY, (FONT_W + 1) * this.textSize, (FONT_H + 1) * this.textSize, this.textBg);
      this.drawChar(this.cursorX, this.cursorY, ch.codePointAt(0), this.textColor, this.textBg, this.textSize);
      this.cursorX += (FONT_W + 1) * this.textSize;
    }
  }
  println(s = '') { this.print(s + '\n'); }
  textWidth(str, size = this.textSize) { return String(str).length * (FONT_W + 1) * size; }
  textHeight(size = this.textSize) { return (FONT_H + 1) * size; }
  drawCentreString(str, cx, y, color, size = this.textSize) { this.drawString(cx - this.textWidth(str, size) / 2, y, str, color, size); }
  drawRightString(str, rx, y, color, size = this.textSize) { this.drawString(rx - this.textWidth(str, size), y, str, color, size); }
  // --- image / scroll ---
  // TFT_eSPI pushImage(): blit a w*h RGB565 buffer. Pass `trans` to skip a colour key
  // (TFT_eSPI's transparent-colour overload). Out-of-bounds pixels are clipped.
  pushImage(x, y, w, h, data, trans) {
    const key = trans == null ? null : trans;
    if (![x, y, w, h].every(Number.isFinite) || w <= 0 || h <= 0 || !data) return 0;
    if (w * h > 240 * 240) return 0;          // refuse absurd blits instead of hanging
    let drawn = 0;
    w = Math.round(w); h = Math.round(h);
    for (let j = 0; j < h; j++) {
      for (let i = 0; i < w; i++) {
        const v = data[j * w + i];
        if (key != null && v === key) continue;
        if (x + i < 0 || y + j < 0 || x + i >= this.w || y + j >= this.h) continue;
        this.pixel(x + i, y + j, v); drawn++;
      }
    }
    return drawn;
  }
  scroll(dy) {
    if (!Number.isFinite(dy)) return;
    dy = Math.trunc(dy);
    if (Math.abs(dy) >= this.nativeH) { this.fillScreen(COLORS.BLACK); return; }
    const nw = this.nativeW;
    if (dy > 0) this.buf.copyWithin(0, dy * nw); else if (dy < 0) this.buf.copyWithin(-dy * nw, 0);
    const from = dy > 0 ? (this.nativeH - dy) * nw : 0;
    const n = Math.min(Math.abs(dy), this.nativeH) * nw;
    this.buf.fill(COLORS.BLACK, from, from + n);
    this.dirty = true;
  }
  // Copy the RGB565 buffer into a Uint8ClampedArray (RGBA) for canvas blitting.
  toRGBA(out) {
    const n = this.buf.length;
    out = out || new Uint8ClampedArray(n * 4);
    const bl = this.asleep ? 0 : this.backlight;
    for (let i = 0, o = 0; i < n; i++, o += 4) {
      let c = this.buf[i];
      if (this.invert) c = ~c & 0xffff;
      const r = ((c >> 11) & 0x1f) * 255 / 31;
      const g = ((c >> 5) & 0x3f) * 255 / 63;
      const b = (c & 0x1f) * 255 / 31;
      out[o] = r * bl; out[o + 1] = g * bl; out[o + 2] = b * bl; out[o + 3] = 255;
    }
    return out;
  }
}

// ---------------------------------------------------------------------------
// Keyboard: 4 rows x 14 columns = 56 keys (K132 layout)
// Every key has a base legend, a shift legend and an Fn-layer function.
// ---------------------------------------------------------------------------
const K = (id, base, shift, fn) => ({ id, base, shift: shift ?? base, fn: fn ?? null });

const KEY_ROWS = [
  [K('`', '`', '~', 'ESC'), K('1', '1', '!', 'F1'), K('2', '2', '@', 'F2'), K('3', '3', '#', 'F3'),
   K('4', '4', '$', 'F4'), K('5', '5', '%', 'F5'), K('6', '6', '^', 'F6'), K('7', '7', '&', 'F7'),
   K('8', '8', '*', 'F8'), K('9', '9', '(', 'F9'), K('0', '0', ')', 'F10'), K('-', '-', '_', 'BRI-'),
   K('=', '=', '+', 'BRI+'), K('backspace', 'DEL', 'DEL', 'DELETE')],
  [K('tab', 'TAB', 'TAB', null), K('q', 'q', 'Q'), K('w', 'w', 'W'), K('e', 'e', 'E'), K('r', 'r', 'R'),
   K('t', 't', 'T'), K('y', 'y', 'Y'), K('u', 'u', 'U'), K('i', 'i', 'I'), K('o', 'o', 'O'),
   K('p', 'p', 'P'), K('[', '[', '{', 'PREV'), K(']', ']', '}', 'NEXT'), K('\\', '\\', '|', 'MUTE')],
  [K('fn', 'fn', 'fn', null), K('shift', 'SHIFT', 'SHIFT', null), K('a', 'a', 'A'), K('s', 's', 'S'),
   K('d', 'd', 'D'), K('f', 'f', 'F'), K('g', 'g', 'G'), K('h', 'h', 'H'), K('j', 'j', 'J'),
   K('k', 'k', 'K'), K('l', 'l', 'L'), K(';', ';', ':', 'UP'), K("'", "'", '"', 'DOWN'), K('enter', 'ENTER', 'ENTER', null)],
  [K('ctrl', 'CTRL', 'CTRL', null), K('opt', 'OPT', 'OPT', null), K('alt', 'ALT', 'ALT', null),
   K('z', 'z', 'Z'), K('x', 'x', 'X'), K('c', 'c', 'C'), K('v', 'v', 'V'), K('b', 'b', 'B'),
   K('n', 'n', 'N'), K('m', 'm', 'M'), K(',', ',', '<', 'LEFT'), K('.', '.', '>', 'DOWN'),
   K('/', '/', '?', 'RIGHT'), K('space', ' ', ' ', 'HOME')],
];
const KEY_BY_ID = new Map();
KEY_ROWS.forEach((row, r) => row.forEach((k, c) => KEY_BY_ID.set(k.id, { ...k, row: r, col: c })));

const MODIFIERS = new Set(['fn', 'shift', 'ctrl', 'opt', 'alt']);

class Keyboard {
  constructor({ scanMode = 'gpio' } = {}) {
    this.rows = 4; this.cols = 14;
    this.matrix = new Uint8Array(this.rows * this.cols);
    this.scanMode = scanMode;       // 'gpio' (74HC138) | 'tca8418' (I2C expander)
    this.events = [];               // {type:'down'|'up', id, row, col, fn, shift, t}
    this.fifo = [];                 // TCA8418-style 10-entry event FIFO (with overflow)
    this.overflow = 0;
    this.repeatDelay = 400; this.repeatRate = 60;
    const held = new Map();
    this.held = held;               // id -> {since, lastRepeat}
    this.int = false;               // INT line to GPIO11 (ADV)
    this.enabled = true;
    this.charQueue = [];
    this.lastScan = 0;
  }
  idx(row, col) { return row * this.cols + col; }
  isDown(id) { const k = KEY_BY_ID.get(id); return !!k && this.matrix[this.idx(k.row, k.col)] === 1; }
  down(id, t = 0) {
    const k = KEY_BY_ID.get(id);
    if (!k) return false;
    const i = this.idx(k.row, k.col);
    if (this.matrix[i]) return false;
    this.matrix[i] = 1;
    this.held.set(id, { since: t, lastRepeat: t });
    this._pushEvent('down', k, t);
    return true;
  }
  up(id, t = 0) {
    const k = KEY_BY_ID.get(id);
    if (!k) return false;
    const i = this.idx(k.row, k.col);
    if (!this.matrix[i]) return false;
    this.matrix[i] = 0;
    this.held.delete(id);
    this._pushEvent('up', k, t);
    return true;
  }
  releaseAll() { for (const id of [...this.held.keys()]) this.up(id); }
  _pushEvent(type, k, t) {
    const ev = { type, id: k.id, row: k.row, col: k.col, t };
    this.events.push(ev);
    if (this.events.length > 64) this.events.shift();
    // TCA8418 emulation: 10-deep key event FIFO, INT asserted while non-empty
    if (this.scanMode === 'tca8418') {
      if (this.fifo.length >= 10) { this.overflow++; }
      else {
        const code = (type === 'down' ? 1 : 2) << 7 | (k.row < 8 ? k.row + 1 : k.row + 1) << 4 | (k.col + 1);
        this.fifo.push({ code, id: k.id, type });
      }
      this.int = this.fifo.length > 0;
    }
  }
  // TCA8418 register access used by Cardputer-Adv driver demos
  tcaReadReg(reg) {
    if (reg === 0x03) return this.fifo.length ? this.fifo[0].code & 0xff : 0;         // KEY_EVENT_A
    if (reg === 0x04) return this.fifo.length ? (this.fifo[0].code >> 8) & 0xff : 0;
    if (reg === 0x02) return (this.fifo.length << 0);                                // KEY_LCK_EC count
    if (reg === 0x01) return 0;                                                      // KEY_INT_STAT
    return 0;
  }
  tcaWriteReg(reg, v) {
    if (reg === 0x03) { this.fifo.shift(); this.int = this.fifo.length > 0; }
  }
  modifiers() {
    return { fn: this.isDown('fn'), shift: this.isDown('shift'), ctrl: this.isDown('ctrl'), opt: this.isDown('opt'), alt: this.isDown('alt') };
  }
  _legendFor(k, shift) { return shift ? k.shift : k.base; }
  // Translate matrix state -> keyState struct compatible with M5Cardputer.
  keyState() {
    const m = this.modifiers();
    const word = [];
    const fnKeys = [];
    for (let r = 0; r < this.rows; r++) {
      for (let c = 0; c < this.cols; c++) {
        if (!this.matrix[this.idx(r, c)]) continue;
        const k = KEY_ROWS[r][c];
        if (MODIFIERS.has(k.id)) continue;
        if (m.fn && k.fn) { fnKeys.push(k.fn); continue; }
        if (k.id === 'space') { word.push(' '); continue; }
        if (k.id === 'enter' || k.id === 'tab' || k.id === 'backspace') continue;
        word.push(this._legendFor(k, m.shift));
      }
    }
    return {
      ...m, word, fnKeys,
      del: this.isDown('backspace'), enter: this.isDown('enter'), tab: this.isDown('tab'), space: this.isDown('space'),
      esc: m.fn && this.isDown('`'),
      arrows: { up: m.fn && this.isDown(';'), down: m.fn && (this.isDown('.') || this.isDown("'")), left: m.fn && this.isDown(','), right: m.fn && this.isDown('/') },
      ctrl: m.ctrl, opt: m.opt,
    };
  }
  // Auto-repeat while a key is held. Events stay in the queue until the runtime
  // drains them with takeEvents() — otherwise firmware would never see input.
  tick(t) {
    for (const [id, st] of this.held) {
      if (t - st.since > this.repeatDelay && t - st.lastRepeat > this.repeatRate) {
        st.lastRepeat = t;
        this._pushEvent('down', KEY_BY_ID.get(id), t);
      }
    }
  }
  // Decode key-down events into the character stream the firmware reads.
  _emitChars(events) {
    for (const ev of events) {
      if (ev.type !== 'down' || ev._charsDone) continue;
      ev._charsDone = true;
      const k = KEY_ROWS[ev.row][ev.col];
      if (MODIFIERS.has(k.id)) continue;
      const m = this.modifiers();
      if (m.fn && k.fn) continue;                    // Fn layer: function, not a character
      let ch = this._legendFor(k, m.shift);
      if (k.id === 'enter') ch = '\n';
      if (k.id === 'tab') ch = '\t';
      if (k.id === 'backspace') ch = '\b';
      if (k.id === 'space') ch = ' ';
      this.charQueue.push(ch);
      if (this.charQueue.length > 128) this.charQueue.shift();
    }
  }
  // Drain the key-event queue. Chars are derived here, so a firmware that only calls
  // takeEvents() still gets the M5Cardputer print stream.
  takeEvents() { const e = this.events; this.events = []; this._emitChars(e); return e; }
  // Characters produced since last call (handles shift + fn layers).
  takeChars() {
    if (this.events.length) this._emitChars(this.events);
    const c = this.charQueue;
    this.charQueue = [];
    return c;
  }
}

// ────────────────────────────────────────────── js/core/peripherals.js
// Peripheral models: audio codec + speaker + mic, IMU, IR blaster, Wi-Fi/BLE
// radio, battery/charger and the virtual microSD card. All of it is DOM-free
// (audio is emitted as events; the UI layer turns events into WebAudio).

// ---------------------------------------------------------------- audio -----
class Speaker {
  constructor() {
    this.bus = new Emitter();
    this.volume = 0.7;
    this.enabled = true;        // NS4150B / NS4168 amp enable
    this.jackPlugged = false;   // 3.5mm on ADV: speaker amp auto-disabled
    this.sampleRate = 44100;
    this.nowPlaying = null;
    this.tones = 0;
  }
  get audible() { return this.enabled && !this.jackPlugged && this.volume > 0; }
  tone(freq, ms = 200, wave = 'square', vol = null) {
    this.tones++;
    this.bus.emit('tone', { freq, ms, wave, vol: vol ?? this.volume, audible: this.audible });
    return this.audible;
  }
  play(samples, rate = 8000) {
    this.bus.emit('samples', { samples, rate, vol: this.volume, audible: this.audible });
  }
  stop() { this.bus.emit('stop'); }
  setVolume(v) { this.volume = clamp(v, 0, 1); }
}

class Microphone {
  constructor() {
    this.sampleRate = 8000;
    this.gain = 1;
    this.recording = false;
    this.jackSource = null;      // UI can inject a real mic sampler: () => [-1..1]
    this.rng = makeRng(0xbeef);
    this.wavePhase = 0;
  }
  level() {
    if (this.jackSource) return Math.abs(this.jackSource());
    this.wavePhase += 0.3;
    return 0.05 + 0.03 * Math.sin(this.wavePhase);
  }
  // SPM1423 (v1.x) / ES8311 ADC (ADV) model: returns normalized samples.
  record(ms, rate = this.sampleRate) {
    const n = Math.max(1, Math.round((ms / 1000) * rate));
    const out = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const t = i / rate;
      let v;
      if (this.jackSource) v = this.jackSource();
      else {
        // ambient room tone + mains hum + a little vocal-ish wobble
        v = 0.04 * Math.sin(2 * Math.PI * 180 * t) + 0.02 * Math.sin(2 * Math.PI * 60 * t)
          + 0.015 * Math.sin(2 * Math.PI * 420 * t * (1 + 0.01 * Math.sin(t * 3)))
          + (this.rng() - 0.5) * 0.03;
      }
      out[i] = clamp(v * this.gain, -1, 1);
    }
    return out;
  }
  rms(samples) {
    let s = 0;
    for (const v of samples) s += v * v;
    return Math.sqrt(s / Math.max(1, samples.length));
  }
}

// ------------------------------------------------------------- BMI270 IMU ---
class Imu {
  constructor({ present = true } = {}) {
    this.present = present;
    this.bus = new Emitter();
    this.addr = 0x68;
    this.accl = { x: 0, y: 0, z: 1 };   // in g
    this.gyro = { x: 0, y: 0, z: 0 };   // deg/s
    this.tilt = { x: 0, y: 0 };         // -1..1 UI tilt pad
    this.noise = 0.004;
    this.rng = makeRng(0x5150);
    this.steps = 0;
    this._lastAcc = 1;
  }
  setTilt(x, y) { this.tilt.x = clamp(x, -1, 1); this.tilt.y = clamp(y, -1, 1); }
  tick(dt) {
    const gx = this.tilt.x * 0.9, gy = this.tilt.y * 0.9;
    const target = { x: gx, y: gy, z: Math.sqrt(Math.max(0.05, 1 - gx * gx - gy * gy)) };
    const k = Math.min(1, dt * 12);
    this.accl.x += (target.x - this.accl.x) * k;
    this.accl.y += (target.y - this.accl.y) * k;
    this.accl.z += (target.z - this.accl.z) * k;
    this.gyro.x = (this.accl.y * 57) + (this.rng() - 0.5) * 0.6;
    this.gyro.y = (-this.accl.x * 57) + (this.rng() - 0.5) * 0.6;
    this.gyro.z = (this.rng() - 0.5) * 1.2;
    const mag = Math.hypot(this.accl.x, this.accl.y, this.accl.z);
    if (this._lastAcc < 1.25 && mag > 1.6) this.steps++;
    this._lastAcc = mag;
  }
  getAccel() {
    if (!this.present) return null;
    return { x: this.accl.x + (this.rng() - 0.5) * this.noise, y: this.accl.y + (this.rng() - 0.5) * this.noise, z: this.accl.z + (this.rng() - 0.5) * this.noise };
  }
  getGyro() { return this.present ? { ...this.gyro } : null; }
  // raw register style read used by I2C demos
  readReg(reg) {
    if (reg === 0x00) return 0x24; // CHIP_ID
    return 0;
  }
}

// ------------------------------------------------------------------- IR -----
class Infrared {
  constructor() {
    this.bus = new Emitter();
    this.log = [];               // decoded transmissions
    this.carrierHz = 38000;
    this.lastPulseUs = 0;
    this.captures = [];          // received frames (learn / replay)
    this.rx = null;
  }
  // NEC frame: 9ms lead, 4.5ms space, 32 bits (addr, ~addr, cmd, ~cmd)
  necEncode(addr, cmd) {
    const bits = [];
    const push = (v, n) => { for (let i = 0; i < n; i++) bits.push((v >> i) & 1); };
    push(addr & 0xff, 8); push(~addr & 0xff, 8); push(cmd & 0xff, 8); push(~cmd & 0xff, 8);
    const pulses = [9000, 4500];
    for (const b of bits) { pulses.push(560); pulses.push(b ? 1690 : 560); }
    pulses.push(560);
    return pulses;      // microseconds, alternating mark/space
  }
  sendNec(addr, cmd) {
    const pulses = this.necEncode(addr, cmd);
    const entry = { protocol: 'NEC', addr: addr & 0xff, cmd: cmd & 0xff, at: Date.now(), pulses: pulses.length };
    this.log.unshift(entry);
    if (this.log.length > 40) this.log.pop();
    this.bus.emit('tx', entry);
    return entry;
  }
  // Receiver side: real hardware has an IR photodiode on GPIO44 shared with the
  // emitter, so a remote pressed at the emulated device lands in a capture buffer.
  capture(pulses, { source = 'remote', carriers = 38000 } = {}) {
    const frame = { pulses: Array.from(pulses || []), source, carriers, at: Date.now() };
    this.rx = frame;
    this.captures.push(frame);
    if (this.captures.length > 16) this.captures.shift();
    this.bus.emit('rx', frame);
    return frame;
  }
  learnNec(bytes, { source = 'remote' } = {}) {
    const bits = [];
    for (const byte of bytes) for (let i = 7; i >= 0; i--) bits.push((byte >> i) & 1);
    const pulses = [9000, -4500];
    for (const b of bits) pulses.push(562, b ? -1687 : -562);
    pulses.push(562, -40000);
    return this.capture(pulses, { source });
  }
  // Range table from M5Stack's datasheet: 410 cm at 0 deg, 170 cm at 45 deg, 66 cm
  // at 90 deg. Used by the UI to say whether a shot would actually reach.
  rangeCm(angleDeg = 0) {
    const a = Math.abs(clamp(angleDeg, -90, 90));
    return Math.round(410 - (410 - 170) * (a / 45) * (a <= 45 ? 1 : 0.55) - (a > 45 ? (a - 45) * 2.7 : 0));
  }
  sendRaw(pulses) {
    const entry = { protocol: 'RAW', length: pulses.length, at: Date.now(), pulses: pulses.length };
    this.log.unshift(entry);
    if (this.log.length > 40) this.log.pop();
    this.bus.emit('tx', entry);
    return entry;
  }
}
