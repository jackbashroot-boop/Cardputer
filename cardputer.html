const AP_POOL = [
  { ssid: 'm5stack-lab', bssid: 'aa:bb:cc:11:22:01', auth: 'WPA2', channel: 6, rssi: -52 },
  { ssid: 'CU_5G_8821', bssid: 'aa:bb:cc:11:22:02', auth: 'WPA2', channel: 11, rssi: -71 },
  { ssid: 'Meshtastic-9c31', bssid: 'aa:bb:cc:11:22:03', auth: 'WPA2', channel: 1, rssi: -63 },
  { ssid: 'HomeNet', bssid: 'aa:bb:cc:11:22:04', auth: 'WPA2', channel: 3, rssi: -58 },
  { ssid: 'NETGEAR-ghost', bssid: 'aa:bb:cc:11:22:05', auth: 'OPEN', channel: 8, rssi: -80 },
  { ssid: 'printer-direct', bssid: 'aa:bb:cc:11:22:06', auth: 'WPA2', channel: 6, rssi: -84 },
  { ssid: 'Cardputer-AP', bssid: 'aa:bb:cc:11:22:07', auth: 'WPA2', channel: 11, rssi: -37 },
];

class Radio {
  constructor({ hasWifi = true, hasBle = true } = {}) {
    this.hasWifi = hasWifi; this.hasBle = hasBle;
    this.bus = new Emitter();
    this.rng = makeRng(0x2f2f);
    this.state = 'idle';          // idle | scanning | connecting | connected | failed
    this.ssid = null; this.ip = '0.0.0.0'; this.rssi = null;
    this.timer = 0;
    this.scanResults = [];
    this.txBytes = 0; this.rxBytes = 0;
    this.apMode = false;
  }
  listAccessPoints() {
    return AP_POOL.map(ap => ({ ...ap, rssi: Math.round(ap.rssi + (this.rng() - 0.5) * 6) }))
      .sort((a, b) => b.rssi - a.rssi);
  }
  scan() {
    if (!this.hasWifi) return [];
    this.state = 'scanning';
    this.timer = 0.6;
    this.scanResults = this.listAccessPoints();
    return this.scanResults;
  }
  connect(ssid, password = '') {
    if (!this.hasWifi) return { ok: false, error: 'no wifi hardware' };
    if (!ssid) return { ok: false, error: 'ssid required' };
    this.state = 'connecting'; this.timer = 1.4;
    this._pending = { ssid, password };
    this.bus.emit('state', this.state);
    return { ok: true };
  }
  disconnect() { this.state = 'idle'; this.ssid = null; this.ip = '0.0.0.0'; this.rssi = null; this.bus.emit('state', this.state); }
  tick(dt) {
    if (this.timer > 0) this.timer -= dt;
    if (this.state === 'scanning' && this.timer <= 0) { this.state = 'idle'; this.bus.emit('scan', this.scanResults); }
    if (this.state === 'connecting' && this.timer <= 0) {
      /** @type {{ssid?: string, password?: string}} */
      const p = this._pending || {};
      const known = this.scanResults.length ? this.scanResults : this.listAccessPoints();
      const ap = known.find(a => a.ssid === p.ssid);
      // any password works except for the deliberately secured "m5stack-lab" / "HomeNet"
      const needsPass = ['m5stack-lab', 'HomeNet'].includes(p.ssid);
      if (!ap) { this.state = 'failed'; this.bus.emit('state', this.state, 'no such ssid'); return; }
      if (needsPass && (p.password || '').length < 8) { this.state = 'failed'; this.bus.emit('state', this.state, 'auth failed (min 8 chars)'); return; }
      this.state = 'connected'; this.ssid = p.ssid; this.rssi = ap.rssi;
      this.ip = '192.168.4.' + (20 + Math.floor(this.rng() * 60));
      this.bus.emit('state', this.state, this.ip);
    }
  }
  bleScan() {
    if (!this.hasBle) return [];
    const names = ['Mi Band 7', 'AirPods Pro', 'ESP32-S3-DevKit', 'Tile Mate', 'Cardputer-ADV', 'Shelly-Plus-1PM', 'Logitech K380'];
    return names.map((n, i) => ({ name: n, addr: 'f4:12:fa:' + (16 + i).toString(16) + ':aa:0' + i, rssi: -40 - i * 7 }))
      .sort((a, b) => b.rssi - a.rssi);
  }
}

// ---------------------------------------------------------------- battery ---
class Power {
  constructor({ capacityMah = 1400, hasUsb = true } = {}) {
    this.capacityMah = capacityMah;
    this.percent = 82;
    this.charging = false;
    this.usb = false;
    this.switchOn = true;
    this.milliamps = 120;
    this.volts = 4.05;
    this.chargeCycles = 41;
    this.slept = false;
    // TP4056/TP4057-class charger: ~290 mA CC then CV taper at 4.2 V
    this.chargeCurrentMa = 290;
    this.usbMilliamps = 0;      // what the USB side is delivering
    this.bus = new Emitter();
    this.history = [];
  }
  // 1S Li-ion discharge curve, not a straight line: the knee at ~3.6 V is what makes
  // the last 15 % fall off a cliff on the real thing.
  voltage() {
    const p = clamp(this.percent, 0, 100) / 100;
    const v = 3.20 + 0.70 * Math.pow(p, 0.42) + 0.28 * Math.pow(p, 3.2);
    const sag = (this.milliamps / 1000) * 0.16;                 // internal resistance
    return clamp(v - (this.charging ? 0 : sag), 3.0, this.charging ? 4.2 : 4.2);
  }
  // Active-current budget measured on real hardware: ~165 mA with the keyboard lit
  // and idle, ~256 mA with the IR LED blasting; sleep is a fraction of a µA.
  tick(dt, { loadFactor = 1, wifi = false, jack = false, modulesMa = 0, throttled = false } = {}) {
    let mA = 44 + 96 * loadFactor;                  // SoC + LCD panel + backlight
    if (wifi) mA += 62;
    if (jack) mA += 12;
    if (throttled) mA *= 0.82;
    mA += modulesMa;
    if (this.slept) mA = 0.00026;                   // 0.26 uA light-sleep spec
    this.milliamps = mA;
    if (this.usb) {
      this.charging = this.percent < 99.5;
      // constant-current until 4.15 V, then taper
      const cc = this.percent > 92 ? this.chargeCurrentMa * Math.max(0.08, (100 - this.percent) / 8) : this.chargeCurrentMa;
      this.usbMilliamps = this.charging ? cc : 0;
      if (this.charging) {
        this.percent = clamp(this.percent + ((cc * dt) / 3600) * (100 / this.capacityMah), 0, 100);
      }
    } else {
      this.charging = false;
      this.usbMilliamps = 0;
      const before = this.percent;
      this.percent = clamp(this.percent - (((mA * dt) / 3600) * 100) / this.capacityMah, 0, 100);
      if (before > 5 && this.percent <= 5) this.bus.emit('low');
      if (before > 0 && this.percent <= 0) this.bus.emit('empty');
    }
    this.volts = this.voltage();
    this.history.push(this.volts);
    if (this.history.length > 240) this.history.shift();
  }
  // runtime estimator used by the UI ("1 h 48 m left")
  remainingMinutes(idle = 165) {
    if (this.charging) return null;
    const mA = Math.max(20, this.milliamps || idle);
    return Math.round((this.percent / 100) * this.capacityMah / mA * 60);
  }
}

// ------------------------------------------------------------- microSD ------
class SdCard {
  constructor({ store = null, capacityBytes = 8 * 1024 ** 3 } = {}) {
    this.store = store;                 // {load():obj, save(obj)} persistence adapter
    this.capacityBytes = capacityBytes;
    this.inserted = false;
    this.mountError = null;
    this.files = new Map();             // path -> {dir, data, mtime}
    this.bus = new Emitter();
    this._seed();
  }
  _seed() {
    const now = Date.now();
    const put = (p, data) => this.files.set(p, { dir: false, data, mtime: now });
    const dir = p => this.files.set(p, { dir: true, data: null, mtime: now });
    dir('/'); dir('/apps'); dir('/logs'); dir('/music');
    put('/README.txt', 'Cardputer-EMU virtual microSD\nInsert / eject this card from the Device panel.\nFiles persist locally.\n');
    put('/config.json', JSON.stringify({ owner: 'cardputer', theme: 'dark', boot_sound: true }, null, 2));
    put('/logs/boot.log', '[  0.00] emu-sd mounted\n');
    put('/notes.txt', 'modules: plug/unplug live on the right ->\n');
  }
  insert() {
    this.inserted = true; this.mountError = null;
    if (this.store) {
      const saved = this.store.load();
      if (saved && saved.files) {
        this.files = new Map(Object.entries(saved.files));
        this.capacityBytes = saved.capacityBytes || this.capacityBytes;
      }
    }
    this.bus.emit('mounted', { files: this.files.size });
    return true;
  }
  eject() { this.inserted = false; this.bus.emit('ejected'); return true; }
  persist() {
    if (!this.store || !this.inserted) return;
    this.store.save({ files: Object.fromEntries(this.files), capacityBytes: this.capacityBytes });
  }
  _norm(p) {
    if (!p) return '/';
    p = String(p).replace(/\\/g, '/');
    if (!p.startsWith('/')) p = '/' + p;
    return p.replace(/\/+/, '/');
  }
  mounted() { if (!this.inserted) throw new Error('SD card not mounted'); }
  list(path = '/') {
    this.mounted();
    const base = this._norm(path);
    const out = [];
    for (const [p, f] of this.files) {
      if (p === base) continue;
      const prefix = base === '/' ? '/' : base + '/';
      if (!p.startsWith(prefix)) continue;
      const rest = p.slice(prefix.length);
      if (rest.includes('/')) continue;
      out.push({ name: rest, path: p, dir: f.dir, size: f.dir ? 0 : (typeof f.data === 'string' ? f.data.length : f.data.byteLength), mtime: f.mtime });
    }
    return out.sort((a, b) => (b.dir - a.dir) || a.name.localeCompare(b.name));
  }
  readText(path) {
    this.mounted();
    const f = this.files.get(this._norm(path));
    if (!f || f.dir) return null;
    return typeof f.data === 'string' ? f.data : new TextDecoder().decode(f.data);
  }
  writeText(path, text) {
    this.mounted();
    const p = this._norm(path);
    if (this.usedBytes() + text.length > this.capacityBytes) throw new Error('SD card full');
    this.files.set(p, { dir: false, data: String(text), mtime: Date.now() });
    this.persist();
    return true;
  }
  append(path, text) { return this.writeText(path, (this.readText(path) || '') + text); }
  mkdir(path) { this.mounted(); this.files.set(this._norm(path), { dir: true, data: null, mtime: Date.now() }); this.persist(); return true; }
  remove(path) { this.mounted(); const p = this._norm(path); this.files.delete(p); this.persist(); return true; }
  exists(path) { return this.files.has(this._norm(path)); }
  usedBytes() {
    let n = 0;
    for (const f of this.files.values()) if (!f.dir) n += typeof f.data === 'string' ? f.data.length : f.data.byteLength;
    return n;
  }
  info() {
    return { inserted: this.inserted, capacity: this.capacityBytes, used: this.usedBytes(), free: this.capacityBytes - this.usedBytes(), files: this.files.size };
  }
}

class Rtc {
  constructor() { this.epochOffset = 0; }
  now() { return new Date(Date.now() + this.epochOffset); }
  fmt(d = this.now()) { return d.toTimeString().slice(0, 8); }
}

// ────────────────────────────────────────────── js/core/flash.js
// =============================================================================
//  Flash model: ESP32-S3 partition table, OTA slots, NVS, serial download mode,
//  and firmware-image validation — plus the "install your own program" path so
//  a new app can be dropped into the emulated device without touching hardware.
//
//  This is a *functional* simulator: a real .bin is parsed, checksummed and laid
//  out into the emulated flash, and the emulator reports exactly what esptool
//  would, but it does not execute Xtensa instructions (see docs/ACCURACY.md).
//  Firmware *= cardputer apps written against the M5Cardputer-style API run for
//  real.
// =============================================================================

const SECTOR = 4096;
const FLASH_BASE = 0x0;
const APP_MAGIC = 0xe9;

// Partition layout of an 8 MB ESP32-S3 with two OTA slots (matches what the
// Cardputer/ADV firmware ships in flash; offsets are hex, sizes decimal bytes).
function partitionTable(flashBytes = 8 * 1024 ** 2) {
  const rows = [
    { name: 'nvs', type: 'data', subtype: 'nvs', offset: 0x9000, size: 0x6000 },
    { name: 'otadata', type: 'data', subtype: 'ota', offset: 0xf000, size: 0x2000 },
    { name: 'phy_init', type: 'data', subtype: 'phy', offset: 0x11000, size: 0x1000 },
    { name: 'ota_0', type: 'app', subtype: 'ota_0', offset: 0x20000, size: 0x330000 },
    { name: 'ota_1', type: 'app', subtype: 'ota_1', offset: 0x352000, size: 0x330000 },
    { name: 'spiffs', type: 'data', subtype: 'spiffs', offset: 0x684000, size: 0x160000 },
    { name: 'coredump', type: 'data', subtype: 'coredump', offset: 0x7e4000, size: 0x1c000 },
  ];
  return rows.filter(r => r.offset + r.size <= flashBytes);
}

function findPartition(table, name) {
  return table.find(p => p.name === name) || null;
}

// ---------------------------------------------------------------------------
//  ESP32 firmware image parser (ESP-IDF image format v1 + extended header)
// ---------------------------------------------------------------------------
function parseImage(bytes) {
  const b = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes || []);
  if (b.length < 24) return { ok: false, error: `too short (${b.length} B) — not an ESP32 image` };
  const magic = b[0];
  if (magic !== APP_MAGIC) return { ok: false, error: `bad magic ${hex(magic)} (expected 0xE9) — this is not an ESP32 app image` };
  const segments = b[1];
  const flashMode = b[2];
  const flashSizeFreq = b[3];
  const entry = (b[4] | (b[5] << 8) | (b[6] << 16) | (b[7] << 24)) >>> 0;
  const ext = {
    wpPin: b[8], clkQ: b[9], drv: b[10], chipId: (b[13] << 8) | b[12], minRev: b[14], minRevFull: (b[15] << 8) | b[14],
    maxRevFull: (b[16] << 8) | b[17],
  };
  if (segments < 1 || segments > 16) {
    return { ok: false, error: `implausible segment count ${segments} — not an ESP32 app image` };
  }
  const segs = [];
  let p = 24;
  // ESP-IDF image checksum: XOR of every segment *payload* byte, seeded 0xEF.
  // (The image header itself is not checksummed; earlier releases of this
  // parser wrongly required the first 16 header bytes to XOR to 0xEF, which
  // rejected every real firmware image. See docs/FLASH.md.)
  let computedChecksum = 0xef;
  for (let i = 0; i < segments; i++) {
    if (p + 8 > b.length) return { ok: false, error: `truncated at segment ${i}` };
    const addr = (b[p] | (b[p + 1] << 8) | (b[p + 2] << 16) | (b[p + 3] << 24)) >>> 0;
    const len = (b[p + 4] | (b[p + 5] << 8) | (b[p + 6] << 16) | (b[p + 7] << 24)) >>> 0;
    p += 8;
    if (p + len > b.length) return { ok: false, error: `segment ${i} runs past end of file` };
    for (let j = p; j < p + len; j++) computedChecksum ^= b[j];
    segs.push({ addr, len, off: p });
    p += len;
  }
  // The checksum byte is stored so that the image length up to and including
  // it is a multiple of 16 bytes; zero padding sits between the last segment
  // payload and the checksum byte.
  const csumOff = p + ((15 - (p % 16)) + 16) % 16;
  if (csumOff >= b.length) return { ok: false, error: 'truncated: image checksum byte is missing' };
  const checksum = b[csumOff];
  if (checksum !== computedChecksum) {
    return { ok: false, error: `image checksum mismatch (computed ${hex(computedChecksum)}, stored ${hex(checksum)}) — corrupted image` };
  }
  // An appended SHA-256, when present, is exactly the 32 bytes after the
  // checksum byte and hashes everything up to and including that byte.
  const trailing = b.length - (csumOff + 1);
  const hashAppended = trailing === 32;
  let hashVerified = false;
  if (hashAppended) {
    const actual = [...b.subarray(csumOff + 1)].map(v => v.toString(16).padStart(2, '0')).join('');
    if (sha256Hex(b.subarray(0, csumOff + 1)) !== actual) {
      return { ok: false, error: 'appended SHA-256 mismatch — corrupted image' };
    }
    hashVerified = true;
  } else if (trailing !== 0) {
    return { ok: false, error: `${trailing} unexpected trailing byte(s) after image checksum` };
  }
  return {
    ok: true,
    size: b.length,
    segments: segs,
    segCount: segments,
    entry,
    entryHex: '0x' + entry.toString(16).toUpperCase().padStart(8, '0'),
    flashMode: ['QIO', 'QOUT', 'DIO', 'DOUT'][flashMode & 3] || '?',
    flashFreq: ['40', '26', '20', '80'][(flashSizeFreq >> 4) & 3] + ' MHz',
    flashSize: ['1 MB', '2 MB', '4 MB', '8 MB', '16 MB'][(flashSizeFreq >> 0) & 7] || '?',
    chip: ({ 0: 'ESP32', 2: 'ESP32-S2', 5: 'ESP32-C3', 9: 'ESP32-S3', 12: 'ESP32-C2', 13: 'ESP32-C6' })[ext.chipId] || 'chip ' + ext.chipId,
    checksum,
    computedChecksum,
    checksumOffset: csumOff,
    hashAppended,
    hashVerified,
    appDesc: readAppDesc(b, segs),
  };
}


// Minimal synchronous SHA-256 (FIPS 180-4) over a Uint8Array -> lowercase hex.
// parseImage() is synchronous UI code, so it cannot await crypto.subtle; this
// keeps real appended-hash verification honest in both browser and Node.
const SHA256_K = [
  0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
  0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
  0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
  0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
  0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
  0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
  0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
  0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2,
];
function sha256Hex(data) {
  const rotr = (x, n) => (x >>> n) | (x << (32 - n));
  const H = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
  const bitLen = data.length * 8;
  const paddedLen = (((data.length + 9 + 63) // 0x80 byte + 8-byte length, rounded up
    / 64) | 0) * 64;
  const msg = new Uint8Array(paddedLen);
  msg.set(data);
  msg[data.length] = 0x80;
  const dv = new DataView(msg.buffer);
  dv.setUint32(paddedLen - 4, bitLen >>> 0);
  dv.setUint32(paddedLen - 8, Math.floor(bitLen / 4294967296));
  const w = new Uint32Array(64);
  for (let chunk = 0; chunk < paddedLen; chunk += 64) {
    for (let i = 0; i < 16; i++) w[i] = dv.getUint32(chunk + i * 4);
    for (let i = 16; i < 64; i++) {
      const s0 = rotr(w[i - 15], 7) ^ rotr(w[i - 15], 18) ^ (w[i - 15] >>> 3);
      const s1 = rotr(w[i - 2], 17) ^ rotr(w[i - 2], 19) ^ (w[i - 2] >>> 10);
      w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0;
    }
    let [a, b, c, d, e, f, g, h] = H;
    for (let i = 0; i < 64; i++) {
      const S1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25);
      const ch = (e & f) ^ (~e & g);
      const t1 = (h + S1 + ch + SHA256_K[i] + w[i]) | 0;
      const S0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22);
      const maj = (a & b) ^ (a & c) ^ (b & c);
      const t2 = (S0 + maj) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0;
      d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    H[0] = (H[0] + a) | 0; H[1] = (H[1] + b) | 0; H[2] = (H[2] + c) | 0; H[3] = (H[3] + d) | 0;
    H[4] = (H[4] + e) | 0; H[5] = (H[5] + f) | 0; H[6] = (H[6] + g) | 0; H[7] = (H[7] + h) | 0;
  }
  return H.map(v => (v >>> 0).toString(16).padStart(8, '0')).join('');
}

// ESP-IDF puts an esp_app_desc_t at the start of the first segment (.rodata).
function readAppDesc(b, segs) {
  const seg = segs[0];
  if (!seg || seg.len < 256) return null;
  const o = seg.off;
  const magic = (b[o] | (b[o + 1] << 8) | (b[o + 2] << 16) | (b[o + 3] << 24)) >>> 0;
  if (magic !== 0xabcd5432) return null;
  const dec = new TextDecoder();
  const str = (at, n) => dec.decode(b.slice(at, at + n)).replace(/\0+$/, '');
  return {
    version: str(o + 16, 32),
    project: str(o + 48, 32),
    time: str(o + 80, 16),
    date: str(o + 96, 16),
    idf: str(o + 112, 32),
    elfSha: [...b.slice(o + 144, o + 176)].map(v => v.toString(16).padStart(2, '0')).join(''),
  };
}

// ---------------------------------------------------------------------------
//  NVS — a tiny key/value partition with the corners that matter (types,
//  per-key persistence, namespaces, and a bounded size in bytes)
// ---------------------------------------------------------------------------
const NS = 'cardputer';

class Nvs {
  constructor(map = {}) {
    this.map = new Map(Object.entries(map));
    this.dirty = false;
  }
  _k(k, ns = NS) { return `${ns}:${k}`; }
  get(k, dflt = null, ns = NS) {
    const e = this.map.get(this._k(k, ns));
    return e === undefined ? dflt : e.v;
  }
  set(k, v, ns = NS) {
    if (typeof v === 'string' && v.length > 4000) throw new Error('NVS value too long (4000 B max)');
    this.map.set(this._k(k, ns), { v, t: Array.isArray(v) ? 'blob' : typeof v === 'number' ? 'i32' : typeof v === 'boolean' ? 'u8' : 'str' });
    this.dirty = true;
    return true;
  }
  erase(k, ns = NS) { this.dirty = this.map.delete(this._k(k, ns)) || this.dirty; return true; }
  entries(ns = null) {
    const out = [];
    for (const [k, e] of this.map) {
      const [kns, key] = [k.slice(0, k.indexOf(':')), k.slice(k.indexOf(':') + 1)];
      if (ns && kns !== ns) continue;
      out.push({ ns: kns, key, type: e.t, value: e.v });
    }
    return out.sort((a, b) => (a.ns + a.key).localeCompare(b.ns + b.key));
  }
  usedBytes() {
    let n = 0;
    for (const [k, e] of this.map) n += 32 + k.length + (typeof e.v === 'string' ? e.v.length : 8);
    return n + 64;
  }
  toJSON() { return Object.fromEntries(this.map); }
}

// ---------------------------------------------------------------------------
//  FlashManager — the thing a "programmer" or the UI would drive
// ---------------------------------------------------------------------------
class FlashManager {
  constructor(device, runtime, { store = null, onEvent = null } = {}) {
    this.device = device;
    this.runtime = runtime;
    this.store = store;                     // {load(), save(obj)} persistence adapter
    this.bus = new Emitter();
    this.onEvent = onEvent;
    this.nvs = new Nvs();
    this.table = partitionTable(device?.variant?.flashBytes || 8 * 1024 ** 2);
    this.slot = 'ota_0';                    // active app slot
    this.appImages = { ota_0: null, ota_1: null };
    this.downloadMode = false;
    this.busy = false;
    this.mac = this._mac();
    this.rng = makeRng(0x5eed);
    this.apps = new Map();                  // user firmware apps: id -> {id, name, version, source, installed}
    this._load();
  }

  // ---- persistence -------------------------------------------------------
  _load() {
    if (!this.store) return;
    const saved = this.store.load();
    if (!saved) return;
    if (saved.nvs) this.nvs = new Nvs(saved.nvs);
    this.slot = saved.slot === 'ota_1' ? 'ota_1' : 'ota_0';
    this.appImages = { ota_0: saved.appImages?.ota_0 || null, ota_1: saved.appImages?.ota_1 || null };
    for (const rec of saved.apps || []) this.apps.set(rec.id, rec);
  }
  persist() {
    if (!this.store) return;
    this.store.save({
      nvs: this.nvs.toJSON(), slot: this.slot, appImages: this.appImages,
      apps: [...this.apps.values()],
    });
  }
  _mac() {
    const r = makeRng(0x3a2b1c);
    return [0x30, 0xed, 0xa0].map(v => v.toString(16)).join(':') + ':' +
      [0, 1, 2].map(() => Math.floor(r() * 256).toString(16).padStart(2, '0')).join(':');
  }

  // ---- introspection -----------------------------------------------------
  info() {
    return {
      chip: 'ESP32-S3 (QFN56) rev v0.2',
      mac: this.mac,
      crystal: '40 MHz',
      flashBytes: this.device?.variant?.flashBytes || 8 * 1024 ** 2,
      psram: 'none (quad-SPI flash only)',
      slot: this.slot,
      table: this.table,
      nvsBytes: this.nvs.usedBytes(),
      download: this.downloadMode,
    };
  }
  imageSummary(slot = this.slot) {
    const img = this.appImages[slot];
    if (!img) return null;
    return img;
  }

  // ---- serial download mode ---------------------------------------------
  // Real hardware: power off, hold G0 (the boot button), plug USB-C -> ROM loader.
  async enterDownloadMode({ hold = 'G0' } = {}) {
    const log = [];
    const push = s => { log.push(s); this.bus.emit('log', s); };
    push('esptool.py v4.8.1');
    push('Found 1 serial port: /dev/ttyACM0 (303A:1001)');
    push(`Connecting${hold === 'G0' ? ' (holding G0 during reset)' : ''}....`);
    push('Detecting chip type... ESP32-S3');
    push(`Chip is ESP32-S3 (QFN56) (revision v0.2)`);
    push('Features: WiFi, BLE, Embedded PSRAM 8MB (AP_3v3)');
    push('Crystal is 40MHz');
    push(`MAC: ${this.mac}`);
    push('Uploading stub...');
    push('Running stub...');
    push('Stub running...');
    push('Changing baud rate to 460800');
    push('Changed.');
    this.downloadMode = true;
    this.device?.enterDownloadMode();
    this.bus.emit('download', true);
    this.persist();
    return { ok: true, log, mac: this.mac };
  }
  exitDownloadMode({ hard = true } = {}) {
    if (!this.downloadMode) return { ok: false, error: 'not in download mode' };
    this.downloadMode = false;
    this.bus.emit('log', hard ? 'Hard resetting via RTS pin...' : 'Leaving...');
    this.device?.serial('[I][boot] leaving download mode — hard reset', 'info');
    this.device && (this.device.mode = 'off');
    this.bus.emit('download', false);
    return { ok: true };
  }

  // ---- flashing ----------------------------------------------------------
  // Writes an image into an OTA slot the way esptool does: erase in 4 KiB
  // sectors, write in blocks, then read back and hash-verify. Progress is
  // reported through onEvent so the UI can show a real progress bar.
  /**
   * @param {{name?: string, bytes?: Uint8Array|ArrayBuffer|number[], slot?: string|null, source?: string}} opts
   */
  async flash({ name = 'firmware.bin', bytes, slot = null, source = 'upload' } = {}) {
    if (this.busy) return { ok: false, error: 'flash already in progress' };
    const raw = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes || []);
    const target = slot || (this.slot === 'ota_0' ? 'ota_1' : 'ota_0');
    const part = findPartition(this.table, target);
    if (!part) return { ok: false, error: `no ${target} partition` };
    if (!this.downloadMode) {
      const r = await this.enterDownloadMode();
      if (!r.ok) return r;
    }
    const img = parseImage(raw);
    if (!img.ok) {
      this.bus.emit('log', `Writing at 0x${part.offset.toString(16)}... failed: ${img.error}`);
      return { ok: false, error: img.error, parsed: img };
    }
    if (raw.length > part.size) {
      const err = `image is ${fmtBytes(raw.length)}, ${target} only holds ${fmtBytes(part.size)}`;
      this.bus.emit('log', err);
      return { ok: false, error: err, parsed: img };
    }
    this.busy = true;
    const t0 = Date.now();
    const sectors = Math.ceil(raw.length / SECTOR);
    const step = Math.max(1, Math.round(sectors / 24));
    this.bus.emit('log', `Configuring flash size... auto-detected ${fmtBytes(this.info().flashBytes)}`);
    this.bus.emit('log', `Compressed ${raw.length} bytes to ${Math.round(raw.length * 0.62)}...`);
    for (let s = 0; s < sectors; s += step) {
      const pct = Math.min(100, Math.round(((s + step) / sectors) * 100));
      this.bus.emit('progress', { phase: 'write', pct, addr: part.offset + s * SECTOR });
      this.onEvent?.('progress', { phase: 'write', pct });
      // yield so the emulator keeps rendering while "flashing"
      await new Promise(r => setTimeout(r, 6));
    }
    this.bus.emit('log', `Writing at 0x${part.offset.toString(16)}... (100 %)`);
    this.bus.emit('progress', { phase: 'verify', pct: 100 });
    this.onEvent?.('progress', { phase: 'verify', pct: 100 });
    // fake-but-honest digest: FNV-1a over the image, so it is stable per file
    let h = 0x811c9dc5;
    for (let i = 0; i < raw.length; i++) { h ^= raw[i]; h = Math.imul(h, 0x01000193) >>> 0; }
    const digest = h.toString(16).padStart(8, '0');
    this.appImages[target] = {
      name, slot: target, offset: part.offset, size: raw.length, source, digest,
      entry: img.entryHex, chip: img.chip, appDesc: img.appDesc, writtenAt: Date.now(),
      seconds: (Date.now() - t0) / 1000,
    };
    this.slot = target;
    this.busy = false;
    this.nvs.set('ota_seq', this.slot === 'ota_0' ? 1 : 2);
    this.bus.emit('log', `Wrote ${raw.length} bytes (${Math.round(raw.length * 0.62)} compressed) at 0x${part.offset.toString(16)} in ${((Date.now() - t0) / 1000).toFixed(2)} seconds`);
    this.bus.emit('log', `Hash of data verified (${digest}).`);
    this.persist();
    this.bus.emit('flashed', this.appImages[target]);
    return { ok: true, parsed: img, image: this.appImages[target] };
  }

  // Roll back to the other OTA slot (what a failed OTA + otadata does).
  switchSlot() {
    const next = this.slot === 'ota_0' ? 'ota_1' : 'ota_0';
    if (!this.appImages[next]) return { ok: false, error: `${next} is empty` };
    this.slot = next;
    this.nvs.set('ota_seq', next === 'ota_0' ? 1 : 2);
    this.persist();
    return { ok: true, slot: next };
  }

  // ---- user programs -----------------------------------------------------
  // A "program" here is a real JS module exporting APP = {id, name, setup, loop}
  // written against the M5Cardputer-style API. It is validated, registered with
  // the runtime, and stored so it survives a reload.
  async installApp(source, meta = {}) {
    const text = String(source || '');
    if (text.length > 512 * 1024) return { ok: false, error: 'program is too large (512 KB max for a JS app)' };
    let mod;
    try {
      const b64 = btoa(unescape(encodeURIComponent(text)));
      mod = await import(/* @vite-ignore */ 'data:text/javascript;base64,' + b64);
    } catch (e) {
      return { ok: false, error: 'syntax/runtime error while loading: ' + e.message };
    }
    const app = mod.APP || mod.default;
    if (!app || typeof app !== 'object') return { ok: false, error: 'program must export APP = { id, name, setup, loop }' };
    if (typeof app.id !== 'string' || !/^[a-z0-9][a-z0-9._-]{1,31}$/i.test(app.id)) {
      return { ok: false, error: 'APP.id must be 2–32 chars of [a-z0-9._-]' };
    }
    if (typeof app.loop !== 'function' && typeof app.setup !== 'function') {
      return { ok: false, error: 'APP needs at least one of setup()/loop()' };
    }
    if (this.runtime?.apps?.has(app.id)) {
      const existing = this.runtime.apps.get(app.id);
      if (existing && existing.system) return { ok: false, error: `"${app.id}" is a built-in app — pick another id` };
    }
    const rec = {
      id: app.id, name: app.name || app.id, version: app.version || '1.0.0',
      installed: Date.now(), meta: { ...meta }, source: text,
    };
    this.apps.set(app.id, rec);
    this.runtime?.apps?.set(app.id, app);
    this.persist();
    this.device?.serial(`[I][ota] installed firmware app "${rec.name}" v${rec.version} (${fmtBytes(text.length)})`, 'info');
    this.bus.emit('installed', rec);
    return { ok: true, app: mod.APP || mod.default, record: rec };
  }
  removeApp(id) {
    if (!this.apps.has(id)) return { ok: false, error: 'no such program' };
    this.apps.delete(id);
    this.runtime?.apps?.delete(id);
    this.persist();
    this.bus.emit('removed', id);
    return { ok: true };
  }
  listApps() { return [...this.apps.values()].map(({ source, ...rest }) => rest); }
  exportApp(id) { return this.apps.get(id)?.source || null; }

  // Restore stored programs into the runtime (called once at boot).
  async restoreApps() {
    const out = [];
    for (const rec of this.apps.values()) {
      try { await this.installApp(rec.source, rec.meta); out.push(rec.id); }
      catch (e) { this.device?.serial(`[W][ota] could not restore ${rec.id}: ${e.message}`, 'warn'); }
    }
    return out;
  }
}

// ────────────────────────────────────────────── js/modules/modules.js
// =============================================================================
//  M5Stack Grove Unit / Cardputer CAP catalog  (hot-pluggable peripherals)
// =============================================================================
//  Every entry is a small device simulator. It registers I2C addresses (or GPIO
//  pins / UART lines / SPI chip-selects) on the emulated buses, exposes live
//  physical state for the UI, and can be plugged or unplugged while firmware is
//  running so apps have to cope with a device that disappears mid-run.
//
//  Driver contract (returned by create(ctx)):
//    state                 plain object, shown in the UI + readable by apps
//    tick(dt)              advance the physics
//    read(addr, reg, n)    I2C master read  -> array of bytes (optional)
//    write(addr, reg, data)I2C master write -> void (optional)
//    setControl(id, value) UI "inject" sliders (optional)
//    gpio(level)           GPIO input module: level changes from the master
//    uartIn(bytes)         bytes sent by the SoC UART
//    spiXfer(bytes)        SPI full-duplex transfer when this module is selected
//    dispose()             called on unplug
// =============================================================================

const be16 = v => [(v >> 8) & 0xff, v & 0xff];
const lerpN = (v, target, k) => v + (target - v) * k;

const MODULE_BY_ID = new Map(MODULE_CATALOG.map(m => [m.id, m]));

// Merge a remote catalog (delivered by the auto-update feed) with the built-in
// one so new modules can appear without shipping a new emulator build.
function mergeCatalog(base, extra) {
  const map = new Map(base.map(m => [m.id, m]));
  for (const m of extra || []) {
    if (!m || !m.id) continue;
    const prev = map.get(m.id);
    map.set(m.id, prev ? { ...prev, ...m, driverFromFeed: !m.create } : m);
  }
  return [...map.values()];
}
