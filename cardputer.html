          <button class="rail-btn" id="btnGrove" title="HY2.0-4P Grove port"><span class="ico">⌗</span><span>Grove</span></button>
        </div>
      </div>
      <div class="chassis-foot">
        <div class="tilt-wrap">
          <div class="tilt-pad" id="tiltPad" title="Tilt the Cardputer (BMI270)">
            <div class="tilt-knob" id="tiltKnob"></div>
            <span class="tilt-label">TILT</span>
          </div>
          <div class="tilt-read" id="tiltRead">x 0.00<br>y 0.00</div>
        </div>
        <div class="hintlist">
          <div><kbd>Esc</kbd> = Fn+<kbd>\`</kbd> (back)</div>
          <div><kbd>↑↓←→</kbd> = Fn+<kbd>; . , /</kbd></div>
          <div><kbd>CapsLock</kbd> = hold <b>Fn</b> layer</div>
          <div>Click any key on the deck — it drives the same matrix.</div>
        </div>
      </div>`;
    this.screen = new ScreenView(this.root.querySelector('#lcd'), this.device, this.root.querySelector('#lcdDim'));
    this.kbv = new KeyboardView(this.root.querySelector('#keyboard'), this.device, {
      onAction: (type, id) => { if (type === 'keydown') this.audio.click(0.8); },
    });
    this.wireRail();
    this.wireTilt();
    this.refresh();
  }
  wireRail() {
    const q = id => this.root.querySelector('#' + id);
    // One physical press = one onRail(action). The visual feedback (click tick,
    // refresh, 160 ms strike) happens locally and never re-enters the dispatcher.
    const action = (el, label) => {
      if (!el) return;
      el.addEventListener('click', () => {
        this.audio.click(1.2);
        el.classList.add('strike');
        setTimeout(() => el.classList.remove('strike'), 160);
        this.onRail?.(label);
        this.refresh();
      });
    };
    action(q('btnPower'), 'power');
    action(q('btnRst'), 'reset');
    action(q('btnBoot'), 'boot');
    action(q('btnUsb'), 'usb');
    action(q('btnSd'), 'sd');
    action(q('btnJack'), 'jack');
    action(q('btnGrove'), 'grove');
    q('irWindow')?.addEventListener('click', () => { this.device.ir.sendNec(0x00, 0x45); this.flashIr(); });
  }
  wireTilt() {
    const pad = this.root.querySelector('#tiltPad');
    const knob = this.root.querySelector('#tiltKnob');
    const read = this.root.querySelector('#tiltRead');
    let dragging = false;
    const move = ev => {
      if (!dragging) return;
      const r = pad.getBoundingClientRect();
      const x = clamp(((ev.clientX - r.left) / r.width) * 2 - 1, -1, 1);
      const y = clamp(((ev.clientY - r.top) / r.height) * 2 - 1, -1, 1);
      this.device.imu.setTilt(x, y);
      this.updateTiltVisual();
    };
    pad.addEventListener('pointerdown', ev => { dragging = true; pad.setPointerCapture(ev.pointerId); move(ev); });
    pad.addEventListener('pointermove', move);
    pad.addEventListener('pointerup', () => { dragging = false; });
    pad.addEventListener('dblclick', () => { this.device.imu.setTilt(0, 0); this.updateTiltVisual(); });
    this._tiltRead = read; this._knob = knob;
    this.updateTiltVisual();
  }
  updateTiltVisual() {
    const t = this.device.imu.tilt;
    if (this._knob) this._knob.style.transform = `translate(${t.x * 26}px, ${t.y * 26}px)`;
    if (this._tiltRead) {
      const a = this.device.imu.getAccel();
      this._tiltRead.innerHTML = a ? `x ${a.x.toFixed(2)}<br>y ${a.y.toFixed(2)}` : 'no IMU';
    }
  }
  flashIr() {
    const el = this.root.querySelector('#irWindow');
    el?.classList.add('blast');
    setTimeout(() => el?.classList.remove('blast'), 220);
  }
  refresh() {
    const d = this.device;
    this.root.querySelector('#skuLabel').textContent = d.variant.sku;
    this.root.querySelector('#fwLabel').textContent = `CardputerOS · emu`;
    const usb = this.root.querySelector('#btnUsb');
    usb.classList.toggle('on', d.usbConnected);
    const sd = this.root.querySelector('#btnSd');
    sd.classList.toggle('on', d.sd.inserted);
    const jack = this.root.querySelector('#btnJack');
    jack.classList.toggle('on', d.audioJack);
    jack.disabled = !d.variant.jack;
    const pwr = this.root.querySelector('#btnPower');
    pwr.classList.toggle('on', d.power.switchOn);
    const led = this.root.querySelector('#ledStrip');
    if (led) {
      const { r, g, b } = d.led;
      led.style.background = `rgb(${r},${g},${b})`;
      led.style.boxShadow = `0 0 ${6 + (r + g + b) / 30}px rgb(${r},${g},${b})`;
    }
    this.root.querySelector('.device-body').dataset.variant = d.variantId;
    this.root.querySelector('.device-body').classList.toggle('powered', d.mode !== 'off');
  }
  tick() {
    this.screen.render();
    this.kbv.sync();
    if (this.device.imu.present && this.device.imu.tilt.x === 0 && this.device.imu.tilt.y === 0 && Math.random() < 0.01) this.updateTiltVisual();
  }
}

// ────────────────────────────────────────────── js/ui/panels.js
// =============================================================================
//  Right-hand console: Modules (hot-plug rack), System, Serial, Updates, Help.
// =============================================================================


function h(tag, props = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (v !== false && v != null) el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.appendChild(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}

const fmtVal = v => {
  if (v == null) return '—';
  if (typeof v === 'number') return Number.isInteger(v) ? String(v) : v.toFixed(2);
  if (typeof v === 'boolean') return v ? 'yes' : 'no';
  if (typeof v === 'string') return v;
  // DataView has no length/iterator, so only index/flat views can be summarised.
  if (ArrayBuffer.isView(v) && !(v instanceof DataView)) {
    const a = /** @type {number[] & {length: number}} */ (/** @type {unknown} */ (v));
    if (a.length > 8) {
      let mn = Infinity, mx = -Infinity;
      for (const x of a) { mn = Math.min(mn, x); mx = Math.max(mx, x); }
      return `${a.length} cells · ${mn.toFixed(1)}…${mx.toFixed(1)}`;
    }
  }
  if (Array.isArray(v)) return '[' + v.slice(0, 4).map(x => fmtVal(x)).join(', ') + ']';
  if (typeof v === 'object') return escapeHtml(JSON.stringify(v).slice(0, 48));
  return String(v);
};

// Only the "physical" fields of a driver's state are interesting to a human.
const HIDDEN_STATE_KEYS = new Set(['frame', 'cmd', 'raw']);

class SidePanels {
  constructor(root, ctx) {
    this.root = root;
    this.ctx = ctx;                 // {device, runtime, updater, app}
    this.tab = 'modules';
    this.filter = 'all';
    this.search = '';
    this.serialPaused = false;
    this.serialFilter = '';
    this.build();
  }
  get device() { return this.ctx.device; }

  build() {
    const TABS = [
      ['modules', 'Modules'], ['flash', 'Flash'], ['bench', 'Bench'],
      ['system', 'System'], ['serial', 'Serial'], ['updates', 'Updates'], ['help', 'Help'],
    ];
    const nav = h('nav', { class: 'tabs' }, TABS.map(([id, label]) =>
      h('button', { class: 'tab' + (id === this.tab ? ' active' : ''), 'data-tab': id, onclick: () => this.setTab(id) }, label)));
    this.nav = nav;
    this.pane = h('div', { class: 'pane' });
    this.root.append(nav, this.pane);
    this.render();
  }
  setTab(id) {
    this.tab = id;
    for (const b of this.nav.querySelectorAll('.tab')) b.classList.toggle('active', b.dataset.tab === id);
    this.render();
  }
  render() {
    const pane = this.pane;
    pane.innerHTML = '';
    pane.classList.remove('serial-pane');
    if (this.tab === 'modules') this.renderModules(pane);
    if (this.tab === 'flash') this.renderFlash(pane);
    if (this.tab === 'bench') this.renderBench(pane);
    if (this.tab === 'system') this.renderSystem(pane);
    if (this.tab === 'serial') this.renderSerial(pane);
    if (this.tab === 'updates') this.renderUpdates(pane);
    if (this.tab === 'help') this.renderHelp(pane);
  }

  // --------------------------------------------------------------- modules --
  renderModules(pane) {
    const d = this.device;
    const ports = h('div', { class: 'ports' },
      this.portChip('grove', d.slotOf('grove').length, 1),
      d.variant.ext ? this.portChip('ext', d.slotOf('ext').length, 1) : null,
      this.sdChip(),
    );
    pane.append(h('div', { class: 'pane-title' }, 'Hardware ports',
      h('span', { class: 'muted' }, 'plug and unplug while the firmware runs')));

    if (!d.variant.ext) {
      pane.append(h('div', { class: 'notice' }, 'This SKU has no EXT header — CAP modules need the Cardputer-Adv.'));
    }
    pane.append(ports);

    // ---- attached modules
    const attached = d.modules;
    pane.append(h('div', { class: 'pane-sub' }, `Attached (${attached.length})`));
    if (!attached.length) {
      pane.append(h('div', { class: 'empty-slot' }, 'Grove port is empty — attach a unit below to see it appear on the I²C bus.'));
    }
    for (const rec of attached) pane.append(this.moduleCard(rec));

    // ---- catalog
    const cats = ['all', 'sensor', 'actuator', 'input', 'radio'];
    const search = h('input', {
      class: 'search', type: 'search', placeholder: 'filter modules…', value: this.search,
      oninput: e => { this.search = e.target.value; this.renderRefreshCatalog(); },
    });
    this.catBar = h('div', { class: 'chipbar' }, cats.map(c =>
      h('button', { class: 'chip' + (this.filter === c ? ' active' : ''), onclick: () => { this.filter = c; this.render(); } }, c)));
    this.catalogList = h('div', { class: 'catalog' });
    pane.append(h('div', { class: 'pane-sub', style: 'margin-top:14px' },
      'Catalog',
      h('span', { class: 'muted' }, `${(d.catalog || []).length} modules · feed-refreshable`)), search, this.catBar, this.catalogList);
    this.renderRefreshCatalog();
  }

  renderRefreshCatalog() {
    if (!this.catalogList) return;
    const d = this.device;
    const list = (d.catalog || []).filter(def => {
      const s = this.search.toLowerCase();
      const hit = !s || (def.name + ' ' + def.sku + ' ' + (def.summary || '') + ' ' + def.id).toLowerCase().includes(s);
      const cat = this.filter === 'all' || (def.tags || []).includes(this.filter)
        || (this.filter === 'input' && (def.tags || []).includes('input'));
      return hit && cat;
    });
    this.catalogList.innerHTML = '';
    for (const def of list) {
      const check = d.checkAttach(def);
      const attachedAlready = !!d.findModule(def.id);
      const row = h('div', { class: 'cat-row' + (check.ok ? '' : ' blocked') },
        h('span', { class: 'mod-dot', style: `background:${def.color || '#64748b'}` }),
        h('div', { class: 'cat-main' },
          h('div', { class: 'cat-name' }, def.name, h('span', { class: 'sku' }, def.sku)),
          h('div', { class: 'cat-sum' }, def.summary || ''),
          h('div', { class: 'cat-meta' },
            h('span', { class: 'tag' }, ECOSYSTEMS[def.eco]?.label.split(' ')[0] || def.eco),
            (def.addrs || []).map(a => h('code', {}, hex(a.addr) + ' ' + a.chip)),
            def.transport !== 'i2c' ? h('span', { class: 'tag' }, def.transport.toUpperCase()) : null,
            def.requires === 'adv' ? h('span', { class: 'tag warn' }, 'ADV only') : null,
          ),
          check.ok ? null : h('div', { class: 'cat-why' }, '! ' + check.error),
        ),
        h('button', {
          class: 'btn tiny' + (check.ok ? ' primary' : ''),
          disabled: !check.ok || attachedAlready,
          onclick: () => this.plug(def.id),
        }, attachedAlready ? 'plugged' : 'plug'),
      );
      this.catalogList.append(row);
    }
    if (!list.length) this.catalogList.append(h('div', { class: 'empty-slot' }, 'no modules match this filter'));
  }

  portChip(eco, used, cap) {
    const e = ECOSYSTEMS[eco];
    return h('div', { class: 'port' + (used ? ' filled' : '') },
      h('div', { class: 'port-name' }, e.label),
      h('div', { class: 'port-count' }, `${used}/${cap}`),
      h('div', { class: 'port-note' }, e.note));
  }
  sdChip() {
    const d = this.device, info = d.sd.info();
    return h('div', { class: 'port' + (d.sd.inserted ? ' filled' : '') },
      h('div', { class: 'port-name' }, 'microSD'),
      h('div', { class: 'port-count' }, d.sd.inserted ? fmtBytes(info.used) : '—'),
      h('div', { class: 'port-note' }, d.sd.inserted ? `${fmtBytes(info.capacity)} FAT32` : 'no card inserted'),
      h('button', { class: 'btn tiny', onclick: () => { d.sd.inserted ? d.sd.eject() : d.sd.insert(); this.ctx.onRefresh?.(); this.render(); } },
        d.sd.inserted ? 'eject' : 'insert'));
  }

  moduleCard(rec) {
    const d = this.device, def = rec.def, inst = rec.inst;
    const state = inst.state || {};
    const keys = Object.keys(state).filter(k => !k.startsWith('_') && !HIDDEN_STATE_KEYS.has(k)).slice(0, 7);
    const card = h('div', { class: 'mod-card', 'data-uuid': rec.uuid },
      h('div', { class: 'mod-head' },
        h('span', { class: 'mod-dot', style: `background:${def.color || '#64748b'}` }),
        h('div', { class: 'mod-title' },
          h('div', { class: 'mod-name' }, def.name),
          h('div', { class: 'mod-sku' }, `${def.sku} · ${def.eco}${def.transport === 'uart' ? ' · UART' : def.transport === 'spi' ? ' · SPI' : ''}`)),
        h('button', { class: 'btn tiny danger', onclick: () => { d.detachModule(rec.uuid); this.ctx.onRefresh?.(); } }, 'unplug')),
      (def.addrs || []).length ? h('div', { class: 'addr-row' }, def.addrs.map(a => h('code', {}, `${hex(a.addr)} ${a.chip}`))) : null,
      keys.length ? h('div', { class: 'live-grid' },
        keys.map(k => h('div', { class: 'live-row' },
          h('span', { class: 'live-k' }, k.replace(/([A-Z])/g, ' $1').toLowerCase()),
          h('span', { class: 'live-v', 'data-live-uuid': rec.uuid, 'data-live-key': k }, fmtVal(state[k]))))) : null,
    );
    const controls = [...(def.controls || []), ...(inst.controls || [])];
    if (controls.length && inst.setControl) {
      const wrap = h('div', { class: 'controls' });
      for (const c of controls) {
        if (c.type === 'button') {
          wrap.append(h('button', {
            class: 'btn tiny', onclick: () => { d.setModuleControl(rec.uuid, c.id, true); this.refreshLive(); },
          }, c.label));
        } else if (c.type === 'color') {
          wrap.append(h('label', { class: 'ctl' }, h('span', {}, c.label),
            h('input', {
              type: 'color', value: inst.state?.[c.id] || '#22d3ee',
              oninput: e => { d.setModuleControl(rec.uuid, c.id, e.target.value); this.ctx.onRgb?.(e.target.value); },
            })));
        } else {
          const live = inst.state?.[c.id] ?? c.min;
          const out = h('span', { class: 'ctl-val' }, fmtVal(live) + (c.unit ? ' ' + c.unit : ''));
          wrap.append(h('label', { class: 'ctl' },
            h('span', {}, c.label),
            h('input', {
              type: 'range', min: c.min, max: c.max, step: c.step || 1, value: live,
              oninput: e => {
                const v = Number(e.target.value);
                d.setModuleControl(rec.uuid, c.id, v);
                out.textContent = fmtVal(v) + (c.unit ? ' ' + c.unit : '');
              },
            }), out));
        }
      }
      card.append(wrap);
    }
    return card;
  }

  refreshLive() {
    if (this.tab !== 'modules') return;
    for (const el of this.pane.querySelectorAll('[data-live-uuid]')) {
      const rec = this.device.modules.find(m => m.uuid === el.dataset.liveUuid);
      if (!rec) continue;
      const v = (rec.inst.state || {})[el.dataset.liveKey];
      const next = fmtVal(v);
      if (el.textContent !== next) el.textContent = next;
    }
  }

  plug(id) {
    const r = this.device.attachModule(id);
    this.ctx.onRefresh?.();
    if (!r.ok) this.ctx.toast?.(r.error, 'error');
    this.render();
  }

  // ---------------------------------------------------------------- system --
  renderSystem(pane) {
    const d = this.device, u = this.ctx.updater;
    // how many catalog entries each SKU could physically host (no state involved)
    const compatible = id => {
      const v = this.ctx.variants[id];
      return (d.catalog || []).filter(def => {
        if (def.requires === 'adv' && v.id !== 'adv') return false;
        if (def.requires === 'imu' && !v.imu) return false;
        if (def.requires === 'jack' && !v.jack) return false;
        if (def.eco === 'ext' && !v.ext) return false;
        if (def.needs5v && !v.groveToggle) return false;
        return true;
      }).length;
    };
    pane.append(h('div', { class: 'card' },
      h('div', { class: 'card-title' }, 'Hardware SKU',
        h('span', { class: 'muted' }, 'swap the board under the running firmware — no re-plugging needed')),
      h('div', { class: 'variant-grid' }, ['cardputer', 'v11', 'adv'].map(id => {
        const spec = this.ctx.variants[id];
        return h('button', {
          class: 'variant' + (d.variantId === id ? ' active' : ''),
          title: `switch to ${spec.label}`,
          onclick: () => { this.ctx.setVariant(id); this.render(); },
        },
          h('div', { class: 'variant-name' }, spec.label),
          h('div', { class: 'variant-sku' }, spec.sku + ' · ' + spec.year),
          h('div', { class: 'variant-feats' }, [
            spec.imu ? 'IMU' : null, spec.jack ? '3.5mm' : null, spec.ext ? 'EXT' : null,
            spec.groveToggle ? '5V toggle' : null,
            spec.keyboard === 'tca8418' ? 'TCA8418' : '74HC138', (spec.battery.total || 0) + 'mAh',
            compatible(id) + ' modules',
          ].filter(Boolean).join(' · ')));
      })),
      h('div', { class: 'muted small' }, 'Swapping rebuilds the pinmap, keyboard controller, audio path, IMU and EXT header. Modules the new SKU cannot host are unplugged and reported; the rest stay attached.')));

    pane.append(h('div', { class: 'card' },
      h('div', { class: 'card-title' }, 'Hardware switches & ports'),
      h('div', { class: 'switch-grid' },
        this.toggle('Power switch', d.power.switchOn, v => this.ctx.setPower(v)),
        this.toggle('USB-C', d.usbConnected, v => this.ctx.setUsb(v)),
        this.toggle('microSD card', d.sd.inserted, v => { v ? d.sd.insert() : d.sd.eject(); this.ctx.onRefresh?.(); this.render(); }),
        this.toggle('3.5 mm jack', d.audioJack, v => this.ctx.setJack(v), d.variant.jack),
        this.toggle(d.variant.battery.base ? 'Battery base 1400 mAh' : 'Single 1500 mAh cell', true, () => { }, true),
        this.toggle('Grove rail 5 V', d.grove5v, v => this.ctx.setGrove5v(v), !d.variant.groveToggle),
      )));

    pane.append(h('div', { class: 'card' },
      h('div', { class: 'card-title' }, 'Display & audio'),
      this.slider('Backlight', d.display.backlight, 0, 1, 0.01, v => { d.display.setBacklight(v); d.display.dirty = true; }, v => Math.round(v * 100) + '%'),
      this.slider('Speaker volume', d.speaker.volume, 0, 1, 0.01, v => d.speaker.setVolume(v), v => Math.round(v * 100) + '%'),
      h('div', { class: 'row' },
        h('button', { class: 'btn tiny', onclick: () => d.speaker.tone(440, 300) }, 'test tone'),
        h('button', { class: 'btn tiny', onclick: () => this.ctx.useRealMic() }, 'use host microphone'),
        h('button', { class: 'btn tiny', onclick: () => d.setLed(Math.floor(Math.random() * 255), Math.floor(Math.random() * 255), Math.floor(Math.random() * 255)) }, 'flash RGB LED'),
      )));

    pane.append(h('div', { class: 'card' },
      h('div', { class: 'card-title' }, 'Power'),
      h('div', { class: 'batt' },
        h('div', { class: 'batt-bar' }, h('i', { style: `width:${d.power.percent}%` })),
        h('div', { class: 'batt-txt' }, `${d.power.percent.toFixed(1)} % · ${d.power.volts.toFixed(2)} V · ${d.power.milliamps.toFixed(0)} mA · ${d.power.charging ? 'charging' : 'discharging'}`)),
      h('div', { class: 'row' },
        h('button', { class: 'btn tiny', onclick: () => this.ctx.reboot() }, 'reboot (RST)'),
        h('button', { class: 'btn tiny', onclick: () => { d.enterDownloadMode(); this.ctx.onRefresh?.(); } }, 'download mode'),
        h('button', { class: 'btn tiny danger', onclick: () => this.ctx.factoryReset() }, 'factory reset'))));

    const info = [
      ['SKU', d.variant.sku], ['SoC', d.variant.soc], ['Flash', fmtBytes(d.variant.flashBytes)],
      ['Keyboard', d.variant.kbChip], ['Audio', d.variant.audio], ['IMU', d.variant.imu ? 'BMI270 @0x68' : '—'],
      ['Grove I²C', d.buses.grove.scan().map(a => hex(a)).join(' ') || '—'],
      ['Internal I²C', d.buses.internal.scan().map(a => hex(a)).join(' ') || '—'],
      ['Firmware', u.version], ['Uptime', `${Math.floor(d.uptime / 60)}m ${Math.floor(d.uptime % 60)}s`],
      ['FPS', (this.ctx.fps?.() || 0).toFixed(0)], ['CPU load', (d.cpuLoad * 100).toFixed(0) + '%'],
      ['Die temp', `${d.thermal.dieC.toFixed(1)} °C${d.thermal.throttled ? ' (throttled)' : ''}`],
      ['Battery est.', d.power.remainingMinutes() == null ? 'charging' : d.power.remainingMinutes() + ' min'],
      ['Watchdog', `${d.wdt.timeoutMs} ms · ${d.wdt.trips} trip(s)`],
    ];
    pane.append(h('div', { class: 'card' },
      h('div', { class: 'card-title' }, 'Inventory'),
      h('table', { class: 'kv' }, info.map(([k, v]) => h('tr', {}, h('th', {}, k), h('td', {}, String(v)))))));
  }

  toggle(label, on, fn, disabled = false) {
    return h('label', { class: 'toggle' + (disabled ? ' disabled' : '') },
      h('input', { type: 'checkbox', checked: on ? '' : null, disabled: disabled ? '' : null, onchange: e => { fn(e.target.checked); this.render(); } }),
      h('span', {}, label));
  }
  slider(label, value, min, max, step, fn, fmt = v => v) {
    const out = h('span', { class: 'ctl-val' }, fmt(value));

  async handleFlashFile(file) {
    const f = this.ctx.flash;
    const out = this.flashEl?.out;
    const log = (m) => { if (out) { out.prepend(h('div', {}, h('span', { class: 'st' }, new Date().toLocaleTimeString()), m)); } };
    const progress = (p) => { const i = this.flashEl?.progress?.querySelector('i'); if (i) i.style.width = (p || 0) + '%'; };
    const name = file.name || 'upload';
    try {
      if (/\.(js|mjs|json|txt)$/i.test(name)) {
        const text = await file.text();
        if (/\.json$/i.test(name)) {
          let pack;
          try { pack = JSON.parse(text); } catch (e) { log('package is not valid JSON: ' + e.message); return; }
          if (pack.modules) {
            this.device.catalog = mergeCatalog(this.device.catalog, pack.modules);
            log(`module package "${pack.name || name}" → ${pack.modules.length} definition(s)`);
            return;
          }
          if (pack.source) { await this.installProgram(pack.source, pack.name); return; }
          log('JSON has neither a module list nor program source'); return;
        }
        await this.installProgram(text, name.replace(/\.[^.]+$/, ''));
        return;
      }
      // binary: ESP32 image
      const buf = new Uint8Array(await file.arrayBuffer());
      const parsed = (await import('../core/flash.js')).parseImage(buf);
      if (!parsed.ok) { log(`${name}: ${parsed.error}`); this.ctx.toast?.(parsed.error, 'error'); return; }
      log(`${name}: ${parsed.chip}, ${parsed.segCount} segments, entry ${parsed.entryHex}, ${parsed.flashMode} @ ${parsed.flashFreq}`);
      if (parsed.appDesc) log(`app: "${parsed.appDesc.project}" v${parsed.appDesc.version} built ${parsed.appDesc.date} on IDF ${parsed.appDesc.idf}`);
      const r = await f.flash({ name, bytes: buf, source: 'upload' });
      if (!r.ok) { log('flash failed: ' + r.error); this.ctx.toast?.('flash failed: ' + r.error, 'error'); return; }
      progress(100);
      log(`flashed into ${r.image.slot} @ 0x${r.image.offset.toString(16)} — verified ${r.image.digest}`);
      log('note: the emulator lays the image into flash but does not run Xtensa code');
      this.ctx.toast?.('image written & verified');
      this.render();
    } catch (e) {
      log('error: ' + e.message);
    }
  }

  async installFromEditor({ run = true } = {}) {
    const src = this.editor?.value || '';
    await this.installProgram(src, this.appName?.value || undefined, { run });
  }

  async installProgram(source, name, { run = true } = {}) {
    const r = await this.ctx.flash.installApp(source, { name });
    if (!r.ok) { this.ctx.toast?.(r.error, 'error'); return r; }
    this.ctx.toast?.(`installed ${r.record.name} v${r.record.version}`, 'ok');
    if (run) this.ctx.runtime.launch(r.record.id);
    this.render();
    return r;
  }

  downloadApp(id) {
    const src = this.ctx.flash.exportApp(id);
    if (!src) return;
    const blob = new Blob([src], { type: 'text/javascript' });
    const a = h('a', { href: URL.createObjectURL(blob), download: id + '.js' });
    document.body.appendChild(a); a.click(); a.remove();
  }

        h('button', { class: 'btn tiny', onclick: () => { const p = (this.sdBrowse === '/' ? '' : this.sdBrowse) + '/emu-note.txt'; sd.writeText(p, 'written from the bench at ' + new Date().toISOString() + '\n'); this.render(); } }, 'write test file'))));

    // IR
    const caps = d.ir.captures.slice(-5).reverse();
    pane.append(h('div', { class: 'card' },
      h('div', { class: 'card-title' }, 'IR', h('span', { class: 'muted' }, `NEC @ ${d.ir.carrierHz / 1000} kHz`)),
      h('div', { class: 'row' },
        h('button', { class: 'btn tiny', onclick: () => { d.ir.sendNec(0x00, 0x45); this.render(); } }, 'blast NEC 0x45'),
        h('button', { class: 'btn tiny', onclick: () => { d.ir.learnNec([0x00, 0xff, 0x45, 0xba], { source: 'bench remote' }); this.render(); } }, 'simulate a remote press'),
      ),
      caps.length ? h('div', { class: 'filelist' }, caps.map((c, i) => h('div', { class: 'file-row' },
        h('span', { class: 'fname' }, `${c.source} · ${c.pulses.length} pulses · ${c.carriers / 1000} kHz`),
        h('button', { class: 'btn tiny', onclick: () => { d.ir.sendRaw(c.pulses); this.ctx.toast?.('replayed'); } }, 'replay'))))
        : h('div', { class: 'muted small' }, 'no captures — press “simulate a remote press”'),
      h('div', { class: 'muted small' }, `datasheet range: ${d.ir.rangeCm(0)} cm @ 0° · ${d.ir.rangeCm(45)} cm @ 45° · ${d.ir.rangeCm(90)} cm @ 90°`)));

    // radio + mic
    const aps = d.radio.scan();
    pane.append(h('div', { class: 'card' },
      h('div', { class: 'card-title' }, 'Wi-Fi / BLE', h('span', { class: 'muted' }, d.radio.state + (d.radio.ssid ? ' · ' + d.radio.ssid : ''))),
      h('div', { class: 'filelist' }, aps.slice(0, 5).map(a => h('div', { class: 'file-row' },
        h('span', { class: 'fname' }, a.ssid), h('span', { class: 'muted' }, a.rssi + ' dBm · ' + a.auth),
        h('button', { class: 'btn tiny', onclick: () => { d.radio.connect(a.ssid); this.render(); } }, 'connect')))),
      h('div', { class: 'row' },
        h('button', { class: 'btn tiny', onclick: () => { d.radio.disconnect(); this.render(); } }, 'disconnect'),
        h('button', { class: 'btn tiny', onclick: () => this.ctx.useRealMic?.() }, 'route host mic'),
        h('span', { class: 'muted' }, `mic ${(d.mic.level() * 100).toFixed(0)} %`))));

    // NVS quick look + reset
    pane.append(h('div', { class: 'card' },
      h('div', { class: 'card-title' }, 'NVS / boot counters'),
      h('table', { class: 'kv' }, (f?.nvs.entries() || []).slice(0, 8).map(e => h('tr', {}, h('th', {}, e.key), h('td', {}, String(e.value)))))));
  }

  // ------------------------------------------------------------------ tick --
  tick() {
    if (this.tab === 'modules') this.refreshLive();
    if (this.tab === 'bench' && !this._benchAt) this._benchAt = 0;
    if (this.tab === 'bench') {
      const now = performance.now();
      if (now - (this._benchAt || 0) > 1500) { this._benchAt = now; this.render(); }
    }
    if (this.tab === 'serial' && !this.serialPaused) this.renderSerialLines();
  }
}

// ────────────────────────────────────────────── js/ui/updater.js
// =============================================================================
//  Client-side updater facade.
//  * native mode  -> talks to the Python launcher (/api/update/*)
//  * browser mode -> soft updates only: module catalog + firmware app packages
// =============================================================================


// UTF-8 safe base64 for `import()` of a data: URL — avoids the deprecated unescape().
const toB64Utf8 = src => {
  const bytes = new TextEncoder().encode(src);
  let bin = '';
  for (const b of bytes) bin += String.fromCharCode(b);
  return btoa(bin);
};

class EmuUpdater {
  constructor({ device, runtime, native = null, feedUrl = '', channel = 'stable', auto = true, version = '1.0.0' }) {
    this.device = device;
    this.runtime = runtime;
    this.native = native;         // {version, channel, feed, autoUpdate, dataDir} injected by the launcher
    this.feedUrl = feedUrl;
    this.channel = native?.channel || channel;
    this.auto = native?.autoUpdate ?? auto;
    this.version = native?.version || version;
    this.available = null;        // manifest entry for the newest version
    this.installedApps = [];      // soft-installed firmware app URLs
    this.onSoft = null;           // main.js persists this list
    this.history = [];
    this.lastCheck = null;
    this.log = [];
    this.onChange = () => {};
  }
  get hasNative() { return !!this.native; }
  note(msg) { this.log.unshift({ t: new Date().toTimeString().slice(0, 8), msg }); if (this.log.length > 60) this.log.pop(); this.onChange(); }

  async check() {
    try {
      if (this.hasNative) {
        const r = await fetch('/api/update/check?' + new URLSearchParams({ channel: this.channel }));
        const j = await r.json();
        this.lastCheck = new Date();
        this.available = j.available || null;
        this.version = j.current || this.version;
        if (Array.isArray(j.releases)) this._feed = { releases: j.releases };
        this.relay(j.log || []);
        this.note(j.available ? `update available: ${j.available.version}` : 'already up to date');
        this.onChange();
        return j;
      }
      // browser mode: compare against the bundled feed manifest
      const feed = await this.fetchFeed();
      this.lastCheck = new Date();
      const cand = (feed.releases || [])
        .filter(r => r.channel === this.channel || this.channel === 'beta')
        .sort((a, b) => compareVersions(b.version, a.version))[0];
      this.available = cand && compareVersions(cand.version, this.version) > 0 ? cand : null;
      this.note(this.available ? `feed offers v${this.available.version}` : 'already up to date');
      return { current: this.version, available: this.available, feed, native: false };
    } catch (e) {
      this.note('update check failed: ' + e.message);
      return { current: this.version, available: null, error: e.message };
    }
  }

  async fetchFeed() {
    if (this._feed) return this._feed;
    const inline = typeof document !== 'undefined' && document.getElementById('feed-manifest');
    if (inline && inline.textContent.trim().length > 2) {
      try { this._feed = JSON.parse(inline.textContent); return this._feed; } catch { /* fall through */ }
    }
    const urls = [this.feedUrl, 'updates/manifest.json', '../updates/manifest.json', '/updates/manifest.json'].filter(Boolean);
    for (const u of urls) {
      try { const r = await fetch(u, { cache: 'no-store' }); if (r.ok) { this._feed = await r.json(); return this._feed; } } catch { /* next */ }
    }
    return { releases: [] };
  }

  relay(lines) { for (const l of lines) this.log.unshift({ t: new Date().toTimeString().slice(0, 8), msg: l }); }

  async install(version = null) {
    const target = version || this.available?.version;
    if (!target) return { ok: false, error: 'nothing to install' };
    if (this.hasNative) {
      const r = await fetch('/api/update/apply', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ version: target }) });
      const j = await r.json();
      this.relay(j.log || []);
      if (!j.ok) { this.note('install failed: ' + (j.error || 'unknown')); this.onChange(); return j; }
      this.version = target;
      this.available = null;
      if (j.soft) {
        const softLog = await this.applySoft(j.soft);
        this.relay(softLog);
      }
      this.note(`installed v${target} — core bundle applies on next launch, soft payload is live now`);
      this.onChange();
      return j;
    }
    // browser mode: only the soft payload (catalog + firmware apps) can be applied
    const rel = (await this.fetchFeed()).releases?.find(r => r.version === target);
    if (!rel) return { ok: false, error: 'release is not in the feed' };
    const softLog = await this.applySoft(rel.soft || {});
    this.relay(softLog);
    if (!softLog.length) {
      return { ok: false, error: 'nothing applied', log: ['core binaries can only be replaced by the launcher: python run.py --update'] };
    }
    this.version = target;
    this.available = null;
    this.note(`soft-updated to ${target} (catalog + apps)`);
    this.onChange();
    return { ok: true, soft: true, log: softLog };
  }

  // Merge a feed catalog and install feed-delivered firmware apps.
  async applySoft(soft = {}) {
    const log = [];
    if (soft.catalog) {
      try {
        const r = await fetch(soft.catalog, { cache: 'no-store' });
        if (r.ok) {
          const j = await r.json();
          this.device.catalog = mergeCatalog(this.device.catalog, j.modules || []);
          log.push(`catalog ${j.version || ''} merged — ${(j.modules || []).length} new module definition(s)`);
        } else log.push(`catalog fetch failed: HTTP ${r.status}`);
      } catch (e) { log.push('catalog fetch failed: ' + e.message); }
    }
    for (const url of soft.apps || []) {
      try {
        await this.loadApp(url);
        log.push(`installed app package ${url}`);
        if (!this.installedApps.includes(url)) this.installedApps.push(url);
      } catch (e) { log.push(`app ${url} failed: ${e.message}`); }
    }
    if (soft.apps?.length) this.onSoft?.(this.installedApps);
    return log;
  }

  async loadApp(url) {
    const r = await fetch(url, { cache: 'no-store' });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const src = await r.text();
    const b64 = toB64Utf8(src);
    const mod = await import(/* @vite-ignore */ 'data:text/javascript;base64,' + b64);
    const app = mod.APP || mod.default;
    if (!app || !app.id) throw new Error('package does not export APP');
    this.runtime.apps.set(app.id, app);
    this.note(`registered firmware app "${app.name}" v${app.version || '1.0.0'}`);
    return app;
  }

  async installSoft() {
    const rel = (this.available || (await this.fetchFeed()).releases?.[0]) || null;
    const soft = rel?.soft || { catalog: 'updates/catalog.json' };
    const log = await this.applySoft(soft);
    this.relay?.([]);
    for (const l of log) this.note(l);
    this.onChange();
    return { ok: log.length > 0, log };
  }

  async rollback() {
    if (!this.hasNative) return { ok: false, error: 'rollback needs the desktop launcher (python run.py --rollback)' };
    const r = await fetch('/api/update/rollback', { method: 'POST' });
    const j = await r.json();
    this.relay(j.log || []);
    this.note(j.ok ? 'rolled back to ' + j.version : 'rollback failed: ' + j.error);
    return j;
  }

  setChannel(ch) { this.channel = ch; this.note('channel → ' + ch); }
  setAuto(v) { this.auto = !!v; this.note('auto-update ' + (this.auto ? 'enabled' : 'disabled')); }
}

// ────────────────────────────────────────────── js/main.js
// =============================================================================
//  Bootstrap: builds the device, the firmware runtime, the chassis and panels.
// =============================================================================









const VERSION = '1.0.0';

// ---------------------------------------------------------- persistence -----
// Sandboxed iframes (e.g. the Arena preview) throw on localStorage access, so
// every call goes through this guard.
const LS = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch { /* blocked */ } },
  del(k) { try { localStorage.removeItem(k); } catch { /* blocked */ } },
};

const localStore = {
  key: 'cardputer-emu.sd',
  load() { try { return JSON.parse(LS.get(this.key) || 'null'); } catch { return null; } },
  save(v) { LS.set(this.key, JSON.stringify(v)); },
};
const nativeApi = {
  available: false,
  async probe() {
    if (typeof location !== 'undefined' && location.protocol === 'file:') return null;   // single-file mode
    if (!document.querySelector('meta[name="cardputer-native"]')) return null;           // preview / static host
    try {
      const r = await fetch('/api/info', { cache: 'no-store' });
      if (!r.ok) return null;
      const j = await r.json();
      if (!j || !j.native) return null;
      this.available = true;
      this.info = j;
      return j;
    } catch { return null; }
  },
  async loadState() {
    try { const r = await fetch('/api/state', { cache: 'no-store' }); return r.ok ? await r.json() : null; } catch { return null; }
  },
  async saveState(state) {
    try { await fetch('/api/state', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(state) }); } catch { /* ignore */ }
  },
};

// NVS + installed user programs live next to the SD card state: native launcher
// when there is one, localStorage in the single-file build.
function makeFlashStore() {
  if (nativeApi.available) {
    return {
      load: () => (stateCache && stateCache.flash) || null,
      save: v => { stateCache = { ...(stateCache || {}), flash: v }; queueSave(); },
    };
  }
  return {
    key: 'cardputer-emu.flash',
    load() { try { return JSON.parse(LS.get(this.key) || 'null'); } catch { return null; } },
    save(v) { LS.set(this.key, JSON.stringify(v)); },
  };
}

function makeSdStore() {
  if (nativeApi.available) {
    return {
      load: () => (stateCache && stateCache.sd) || null,
      save: v => { stateCache = { ...(stateCache || {}), sd: v }; queueSave(); },
    };
  }
  return localStore;
}

let stateCache = null;
let saveTimer = null;
function queueSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    const snap = { ...(stateCache || {}), ...app.snapshot() };
    stateCache = snap;
    if (nativeApi.available) nativeApi.saveState(snap);
    else LS.set('cardputer-emu.state', JSON.stringify(snap));
  }, 400);
}

// --------------------------------------------------------------- the app ----
const app = {
  device: null, runtime: null, chassis: null, panels: null, updater: null,
  audio: null, startTime: 0, fps: 0,
  snapshot() {
    return {
      settings: {
        variant: this.device.variantId,
        channel: this.updater.channel,
        autoUpdate: this.updater.auto,
        feed: this.updater.feedUrl,
        volume: this.device.speaker.volume,
        backlight: this.device.display.backlight,
        battery: this.device.power.percent,
        modules: this.device.modules.map(m => m.def.id),
        sdInserted: this.device.sd.inserted,
        usb: this.device.usbConnected,
        jack: this.device.audioJack,
        grove5v: this.device.grove5v,
      },
    };
  },
};

async function boot() {
  const native = await nativeApi.probe();
  stateCache = native ? await nativeApi.loadState() : (() => {
    try { return JSON.parse(LS.get('cardputer-emu.state') || 'null'); } catch { return null; }
  })();
  const settings = stateCache?.settings || {};

  const device = new Cardputer({
    variant: settings.variant || 'adv',
    catalog: MODULE_CATALOG,
    store: { sd: makeSdStore() },
  });
  const audio = new AudioOut();
  const runtime = new Runtime(device, { apps: BUILTIN_APPS, version: native?.version || VERSION, fetcher: makeFetcher(native) });
  const flash = new FlashManager(device, runtime, { store: makeFlashStore() });
  runtime.flash = flash;
  flash.bus.on('log', line => device.serial('[flash] ' + line, 'info'));
  const updater = new EmuUpdater({
    device, runtime,
    native: native ? { version: native.version, channel: settings.channel || native.channel, feed: native.feed, autoUpdate: native.autoUpdate ?? true } : null,
    feedUrl: settings.feed || 'updates/manifest.json',
    channel: settings.channel || 'stable',
    version: native?.version || VERSION,
  });
  app.device = device; app.runtime = runtime; app.audio = audio; app.updater = updater; app.flash = flash;

  // feed-delivered firmware apps survive restarts
  updater.onSoft = urls => { stateCache = { ...(stateCache || {}), settings: { ...(stateCache?.settings || {}), installedApps: urls } }; queueSave(); };
  for (const url of settings.installedApps || []) {
    updater.loadApp(url).catch(e => console.warn('app restore failed', url, e.message));
  }

  // ---- speakers / module sounds
  device.speaker.bus.on('tone', t => audio.tone(t));
  device.bus.on('module-event', ({ id, evt, payload }) => {
    if (evt === 'relay') audio.click(2.2);
    if (evt === 'buzz') audio.tone({ freq: payload.freq || 2400, ms: 120, wave: 'square', vol: 0.4, audible: true });
    if (evt === 'rfid') audio.tone({ freq: 1800, ms: 60, wave: 'sine', vol: 0.3, audible: true });
    if (evt === 'button') audio.click(1.4);
    if (evt === 'pir') audio.click(0.7);
    toast(`${id}: ${evt}`);
  });
  device.ir.bus.on('tx', e => app.chassis?.flashIr());

  // ---- chassis + panels
  const chassisRoot = document.querySelector('#deviceStage');
  const chassis = new Chassis(chassisRoot, device, audio);
  app.chassis = chassis;

  const panels = new SidePanels(document.querySelector('#console'), {
    device, runtime, updater, variants: VARIANTS,
    // runtime.fps is the measured LCD frame rate (app.fps was never updated -> always 0)
    fps: () => app.runtime.fps,
    toast: (msg, lvl) => toast(msg, lvl),
    onRefresh: () => { chassis.refresh(); refreshStatus(); panels.refreshLive(); },
    onRgb: () => { },
    flash,
    setVariant: id => {
      const res = device.setVariant(id);
      if (!res.ok) { toast(res.error, 'error'); return res; }
      if (!res.changed) return res;
      runtime.reboot();
      panels.render(); chassis.refresh(); refreshStatus(); queueSave();
      const n = res.ejected.length;
      toast(`swapped to ${VARIANTS[id].label}` + (n ? ` — ${n} module${n > 1 ? 's' : ''} unplugged (not physically supported)` : ''),
        n ? 'warn' : 'ok');
      for (const e of res.ejected) device.serial(`[W][board] ${e.name} unplugged: ${e.reason}`, 'warn');
      return res;
    },
    setGrove5v: v => { const r = device.setGrove5v(v); panels.render(); chassis.refresh(); return r; },
    setPower: v => v ? runtime.reboot() : runtime.powerOff(),
    setUsb: v => { device.setUsb(v); chassis.refresh(); },
    setJack: v => { device.setAudioJack(v); chassis.refresh(); },
    useRealMic: async () => {
      const ok = await audio.enableMic(device);
      toast(ok ? 'host microphone routed to the MEMS/ES8311 ADC' : 'microphone permission denied', ok ? 'ok' : 'error');
    },
    reboot: () => { runtime.reboot(); toast('rebooting…'); },
    factoryReset: () => {
      LS.del('cardputer-emu.state');
      LS.del('cardputer-emu.sd');
      if (nativeApi.available) fetch('/api/reset', { method: 'POST' }).catch(() => { });
      toast('factory reset — reloading');
      setTimeout(() => location.reload(), 600);
    },
  });
  app.panels = panels;
  panels.setTab(location.hash === '#updates' ? 'updates' : 'modules');

  chassis.onRail = action => {
    switch (action) {
      case 'power': device.power.switchOn ? runtime.powerOff() : (device.powerOn(), runtime.boot()); break;
      case 'reset': runtime.reboot(); toast('reset'); break;
      case 'boot': device.enterDownloadMode(); toast('download mode: waiting for esptool'); break;
      case 'usb': device.setUsb(!device.usbConnected); break;
      case 'sd': device.sd.inserted ? device.sd.eject() : device.sd.insert(); toast(device.sd.inserted ? 'microSD mounted' : 'microSD ejected'); break;
      case 'jack': device.setAudioJack(!device.audioJack); break;
      case 'grove': panels.setTab('modules'); break;
    }
    chassis.refresh();
    panels.render();
    refreshStatus();
    queueSave();
  };

  // ---- device events -> UI
  device.bus.on('serial', () => { if (panels.tab === 'serial') panels.renderSerialLines(); });
  device.bus.on('modules-changed', () => { chassis.refresh(); refreshStatus(); if (panels.tab === 'modules') panels.render(); });
  device.bus.on('power', () => { chassis.refresh(); refreshStatus(); });
  device.bus.on('mode', () => { chassis.refresh(); });
  device.bus.on('brownout', () => {
    runtime.powerOff();
    toast('brownout: battery below 3.35 V — charge it or enable USB', 'error');
  });
  device.bus.on('variant', () => { chassis.refresh(); refreshStatus(); queueSave(); });
  device.bus.on('grove5v', () => { panels.render(); });
  device.bus.on('led', () => chassis.refresh());
  device.bus.on('tick', () => { });
  runtime.onEvent = (evt, payload) => {
    if (evt === 'toast') toast(payload.msg, payload.level);
    if (evt === 'launch') refreshStatus();
    if (evt === 'panic') toast('firmware crashed — any key returns to launcher', 'error');
  };

  // ---- restore persisted state
  device.speaker.setVolume(settings.volume ?? 0.7);
  device.display.setBacklight(settings.backlight ?? 1);
  if (settings.battery != null) device.power.percent = settings.battery;
  if (settings.sdInserted) device.sd.insert();
  for (const id of settings.modules || []) device.attachModule(id);
  if (settings.jack) device.setAudioJack(true);
  if (settings.usb) device.setUsb(true);

  const footNative = document.querySelector('#footNative');
  if (footNative) footNative.textContent = native
    ? `native launcher · ${native.platform} · python ${native.python}`
    : 'browser mode — catalog + app updates only (use `python run.py` for core updates)';

  runtime.boot();
  flash.restoreApps().then(ids => { if (ids.length) toast(`restored ${ids.length} installed program(s)`); });
  app.startTime = performance.now();
  refreshStatus();
  startLoop();

  // ---- apply the soft payload that belongs to the installed version --------
  // (a launcher-driven core update swaps files on disk; the catalog/apps that
  //  version promised still have to be loaded into this page)
  (async () => {
    try {
      const feed = await updater.fetchFeed();
      const rel = (feed?.releases || []).find(r => r.version === updater.version);
      if (rel?.soft) {
        const apps = [...new Set([...(rel.soft.apps || []), ...(settings.installedApps || [])])];
        const log = await updater.applySoft({ ...rel.soft, apps });
        if (log.length) { updater.relay(log); updater.onChange(); }
      }
    } catch { /* feed unavailable — run with what we have */ }
  })();

  // ---- auto update on launch
  if (updater.auto) {
    const r = await updater.check().catch(() => null);
    if (r?.available) toast(`v${r.available.version} available — see Updates`, 'ok');
  }

  // one-click SKU swap from the status bar (the System tab has the full picker)
  const variantPill = document.querySelector('#statusVariant');
  if (variantPill) {
    variantPill.addEventListener('click', () => {
      const order = ['cardputer', 'v11', 'adv'];
      const next = order[(order.indexOf(device.variantId) + 1) % order.length];
      panels.ctx.setVariant(next);
      panels.setTab('system');
    });
  }

  // global shortcuts
  window.addEventListener('keydown', e => {
    if (e.ctrlKey && e.shiftKey && e.code === 'KeyU') { e.preventDefault(); panels.setTab('updates'); }
    if (e.ctrlKey && e.shiftKey && e.code === 'KeyS') { e.preventDefault(); panels.setTab('serial'); }
    if (e.key === 'F1') { e.preventDefault(); panels.setTab('help'); }
    if (e.key === 'F2') { e.preventDefault(); panels.setTab('modules'); }
  });
  // Automation/CI hook: the Playwright harness and the serial console use this.
  /** @type {any} */ (window).__emu = app;
}

function makeFetcher(native) {
  return async url => {
    const target = native?.available ? `/api/proxy?url=${encodeURIComponent(url)}` : url;
    const r = await fetch(target, { cache: 'no-store' });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    return await r.text();
  };
}

// ------------------------------------------------------------------ loop ----
let last = 0;
function startLoop() {
  const step = now => {
    const dt = clamp((now - last) / 1000, 0, 0.05);
    last = now;
    if (app.device.mode !== 'off') {
      app.device.tick(dt);
      app.runtime.tick(dt);
    }
    app.chassis.tick(dt);
    app.panels.tick(dt);
    app.fps = app.runtime.fps;
    app._acc = (app._acc || 0) + dt;
    if (app._acc > 0.25) { app._acc = 0; refreshStatus(); }
    requestAnimationFrame(step);
  };
  last = performance.now();
  requestAnimationFrame(step);
}

// --------------------------------------------------------------- status -----
function refreshStatus() {
  const d = app.device, u = app.updater;
  const q = s => document.querySelector(s);
  const set = (sel, v) => { const el = q(sel); if (el && el.textContent !== v) el.textContent = v; };
  if (!d) return;
  set('#statusVariant', d.variant.label);
  set('#statusBattery', `${d.power.percent.toFixed(0)}%${d.power.charging ? ' ⚡' : ''}`);
  set('#statusModules', `${d.modules.length} module${d.modules.length === 1 ? '' : 's'}`);
  set('#statusApp', app.runtime.active?.name || '—');
  set('#statusVer', 'v' + (u?.version || VERSION));
  set('#statusState', d.mode === 'off' ? 'powered off' : d.mode === 'download' ? 'download mode' : 'running');
  const dot = q('#statusDot');
  if (dot) dot.className = 'dot ' + (d.mode === 'off' ? 'off' : d.mode === 'download' ? 'dl' : 'run');
  const batteryEl = q('#statusBattery');
  if (batteryEl) batteryEl.classList.toggle('low', d.power.percent < 20);
}

// ---------------------------------------------------------------- toast -----
let toastTimer = null;
function toast(msg, level = 'info') {
  const wrap = document.querySelector('#toasts');
  if (!wrap) return;
  const el = document.createElement('div');
  el.className = 'toast ' + level;
  el.textContent = msg;
  wrap.append(el);
  setTimeout(() => el.classList.add('out'), 2600);
  setTimeout(() => el.remove(), 3100);
  while (wrap.children.length > 4) wrap.firstChild.remove();
  clearTimeout(toastTimer);
}

boot().catch(err => {
  console.error(err);
  document.body.insertAdjacentHTML('beforeend',
    `<pre style="position:fixed;inset:20px;background:#200;color:#f88;padding:20px;z-index:9999;overflow:auto">Boot failed:\n${err.stack || err}</pre>`);
});

</script>
</body>
