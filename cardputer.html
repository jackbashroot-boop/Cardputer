// ---------------------------------------------------------------------------
//  Buses
// ---------------------------------------------------------------------------
class I2CBus {
  constructor(name, sda, scl) {
    this.name = name; this.sda = sda; this.scl = scl;
    this.clients = new Map();       // addr -> {name, read, write}
    this.transactions = 0;
    this.naks = 0;
  }
  attach(addr, name, impl) {
    if (this.clients.has(addr)) throw new Error(`I2C address ${hex(addr)} already in use by ${this.clients.get(addr).name}`);
    this.clients.set(addr, { addr, name, ...impl });
  }
  detach(addr) { this.clients.delete(addr); }
  has(addr) { return this.clients.has(addr); }
  scan() { return [...this.clients.keys()].sort((a, b) => a - b); }
  _get(addr) {
    const c = this.clients.get(addr);
    if (!c) { this.naks++; throw new Error(`I2C NAK: no device at ${hex(addr)} on ${this.name}`); }
    return c;
  }
  // master writes [reg, ...data]
  writeBytes(addr, bytes) {
    const c = this._get(addr); this.transactions++;
    const reg = bytes[0] ?? 0, data = bytes.slice(1);
    if (c.write) c.write(reg, data);
  }
  readBytes(addr, n) {
    const c = this._get(addr); this.transactions++;
    return c.read ? (c.read(0, n) || new Array(n).fill(0)) : new Array(n).fill(0);
  }
  writeReg(addr, reg, val) { return this.writeBytes(addr, [reg, val & 0xff]); }
  readReg(addr, reg, n = 1) {
    const c = this._get(addr); this.transactions++;
    return c.read ? (c.read(reg, n) || new Array(n).fill(0)) : new Array(n).fill(0);
  }
}

class UartBus {
  constructor(tx, rx) {
    this.tx = tx; this.rx = rx; this.client = null; this.baud = 115200;
    this.txBytes = 0; this.rxBytes = 0; this.log = [];
    this.rxBuf = [];          // ring of bytes waiting for the firmware to read()
    this.rxOverflows = 0;
    /** @type {null | ((bytes: number[]) => void)} extra tap used by tests/UIs */
    this.onRx = null;
  }
  attach(name, impl, baud) {
    if (this.client) throw new Error(`UART already in use by ${this.client.name}`);
    this.client = { name, ...impl }; this.baud = baud || this.baud;
  }
  detach() { this.client = null; this.rxBuf.length = 0; }
  // SoC -> module
  send(bytes) {
    const arr = typeof bytes === 'string' ? Array.from(new TextEncoder().encode(bytes)) : Array.from(bytes);
    this.txBytes += arr.length;
    if (this.client?.uartIn) this.client.uartIn(arr);
  }
  // module -> SoC: queued in the RX ring that api.uart.read() drains, mirroring the
  // UART RX FIFO the real ESP32-S3 driver exposes to firmware.
  reply(bytes) {
    const arr = typeof bytes === 'string' ? Array.from(new TextEncoder().encode(bytes)) : Array.from(bytes);
    this.rxBytes += arr.length;
    for (const b of arr) this.rxBuf.push(b & 0xff);
    const max = 1024;
    if (this.rxBuf.length > max) { this.rxOverflows++; this.rxBuf.splice(0, this.rxBuf.length - max); }
    if (this.onRx) this.onRx(arr);
  }
  pending() { return this.rxBuf.length; }
  read(n) {
    const k = n == null ? this.rxBuf.length : Math.max(0, Math.min(n | 0, this.rxBuf.length));
    return this.rxBuf.splice(0, k);
  }
  flush() { this.rxBuf.length = 0; }
  stats() { return { tx: this.txBytes, rx: this.rxBytes, pending: this.rxBuf.length, overflows: this.rxOverflows, baud: this.baud }; }
}

class SpiBus {
  constructor(pins) { this.pins = pins; this.devices = new Map(); }
  attach(cs, name, impl) { this.devices.set(cs, { name, ...impl }); }
  detach(cs) { this.devices.delete(cs); }
  transfer(cs, bytes) {
    const d = this.devices.get(cs);
    if (!d) return bytes.map(() => 0xff);
    return d.spiXfer ? d.spiXfer(bytes) : bytes.map(() => 0x00);
  }
}

// ---------------------------------------------------------------------------
//  Device
// ---------------------------------------------------------------------------
class Cardputer {
  constructor({ variant = 'adv', catalog = MODULE_CATALOG, store = null } = {}) {
    this.bus = new Emitter();
    this.catalog = catalog;
    this.store = store;
    this.variantId = VARIANTS[variant] ? variant : 'adv';
    this.uptime = 0;
    this.serialBuf = [];
    this.serialSeq = 0;
    this.modules = [];              // {uuid, def, inst}
    this._uuid = 1;
    this.cpuLoad = 0.3;
    this.booted = false;
    this.mode = 'off';              // off | boot | run | download | panic | sleep
    this.rng = makeRng();
    this._initPeripherals();
    this._initBuses();
  }

  get variant() { return VARIANTS[this.variantId]; }

  _initPeripherals() {
    const v = this.variant;
    this.display = new Display(240, 135);
    this.keyboard = new Keyboard({ scanMode: v.keyboard });
    this.speaker = new Speaker();
    this.mic = new Microphone();
    this.imu = new Imu({ present: v.imu });
    this.ir = new Infrared();
    this.radio = new Radio({ hasWifi: true, hasBle: true });
    this.power = new Power({ capacityMah: v.battery.total || 1500 });
    this.sd = new SdCard({ store: this.store ? this.store.sd : null });
    this.rtc = new Rtc();
    this.led = { r: 0, g: 0, b: 0, mode: 'off', power: true };
    this.usbConnected = false;
    this.audioJack = false;
    this.speaker.jackPlugged = false;
    // Grove can be switched between 3.3 V and 5 V on the Adv (the original is fixed
    // at 3.3 V). 5 V-only units refuse to answer when the rail is left at 3.3 V.
    this.grove5v = v.groveToggle ? true : false;
    // die temperature model: passive, ambient 24 C, thermal resistance ~38 K/W
    this.thermal = { dieC: 24, ambientC: 24, throttled: false, peakC: 24 };
    // task watchdog: firmware must feed it from its loop, like the real WDT
    this.wdt = { enabled: true, timeoutMs: 5000, lastFeed: 0, feeds: 0, trips: 0 };
  }

  _initBuses() {
    const v = this.variant;
    this.buses = {
      internal: new I2CBus('internal', 8, 9),
      grove: new I2CBus('grove', 2, 1),
      ext: new I2CBus('ext', 8, 9),            // EXT header exposes the internal I²C pins
      uartGrove: new UartBus(2, 1),
      uartExt: new UartBus(13, 15),
      spi: new SpiBus({ sck: 40, mosi: 14, miso: 39 }),
    };
    // On-board I²C devices of the ADV (codec + IMU + keypad controller)
    if (v.imu) {
      this.buses.internal.attach(0x68, 'BMI270 (on-board IMU)', { read: (reg, n) => { const a = this.imu.getAccel() || { x: 0, y: 0, z: 1 }; return [x16(a.x), x16(a.y), x16(a.z)].slice(0, n || 6); } });
    }
    if (v.audio === 'ES8311 codec + NS4150B amp') {
      this.buses.internal.attach(0x18, 'ES8311 (on-board codec)', { read: (reg, n) => new Array(n || 1).fill(reg === 0x00 ? 0x83 : 0x00), write: () => {} });
    }
    if (v.tca8418) {
      this.buses.internal.attach(0x34, 'TCA8418 (on-board keypad)', {
        read: (reg, n) => [this.keyboard.tcaReadReg(reg)].slice(0, n || 1),
        write: (reg, data) => this.keyboard.tcaWriteReg(reg, data[0]),
      });
    }
    this.buses.spi.attach(12, 'microSD (on-board)');
  }

  // --- serial ---------------------------------------------------------------
  serial(msg, level = 'info') {
    const line = { t: this.uptime, seq: ++this.serialSeq, msg: String(msg), level };
    this.serialBuf.push(line);
    if (this.serialBuf.length > 800) this.serialBuf.splice(0, 200);
    this.bus.emit('serial', line);
    return line;
  }
  clearSerial() { this.serialBuf.length = 0; this.bus.emit('serial-clear'); }

  // --- lifecycle ------------------------------------------------------------
  boot() {
    this.mode = 'boot';
    this.booted = true;
    this.uptime = 0;
    this.bootLines();
    this.mode = 'run';
    this.bus.emit('boot');
  }
  bootLines() {
    const v = this.variant;
    const lines = [
      ['ESP-ROM:esp32s3-20210327', 'boot'],
      ['Build:Mar 27 2021', 'boot'],
      [`rst:0x1 (POWERON),boot:0x8 (SPI_FAST_FLASH_BOOT)`, 'boot'],
      [`mode:DIO, clock div:1  --  ${v.soc} @ ${v.mhz}MHz, ${(v.flashBytes / 1024 ** 2)}MB flash`, 'boot'],
      ['load:0x3fcd0108,len:0x15e8', 'boot'],
      ['entry 0x403c98d0', 'boot'],
      ['[I][esp_image] booting factory partition (ota_0)', 'info'],
      [`[I][board] model=${v.sku} keyboard=${v.kbChip}`, 'info'],
      [`[I][board] audio=${v.audio}`, 'info'],
      ['[I][i2c] bus internal SDA=8 SCL=9', 'info'],
      ['[I][i2c] scan internal -> ' + (this.buses.internal.scan().map(a => hex(a)).join(' ') || 'none'), 'info'],
      ['[I][i2c] scan grove    -> ' + (this.buses.grove.scan().map(a => hex(a)).join(' ') || 'none'), 'info'],
      ['[I][sd] mount ' + (this.sd.inserted ? 'ok (FAT32)' : 'no card'), 'info'],
      ['[I][wifi] sta start, mac=8c:aa:b5:' + Math.floor(this.rng() * 255).toString(16).padStart(2, '0') + ':11:22', 'info'],
      ['[I][imu] ' + (v.imu ? 'BMI270 online (chip id 0x24)' : 'not present on this SKU'), v.imu ? 'info' : 'warn'],
      ['[I][audio] ' + v.audio, 'info'],
      [`[I] free heap: ${(200000 + Math.floor(this.rng() * 40000))} bytes`, 'info'],
      ['[I][boot] CardputerOS starting…', 'ok'],
    ];
    for (const [m, l] of lines) this.serial(m, l);
    return lines;
  }
  powerOff() { this.mode = 'off'; this.display.sleep(true); this.power.switchOn = false; this.serial('[I] power off', 'warn'); this.bus.emit('power', 'off'); }
  powerOn() { this.power.switchOn = true; this.display.sleep(false); this.bus.emit('power', 'on'); this.boot(); }
  reboot() {
    this.serial('[I] rst:0xc (SW_CPU_RESET) — rebooting', 'warn');
    // a reset does not unplug anything: keep modules, card, charge and audio state
    const keep = {
      // keep the identity too: a physical reset does not renumber the units on the bus
      modules: this.modules.map(m => ({ id: m.def.id, uuid: m.uuid })),
      percent: this.power.percent,
      sdInserted: this.sd.inserted,
      volume: this.speaker.volume,
      backlight: this.display.backlight,
      usb: this.usbConnected,
      jack: this.audioJack,
    };
    this.modules.forEach(m => m.inst.dispose && m.inst.dispose());
    this.modules = [];
    this._initPeripherals();
    this._initBuses();
    this.power.percent = keep.percent;
    this.speaker.setVolume(keep.volume);
    this.display.setBacklight(keep.backlight);
    if (keep.sdInserted) this.sd.insert();
    this.audioJack = keep.jack;
    this.speaker.jackPlugged = keep.jack && this.variant.jack;
    this.usbConnected = keep.usb;
    this.power.usb = keep.usb;
    for (const rec of keep.modules) {
      const res = this.attachModule(rec.id);
      // restore the original handle so open panels/tests keep working after a reset
      if (res.ok && res.module) { res.module.uuid = rec.uuid; this._uuid = Math.max(this._uuid, Number(String(rec.uuid).slice(1)) + 1 || this._uuid); }
    }
    this.boot();
  }
  enterDownloadMode() { this.mode = 'download'; this.display.sleep(true); this.serial('[I] download mode: waiting for esptool on USB-C', 'warn'); this.bus.emit('mode', 'download'); }

  // --- modules --------------------------------------------------------------
  // Chip-select of an SPI module: explicit `cs:` wins, else the EXT header's own CS
  // (GPIO5) or the Grove-side default (GPIO6). GPIO12 is the microSD card, never free.
  csPinOf(def) { return def && def.cs != null ? def.cs : (def && def.eco === 'ext' ? 5 : 6); }
  slotOf(eco) { return this.modules.filter(m => m.def.eco === eco); }
  slotFull(eco) { const lim = ECOSYSTEMS[eco]?.max ?? 1; return this.slotOf(eco).length >= lim; }

  checkAttach(def) {
    const compat = this.compatFor(def);
    if (!compat.ok) return compat;
    if (['grove', 'ext'].includes(def.eco) && this.slotFull(def.eco)) {
      return { ok: false, error: `${def.eco === 'grove' ? 'Grove port' : 'EXT header'} already occupied by ${this.slotOf(def.eco)[0].def.name}` };
    }
    if (def.eco === 'ext' && !this.variant.ext) return { ok: false, error: 'this SKU has no EXT header' };
    // address conflicts
    if (def.addrs) {
      const bus = def.eco === 'ext' ? this.buses.ext : this.buses.grove;
      for (const a of def.addrs) {
        if (bus.has(a.addr)) return { ok: false, error: `I²C address ${hex(a.addr)} already answered by ${bus.clients.get(a.addr).name}` };
      }
    }
    // pin conflicts
    if (def.pins) {
      for (const p of def.pins) {
        const owner = this.modules.find(m => (m.def.pins || []).includes(p));
        if (owner) return { ok: false, error: `GPIO${p} already claimed by ${owner.def.name}` };
      }
    }
    if (def.transport === 'uart') {
      const u = def.eco === 'ext' ? this.buses.uartExt : this.buses.uartGrove;
      if (u.client) return { ok: false, error: `UART already in use by ${u.client.name}` };
    }
    if (def.transport === 'spi') {
      const csPin = this.csPinOf(def);
      if (csPin === 12) return { ok: false, error: 'GPIO12 is the microSD chip-select — a module cannot share it' };
      if (this.buses.spi.devices.has(csPin)) return { ok: false, error: `SPI chip-select GPIO${csPin} already in use by ${this.buses.spi.devices.get(csPin).name}` };
    }
    return { ok: true };
  }

  attachModule(id) {
    const def = (this.catalog || MODULE_CATALOG).find(m => m.id === id) || MODULE_BY_ID.get(id);
    const check = this.checkAttach(def);
    if (!check.ok) { this.serial(`[E][mod] ${id}: ${check.error}`, 'error'); return check; }
    const bus = def.eco === 'ext' ? this.buses.ext : this.buses.grove;
    const uart = def.eco === 'ext' ? this.buses.uartExt : this.buses.uartGrove;
    const ctx = {
      now: () => this.uptime * 1000,
      heat: () => 0.6 + this.cpuLoad * 4.2 + (this.display.backlight * 1.4),
      emit: (evt, payload) => this.bus.emit('module-event', { id: def.id, evt, payload }),
      log: (m, l = 'info') => this.serial(`[${def.shortName || def.name}] ${m}`, l),
      uartOpen: () => !!uart.client && uart.client.name === def.name,
      uartSend: (data) => uart.reply(typeof data === 'string' ? Array.from(new TextEncoder().encode(data)) : data),
      i2c: this.buses,
      device: this,
    };
    let inst;
    try {
      // feed-delivered modules carry their driver as source text (no bundling needed)
      const factory = def.create || (def.source ? new Function('return (' + def.source + ')')() : null);
      inst = factory ? (factory(ctx) || {}) : { state: {} };
    }
    catch (e) { this.serial(`[E][mod] ${def.name} driver failed: ${e.message}`, 'error'); return { ok: false, error: 'driver init failed: ' + e.message }; }

    if (def.addrs) {
      for (const a of def.addrs) {
        bus.attach(a.addr, `${def.name} ${a.chip}`, {
          read: (reg, n) => (inst.read ? inst.read(a.addr, reg, n) : new Array(n || 1).fill(0)),
          write: (reg, data) => inst.write && inst.write(a.addr, reg, data),
        });
      }
    }
    if (def.transport === 'uart') {
      // expose the module -> SoC direction so drivers can answer AT/NMEA/Modbus frames
      inst._reply = (bytes) => uart.reply(bytes);
      uart.attach(def.name, { uartIn: (b) => inst.uartIn && inst.uartIn(b) }, def.baud);
    }
    if (def.transport === 'spi') {
      // EXT CAPs share the SD SPI lines (SCK 40 / MOSI 14 / MISO 39) but take their own
      // chip-select. Never allow a module to take CS 12 — that is the microSD card.
      const csPin = this.csPinOf(def);
      if (csPin === 12) { this.serial(`[E][spi] ${def.name}: CS 12 belongs to the microSD card`, 'error'); return { ok: false, error: 'CS 12 is the microSD card' }; }
      this.buses.spi.attach(csPin, def.name, { spiXfer: (b) => (inst.spiXfer ? inst.spiXfer(b) : b.map(() => 0)) });
    }
    if (def.transport === 'gpio') {
      for (const pin of def.pins || []) {
        const prevPush = [...(inst.gpioInput ? [] : [])];
        this.buses.gpio = this.buses.gpio || new Map();
        this.buses.gpio.set(pin, { owner: def.name, inst });
        void prevPush;
      }
    }

    const rec = { uuid: `m${this._uuid++}`, def, inst };
    this.modules.push(rec);
    const addrTxt = def.addrs ? ' @ ' + def.addrs.map(a => hex(a.addr)).join(', ') : '';
    this.serial(`[I][mod] attached ${def.name} (${def.sku}) on ${def.eco}${addrTxt}`, 'ok');
    this.bus.emit('modules-changed', this.modules);
    this.bus.emit('module-attached', rec);
    return { ok: true, module: rec };
  }

  detachModule(uuid) {
    const i = this.modules.findIndex(m => m.uuid === uuid);
    if (i < 0) return { ok: false, error: 'not present' };
    const rec = this.modules[i];
    const def = rec.def;
    const bus = def.eco === 'ext' ? this.buses.ext : this.buses.grove;
    if (def.addrs) for (const a of def.addrs) bus.detach(a.addr);
    if (def.transport === 'uart') (def.eco === 'ext' ? this.buses.uartExt : this.buses.uartGrove).detach();
    if (def.transport === 'spi') this.buses.spi.detach(this.csPinOf(def.def));
    if (def.transport === 'gpio') for (const pin of def.pins || []) this.buses.gpio?.delete(pin);
    try { rec.inst.dispose && rec.inst.dispose(); } catch { /* ignore */ }
    this.modules.splice(i, 1);
    this.serial(`[W][mod] removed ${def.name} from ${def.eco}`, 'warn');
    this.bus.emit('modules-changed', this.modules);
    this.bus.emit('module-detached', rec);
    return { ok: true };
  }

  findModule(id) { return this.modules.find(m => m.def.id === id) || null; }
  moduleState(id) { const m = this.findModule(id); return m ? m.inst.state : null; }
  setModuleControl(uuid, controlId, value) {
    const rec = this.modules.find(m => m.uuid === uuid);
    if (!rec) return { ok: false, error: 'module not attached' };
    const ctrls = [...(rec.def.controls || []), ...(rec.inst.controls || [])];
    const c = ctrls.find(c => c.id === controlId);
    if (!rec.inst.setControl) return { ok: false, error: 'module has no injectable controls' };
    rec.inst.setControl(controlId, value);
    return { ok: true, control: c };
  }

  // --- GPIO / ADC -----------------------------------------------------------
  digitalRead(pin) {
    const g = this.buses.gpio?.get(pin);
    if (g?.inst.gpioRead) return g.inst.gpioRead();
    return 0;
  }
  analogRead(pin) {
    const g = this.buses.gpio?.get(pin);
    if (g?.inst.analogRead) return g.inst.analogRead();
    return Math.round(2048 + Math.sin(this.uptime * 3) * 200);
  }
  digitalWrite(pin, level) {
    const g = this.buses.gpio?.get(pin);
    if (g?.inst.gpio) g.inst.gpio(level);
    if (pin === 38 && this.variant.rgbLed === 'shared') this.display.setBacklight(level ? this.display.backlight : 0);
  }
  setLed(r, g, b) {
    if (this.variant.rgbLed === 'shared' && !this.led.power) return false;
    this.led = { ...this.led, r, g, b };
    this.bus.emit('led', this.led);
    return true;
  }

  // --- thermal --------------------------------------------------------------
  // First-order thermal model: the SoC's dissipation heats a lumped mass, the shell
  // radiates to ambient. Real Cardputers get warm under sustained load and the IDF
  // driver pulls the CPU clock back; that is what `throttled` models.
  _thermalTick(dt, mA) {
    const t = this.thermal;
    const watts = (3.7 * mA) / 1000;
    const rK = 34;                       // K/W, board + shell into still air
    const tau = 55;                      // s, thermal time constant
    const target = t.ambientC + watts * rK;
    t.dieC += (target - t.dieC) * Math.min(1, dt / tau);
    t.peakC = Math.max(t.peakC, t.dieC);
    const was = t.throttled;
    t.throttled = t.dieC > 78;
    if (t.throttled !== was) {
      this.serial(t.throttled
        ? `[W][thermal] die ${t.dieC.toFixed(1)} C — throttling CPU to 160 MHz`
        : `[I][thermal] die ${t.dieC.toFixed(1)} C — full 240 MHz`, t.throttled ? 'warn' : 'info');
      this.bus.emit('thermal', t);
    }
  }
  setAmbient(c) { this.thermal.ambientC = clamp(Number(c) || 24, -10, 50); return this.thermal.ambientC; }

  // --- watchdog -------------------------------------------------------------
  // Espressif's task WDT: firmware has to feed it, and a blocked loop trips a panic
  // reset. Apps call api.wdt.feed() implicitly once per rendered frame.
  feedWatchdog(now = this.uptime) {
    this.wdt.lastFeed = now; this.wdt.feeds++;
    return true;
  }
  watchdogTripped(now = this.uptime) {
    if (!this.wdt.enabled) return false;
    return (now - this.wdt.lastFeed) * 1000 > this.wdt.timeoutMs;
  }

  // --- tick -----------------------------------------------------------------
  tick(dt, { cpuLoad = this.cpuLoad } = {}) {
    if (this.mode === 'off') return;
    this.cpuLoad = clamp(cpuLoad, 0, 1);
    this.uptime += dt;
    this.keyboard.tick(this.uptime * 1000);
    this.radio.tick(dt);
    this.imu.tick(dt);
    const moduleMa = this.modules.reduce((a, m) => a + (m.def.powerMa || 6), 0);
    this.power.tick(dt, {
      loadFactor: this.cpuLoad, wifi: this.radio.state === 'connected',
      jack: this.audioJack, modulesMa: moduleMa, throttled: this.thermal.throttled,
    });
    this._thermalTick(dt, this.power.milliamps);
    // ESP32-S3 brownout detector: the cell sags under the LCD + radio load well
    // before it is chemically empty, which is why a Cardputer dies at "2 %".
    if (this.power.volts < 3.30 && !this.usbConnected && this.power.percent > 0 && this.mode === 'run') {
      this.mode = 'brownout';
      this.serial(`[E][power] brownout detector was triggered (${this.power.volts.toFixed(2)} V) — see you after the charger`, 'error');
      this.bus.emit('brownout', { volts: this.power.volts });
    }
    for (const rec of this.modules) {
      try { rec.inst.tick && rec.inst.tick(dt); }
      catch (e) { this.serial(`[E][mod] ${rec.def.name} tick: ${e.message}`, 'error'); }
    }
    this.bus.emit('tick', dt);
  }

  sdInfo() { return this.sd.info(); }

  // serializable snapshot for persistence
  snapshot() {
    return {
      variant: this.variantId,
      modules: this.modules.map(m => m.def.id),
      sdInserted: this.sd.inserted,
      volume: this.speaker.volume,
      backlight: this.display.backlight,
      audioJack: this.audioJack,
      battery: this.power.percent,
      led: this.led,
    };
  }
  restore(snap) {
    if (!snap) return;
    this.speaker.setVolume(snap.volume ?? 0.7);
    this.display.setBacklight(snap.backlight ?? 1);
    this.power.percent = snap.battery ?? 82;
    if (snap.sdInserted) this.sd.insert();
    this.setAudioJack(!!snap.audioJack);
    for (const id of snap.modules || []) this.attachModule(id);
  }
  setAudioJack(plugged) {
    this.audioJack = plugged;
    this.speaker.jackPlugged = plugged && this.variant.jack;
    if (plugged && !this.variant.jack) { this.serial('[W][audio] this SKU has no 3.5mm jack', 'warn'); this.audioJack = false; }
    else this.serial(`[I][audio] 3.5mm jack ${this.audioJack ? 'inserted — speaker amp disabled' : 'removed — speaker amp enabled'}`, 'info');
    this.bus.emit('jack', this.audioJack);
  }
  setUsb(connected) {
    this.usbConnected = connected;
    this.power.usb = connected;
    this.serial(connected ? '[I][usb] USB-C connected — serial/JTAG up, charging' : '[I][usb] USB-C disconnected — on battery', 'info');
    this.bus.emit('usb', connected);
  }
  // Swap the SKU underneath the running firmware without touching anything else:
  // peripherals and buses are rebuilt for the new pinmap, modules that the new SKU
  // physically cannot host are unplugged (and reported), everything else survives.
  setVariant(id) {
    if (!VARIANTS[id]) return { ok: false, error: `unknown SKU "${id}"` };
    if (id === this.variantId) return { ok: true, changed: false, ejected: [] };
    const before = this.modules.map(m => ({ id: m.def.id, uuid: m.uuid, name: m.def.name }));
    const hadToggle = !!this.variant.groveToggle;
    const keep = {
      percent: this.power.percent, sdInserted: this.sd.inserted, volume: this.speaker.volume,
      backlight: this.display.backlight, usb: this.usbConnected, jack: this.audioJack,
      grove5v: this.grove5v, led: { ...this.led }, uptime: this.uptime,
    };
    this.modules.forEach(m => m.inst.dispose && m.inst.dispose());
    this.modules = [];
    this.variantId = id;
    this.rng = makeRng();
    this._initPeripherals();
    this._initBuses();
    this.power.percent = keep.percent;
    this.speaker.setVolume(keep.volume);
    this.display.setBacklight(keep.backlight);
    this.led = keep.led;
    if (keep.sdInserted) this.sd.insert();
    this.audioJack = keep.jack;
    this.speaker.jackPlugged = keep.jack && this.variant.jack;
    this.usbConnected = keep.usb;
    this.power.usb = keep.usb;
    // the 5 V switch is a physical switch: keep its position, but a SKU that has no
    // switch always sits at 3.3 V, and coming back to a SKU with one starts at 5 V
    this.grove5v = this.variant.groveToggle ? (hadToggle ? keep.grove5v : true) : false;
    const ejected = [];
    for (const rec of before) {
      const def = MODULE_BY_ID.get(rec.id);
      const why = this.compatFor(def).error;
      if (why) { ejected.push({ ...rec, reason: why }); continue; }
      const res = this.attachModule(rec.id);
      if (res.ok && res.module) res.module.uuid = rec.uuid;
      else ejected.push({ ...rec, reason: res.error || 'did not fit' });
    }
    this.serial(`[I][board] SKU -> ${this.variant.label} (${this.variant.sku}); ${ejected.length} module(s) unplugged`, 'info');
    this.bus.emit('variant', { id, ejected });
    return { ok: true, changed: true, ejected, variant: this.variant };
  }

  // Does this SKU physically support this module? Separate from checkAttach(),
  // which is about what is already plugged in this instant.
  compatFor(def) {
    if (!def) return { ok: false, error: 'unknown module' };
    const v = this.variant;
    if (def.requires === 'adv' && v.id !== 'adv') {
      return { ok: false, error: `needs the EXT 2.54-14P header (Cardputer-Adv only) — this is a ${v.label}` };
    }
    if (def.eco === 'ext' && !v.ext) return { ok: false, error: `${v.label} has no EXT header — CAP modules need the Cardputer-Adv` };
    if (def.requires === 'imu' && !v.imu) return { ok: false, error: 'needs the on-board BMI270 (Cardputer-Adv only)' };
    if (def.requires === 'jack' && !v.jack) return { ok: false, error: 'needs the 3.5 mm jack (Cardputer-Adv only)' };
    if (def.needs5v) {
      if (!v.groveToggle) return { ok: false, error: 'this unit needs 5 V on the Grove rail — only the Adv can switch it' };
      if (!this.grove5v) return { ok: false, error: 'Grove rail is at 3.3 V — flip the 5 V toggle on this SKU to power it' };
    }
    return { ok: true };
  }

  setGrove5v(on) {
    if (!this.variant.groveToggle) {
      this.serial('[W][grove] this SKU has no 5 V/3.3 V toggle — rail stays at 3.3 V', 'warn');
      return { ok: false, error: 'no Grove voltage toggle on this SKU' };
    }
    this.grove5v = !!on;
    this.serial(`[I][grove] rail -> ${this.grove5v ? '5 V' : '3.3 V'}`, 'info');
    // a 5 V-only unit drops off the bus if the rail goes away
    for (const rec of [...this.modules]) {
      const c = this.compatFor(rec.def);
      if (!c.ok) { this.detachModule(rec.uuid); this.bus.emit('module-event', { id: rec.def.id, evt: 'power-loss', payload: {} }); }
    }
    this.bus.emit('grove5v', this.grove5v);
    return { ok: true, volts: this.grove5v ? 5 : 3.3 };
  }

  availableModules() {
    const list = this.catalog || MODULE_CATALOG;
    return list.map(def => {
      const compat = this.compatFor(def);
      const check = compat.ok ? this.checkAttach(def) : compat;
      return { def, ok: check.ok, error: check.error, compatible: compat.ok };
    });
  }
  formatBytes(n) { return fmtBytes(n); }
}

function x16(v) { return clamp(Math.round((v ?? 0) * 4096 + 2048), 0, 65535); }

// ────────────────────────────────────────────── js/rt/runtime.js
// =============================================================================
//  Firmware runtime: boots CardputerOS, exposes an M5Cardputer-style API to
//  apps, drives their setup()/loop() lifecycle, and shows panics on a crash.
// =============================================================================


class Runtime {
  constructor(device, { apps = [], fetcher = null, version = '1.0.0' } = {}) {
    this.device = device;
    this.apps = new Map(apps.map(a => [a.id, a]));
    this.fetcher = fetcher;
    this.version = version;
    this.active = null;
    this.phase = 'off';       // off | boot | splash | run | panic
    this.timer = 0;
    this.panic = null;
    this.frame = 0;
    this.fps = 0;
    this._fpsAcc = 0; this._fpsFrames = 0;
    this.onEvent = () => {};
    this.serialTag = 'fw';
    this.launcherId = 'launcher';
    this.history = [];
    this.flash = null;          // FlashManager, attached by main.js
    this.loopMs = 0;            // budget spent in the app's loop() this frame
    this.slowFrames = 0;        // consecutive frames that blew the budget
  }

  // ---------------------------------------------------------------- boot ----
  boot() {
    this.device.boot();
    this.phase = 'boot';
    this.timer = 0;
    this.active = null;
    this.device.display.sleep(false);
    this.device.display.fillScreen(COLORS.BLACK);
    this.emit('boot');
  }

  splash() {
    const d = this.device, L = d.display;
    L.fillScreen(COLORS.BLACK);
    L.fillRoundRect(300, 0, 0, 0, 0, 0); // no-op keeps API honest
    L.fillRect(0, 0, 240, 135, color565(10, 12, 18));
    L.drawRoundRect(14, 26, 212, 62, 8, color565(40, 46, 60));
    L.drawCentreString('CARDPUTER', 120, 38, COLORS.WHITE, 3);
    L.drawCentreString(`emulator firmware ${this.version}`, 120, 66, color565(120, 200, 255), 1);
    L.drawCentreString(d.variant.sku + '  ·  ' + d.variant.soc.split(' ')[0], 120, 96, color565(110, 116, 130), 1);
    const p = Math.min(1, this.timer / 1.1);
    L.drawRect(30, 112, 180, 7, color565(60, 66, 80));
    L.fillRect(31, 113, Math.round(178 * p), 5, color565(90, 220, 150));
    if (!this._chime) { this._chime = true; d.speaker.tone(880, 60, 'sine', 0.25); setTimeout(() => d.speaker.tone(1320, 90, 'sine', 0.22), 90); }
  }

  // ------------------------------------------------------------- lifecycle --
  launch(id) {
    const app = this.apps.get(id);
    if (!app) { this.device.serial(`[E][fw] no such app: ${id}`, 'error'); return { ok: false, error: 'no such app' }; }
    if (this.active && this.active.onExit) this.safe(() => this.active.onExit(this.api));
    this.active = app;
    this.phase = 'run';
    this.panic = null;
    this.device.display.sleep(false);
    this.device.display.clearClip();
    this.device.display.fillScreen(COLORS.BLACK);
    this.device.serial(`[I][fw] launching ${app.name} v${app.version || '1.0'}`, 'info');
    if (app.onEnter) this.safe(() => app.onEnter(this.api));
    this.safe(() => app.setup && app.setup(this.api));
    this.history.push(id);
    if (this.history.length > 20) this.history.shift();
    this.emit('launch', id);
    return { ok: true };
  }
  exit() {
    if (this.active && this.active.onExit) this.safe(() => this.active.onExit(this.api));
    this.active = null;
    this.phase = 'splash';
    this.timer = 0;
    this._chime = true;
    this.launch(this.launcherId);
    return { ok: true };
  }
  reboot() {
    this.active = null;
    this._chime = false;
    this.device.reboot();
    this.phase = 'boot';
    this.timer = 0;
  }
  powerOff() {
    this.active = null;
    this.phase = 'off';
    this.device.powerOff();
  }

  crash(err) {
    this.panic = err;
    this.phase = 'panic';
    this.timer = 0;
    this.device.serial(`[E][panic] ${err && err.message}`, 'error');
    if (err && err.stack) for (const l of String(err.stack).split('\n').slice(0, 6)) this.device.serial('  ' + l.trim(), 'error');
    const L = this.device.display;
    L.fillScreen(color565(20, 40, 90));
    L.drawString(6, 6, 'Guru Meditation Error', color565(255, 220, 120), 1);
    L.drawString(6, 20, (this.active?.name || 'fw') + ' crashed', color565(255, 255, 255), 1);
    const msg = String(err && err.message || err);
    L.drawString(6, 34, msg.slice(0, 38), color565(255, 170, 170), 1);
    L.drawString(6, 44, msg.slice(38, 76), color565(255, 170, 170), 1);
    L.drawString(6, 60, 'PC : 0x' + (0x40000000 + (Math.random() * 0xfffff | 0)).toString(16), color565(180, 200, 255), 1);
    L.drawString(6, 70, 'EXCVADDR: 0x' + (Math.random() * 0xffff | 0).toString(16), color565(180, 200, 255), 1);
    L.drawString(6, 86, 'Backtrace:', color565(140, 200, 255), 1);
    for (let i = 0; i < 3; i++) L.drawString(14, 96 + i * 10, '0x' + (0x42000000 + (Math.random() * 0xfffff | 0)).toString(16) + ':0x' + (Math.random() * 0xffff | 0).toString(16), color565(120, 170, 220), 1);
    L.drawString(6, 124, '[ any key ] back to launcher', color565(220, 220, 220), 1);
    this.emit('panic', msg);
  }
  safe(fn) { try { return fn(); } catch (e) { this.crash(e); return null; } }

  // ----------------------------------------------------------------- tick ---
  tick(dt) {
    this.timer += dt;
    this.frame++;
    this._fpsAcc += dt; this._fpsFrames++;
    if (this._fpsAcc >= 0.5) { this.fps = this._fpsFrames / this._fpsAcc; this._fpsAcc = 0; this._fpsFrames = 0; }
    const dev = this.device;
    if (this.phase === 'off') return;
    if (this.phase === 'boot') { if (this.timer > 0.45) { this.phase = 'splash'; this.timer = 0; } return; }
    if (this.phase === 'splash') { this.splash(); if (this.timer > 1.6) { this.timer = 0; this._chime = true; this.launch(this.launcherId); } return; }
    if (this.phase === 'panic') {
      const keys = dev.keyboard.takeEvents();
      if (this.timer > 0.6 && keys.some(k => k.type === 'down')) this.exit();
      return;
    }
    if (this.phase === 'run' && this.active) {
      const evs = dev.keyboard.takeEvents();
      const chars = dev.keyboard.takeChars();
      this.api._input = { events: evs, chars, state: dev.keyboard.keyState() };
      this.api._dt = dt;
      const t0 = performance.now();
      this.safe(() => this.active.loop && this.active.loop(this.api, dt));
      // A loop() that stops returning is exactly what trips the task watchdog on real
      // silicon; measure it and feed the WDT only when the frame came back.
      this.loopMs = performance.now() - t0;
      if (this.phase === 'run') {
        if (this.loopMs > 400) {
          this.slowFrames++;
          if (this.slowFrames >= 3) {
            dev.wdt.trips++;
            this.slowFrames = 0;
            dev.serial('[E][wdt] Task watchdog got triggered: loop() blocked for ' + Math.round(this.loopMs) + ' ms', 'error');
            this.crash(new Error('Task watchdog timeout (loop() blocked ' + Math.round(this.loopMs) + ' ms)'));
            return;
          }
        } else this.slowFrames = 0;
        dev.feedWatchdog();
      }
      if (this.active && this.active.onKey) {
        for (const ev of evs) if (ev.type === 'down') this.safe(() => this.active.onKey(ev, this.api));
      }
      if (this.phase === 'run') this.api._input = { events: [], chars: [], state: dev.keyboard.keyState() };
    }
  }

  /** @type {(evt: string, payload?: any) => void} UI event sink (set by main.js) */
  onEvent(evt, payload) { void evt; void payload; }
  emit(evt, payload) { try { this.onEvent(evt, payload); } catch (e) { console.error(e); } }

  // ------------------------------------------------------------------ api ---
  get api() {
    if (this._api) return this._api;
    const self = this;
    const dev = this.device;
    const L = dev.display;

    const lcd = {
      get width() { return L.w; }, get height() { return L.h; },
      fillScreen: c => L.fillScreen(c), clear: () => L.fillScreen(COLORS.BLACK),
      fillRect: (x, y, w, h, c) => L.fillRect(x, y, w, h, c),
      drawRect: (x, y, w, h, c) => L.drawRect(x, y, w, h, c),
      fillRoundRect: (x, y, w, h, r, c) => L.fillRoundRect(x, y, w, h, r, c),
      drawRoundRect: (x, y, w, h, r, c) => L.drawRoundRect(x, y, w, h, r, c),
      drawLine: (x0, y0, x1, y1, c) => L.drawLine(x0, y0, x1, y1, c),
      drawCircle: (x, y, r, c) => L.drawCircle(x, y, r, c),
      fillCircle: (x, y, r, c) => L.fillCircle(x, y, r, c),
      drawPixel: (x, y, c) => L.pixel(x, y, c),
      drawString: (x, y, s, c, sz) => L.drawString(x, y, s, c, sz),
      drawCentreString: (s, cx, y, c, sz) => L.drawCentreString(s, cx, y, c, sz),
      drawRightString: (s, rx, y, c, sz) => L.drawRightString(s, rx, y, c, sz),
      setTextColor: (fg, bg) => L.setTextColor(fg, bg ?? null),
      setTextSize: s => L.setTextSize(s),
      setCursor: (x, y) => L.setCursor(x, y),
      setRotation: r => L.setRotation(r),
      print: s => L.print(s), println: (s = '') => L.println(s),
      textWidth: (s, sz) => L.textWidth(s, sz),
      setBrightness: v => L.setBacklight(clamp(v, 0, 1)),
      getBrightness: () => L.backlight,
      color565, COLORS,
      scroll: dy => L.scroll(dy),
      drawBar: (x, y, w, h, pct, c, bg = COLORS.DARKGREY) => { L.fillRect(x, y, w, h, bg); L.fillRect(x, y, Math.round(w * clamp(pct, 0, 1)), h, c); },
    };

    const api = {
      _input: { events: [], chars: [], state: dev.keyboard.keyState() },
      _dt: 0.016,
      device: dev,
      runtime: self,
      version: self.version,
      // ---- the M5-ish facade -------------------------------------------------
      M5: {
        Lcd: lcd, Display: lcd,
        Keyboard: {
          isPressed: () => dev.keyboard.held.size > 0,
          isChange: () => api._input.events.length > 0,
          keysState: () => api._input.state,
          getKey: () => api._input.state.word.join(''),
          takeEvents: () => api._input.events,
          isKeyPressed: id => dev.keyboard.isDown(id),
        },
        Speaker: {
          tone: (f, ms = 200, wave = 'square', vol) => dev.speaker.tone(f, ms, wave, vol),
          setVolume: v => dev.speaker.setVolume(v),
          getVolume: () => dev.speaker.volume,
          stop: () => dev.speaker.stop(),
          isEnabled: () => dev.speaker.audible,
          playSamples: (s, rate) => dev.speaker.play(s, rate),
        },
        Mic: {
          record: (ms, rate) => dev.mic.record(ms, rate),
          getLevel: () => dev.mic.level(),
          rms: s => dev.mic.rms(s),
        },
        Imu: {
          available: () => dev.imu.present,
          getAccel: () => dev.imu.getAccel(),
          getGyro: () => dev.imu.getGyro(),
          getTilt: () => ({ ...dev.imu.tilt }),
        },
        IR: { sendNec: (a, c) => dev.ir.sendNec(a, c), sendRaw: p => dev.ir.sendRaw(p), get log() { return dev.ir.log; } },
        Power: {
          getBatteryLevel: () => Math.round(dev.power.percent),
          getBatteryVoltage: () => dev.power.volts,
          isCharging: () => dev.power.charging,
          setLed: (r, g, b) => dev.setLed(r, g, b),
          lightSleep: () => { dev.mode = 'sleep'; dev.display.sleep(true); },
          wake: () => { dev.mode = 'run'; dev.display.sleep(false); },
          get isUsb() { return dev.usbConnected; },
        },
        Ex_I2C: {
          scan: () => dev.buses.grove.scan(),
          readBytes: (addr, n) => dev.buses.grove.readBytes(addr, n),
          readRegister: (addr, reg, n) => dev.buses.grove.readReg(addr, reg, n),
          writeRegister: (addr, reg, v) => dev.buses.grove.writeReg(addr, reg, v),
          writeBytes: (addr, bytes) => dev.buses.grove.writeBytes(addr, bytes),
          getSDA: () => 2, getSCL: () => 1,
        },
        In_I2C: {
          scan: () => dev.buses.internal.scan(),
          readRegister: (addr, reg, n) => dev.buses.internal.readReg(addr, reg, n),
          writeRegister: (addr, reg, v) => dev.buses.internal.writeReg(addr, reg, v),
        },
        Sd: {
          isMounted: () => dev.sd.inserted,
          open: p => ({ read: () => dev.sd.readText(p) }),
          readFile: p => dev.sd.readText(p),
          writeFile: (p, s) => dev.sd.writeText(p, s),
          appendFile: (p, s) => dev.sd.append(p, s),
          listDir: p => dev.sd.list(p || '/'),
          info: () => dev.sd.info(),
          mkdir: p => dev.sd.mkdir(p), remove: p => dev.sd.remove(p),
        },
        BtnA: { isPressed: () => dev.keyboard.isDown('enter'), wasPressed: () => api._input.events.some(e => e.id === 'enter') },
      },
      // ---- conveniences apps actually use ------------------------------------
      lcd, COLORS, color565,
      get width() { return L.w; }, get height() { return L.h; },
      keys() { return api._input.events; },
      // Edge-triggered navigation state for the current frame. Cardputer has no
      // dedicated arrow keys: they live on the Fn layer (Fn+; . , /) so both the
      // Fn layer and synthetic 'up'/'down' events are accepted here.
      input() {
        const s = api._input.state;
        const ids = new Set(api._input.events.filter(e => e.type === 'down').map(e => e.id));
        const fnHit = id => ids.has(id) && dev.keyboard.modifiers().fn;
        return {
          up: fnHit(';') || ids.has('up'),
          down: fnHit('.') || fnHit("'") || ids.has('down'),
          left: fnHit(',') || ids.has('left'),
          right: fnHit('/') || ids.has('right'),
          enter: ids.has('enter'),
          esc: fnHit('`') || ids.has('esc'),
          backspace: ids.has('backspace'),
          tab: ids.has('tab'),
          space: ids.has('space'),
          fn: s.fn, shift: s.shift, ctrl: s.ctrl,
          any: ids.size > 0,
          ids: [...ids],
        };
      },
      chars() { return api._input.chars; },
      state() { return api._input.state; },
      pressed(id) { return dev.keyboard.isDown(id); },
      typed() { return api._input.chars.join(''); },
      fn() { return api._input.state.fn; },
      serial: {
        println: (s = '') => dev.serial(`[${self.active?.name || 'app'}] ${s}`, 'app'),
        printf: (fmt, ...a) => dev.serial(`[${self.active?.name || 'app'}] ` + fmt.replace(/%[sdifx]/g, m => String(a.shift())), 'app'),
        flush: () => { },
      },
      millis: () => Math.round(dev.uptime * 1000),
      micros: () => Math.round(dev.uptime * 1e6),
      delay: () => { /* cooperative: never blocks the emulator */ },
      random: (a = 0, b = 1) => (b === undefined || a === b ? Math.random() * a : a + Math.random() * (b - a)),
      map: (v, a1, a2, b1, b2) => b1 + ((v - a1) * (b2 - b1)) / (a2 - a1 || 1),
      constrain: (v, a, b) => clamp(v, a, b),
      // ---- peripherals -------------------------------------------------------
      modules: {
        list: () => dev.modules.map(m => ({ uuid: m.uuid, id: m.def.id, name: m.def.name, eco: m.def.eco, state: m.inst.state })),
        has: id => !!dev.findModule(id),
        find: id => { const m = dev.findModule(id); return m ? m.inst : null; },
        state: id => dev.moduleState(id),
        require: id => {
          const m = dev.findModule(id);
          if (!m) throw new Error(`module "${id}" is not attached — plug it in on the Grove port`);
          return m.inst;
        },
        all: () => dev.modules,
        catalog: () => dev.catalog || [],
      },
      gpio: {
        digitalRead: p => dev.digitalRead(p),
        analogRead: p => dev.analogRead(p),
        digitalWrite: (p, v) => dev.digitalWrite(p, v),
      },
      uart: {
        // A UART unit can sit on the Grove port of every Cardputer, or on the EXT
        // header of an Adv. Bytes the module writes back are drained with read().
        available: () => !!(dev.buses.uartExt.client || dev.buses.uartGrove.client),
        bus: () => (dev.buses.uartExt.client ? dev.buses.uartExt : dev.buses.uartGrove),
        send: s => (dev.buses.uartExt.client ? dev.buses.uartExt : dev.buses.uartGrove).send(s),
        pending: () => (dev.buses.uartExt.client ? dev.buses.uartExt : dev.buses.uartGrove).pending(),
        read: n => (dev.buses.uartExt.client ? dev.buses.uartExt : dev.buses.uartGrove).read(n),
        readString: n => new TextDecoder().decode(Uint8Array.from((dev.buses.uartExt.client ? dev.buses.uartExt : dev.buses.uartGrove).read(n))),
        flush: () => (dev.buses.uartExt.client ? dev.buses.uartExt : dev.buses.uartGrove).flush(),
        setBaud: b => { const u = dev.buses.uartExt.client ? dev.buses.uartExt : dev.buses.uartGrove; u.baud = b; },
      },
      wifi: {
        available: () => dev.radio.hasWifi,
        scan: () => dev.radio.scan(),
        connect: (ssid, pass) => dev.radio.connect(ssid, pass),
        disconnect: () => dev.radio.disconnect(),
        status: () => ({ state: dev.radio.state, ssid: dev.radio.ssid, ip: dev.radio.ip, rssi: dev.radio.rssi }),
        bleScan: () => dev.radio.bleScan(),
      },
      http: {
        get: async (url) => {
          if (!self.fetcher) throw new Error('no network backend available');
          return self.fetcher(url);
        },
      },
      sd: api0(dev),
      power: {
        percent: () => Math.round(dev.power.percent),
        voltage: () => dev.power.volts,
        charging: () => dev.power.charging,
        milliamps: () => dev.power.milliamps,
        capacity: () => dev.power.capacityMah,
        led: (r, g, b) => dev.setLed(r, g, b),
      },
      apps: {
        list: () => [...self.apps.values()].map(a => ({ id: a.id, name: a.name, icon: a.icon, category: a.category, version: a.version, system: !!a.system })),
        launch: id => self.launch(id),
        current: () => self.active?.id,
      },
      // watchdog + thermal are visible to firmware, like esp_task_wdt / temperatureRead()
      wdt: {
        enabled: () => dev.wdt.enabled,
        setTimeout: ms => { dev.wdt.timeoutMs = clamp(Number(ms) || 5000, 500, 60000); },
        feed: () => dev.feedWatchdog(),
        trips: () => dev.wdt.trips,
      },
      thermal: {
        dieC: () => +dev.thermal.dieC.toFixed(1),
        ambientC: () => dev.thermal.ambientC,
        throttled: () => dev.thermal.throttled,
        cpuMhz: () => (dev.thermal.throttled ? 160 : dev.variant.mhz),
      },
      // flash/NVS/OTA surface: a firmware app can read its own partition state or
      // hand the emulator a new program to install, exactly like a self-updater.
      flash: {
        info: () => (self.flash ? self.flash.info() : null),
        slot: () => (self.flash ? self.flash.slot : null),
        switchSlot: () => (self.flash ? self.flash.switchSlot() : { ok: false }),
        nvs: {
          get: (k, d = null) => (self.flash ? self.flash.nvs.get(k, d) : d),
          set: (k, v) => (self.flash ? self.flash.nvs.set(k, v) : false),
          erase: k => (self.flash ? self.flash.nvs.erase(k) : false),
          list: () => (self.flash ? self.flash.nvs.entries() : []),
        },
        install: (source, meta) => (self.flash ? self.flash.installApp(source, meta) : Promise.resolve({ ok: false, error: 'no flash backend' })),
      },
      ir: {
        rangeCm: angle => dev.ir.rangeCm(angle),
        captures: () => dev.ir.captures.slice(-8),
        learn: (bytes, opts) => dev.ir.learnNec(bytes, opts),
        replay: i => { const f = dev.ir.captures.slice(-8)[i ?? -1]; if (f) { dev.ir.sendRaw(f.pulses); return true; } return false; },
      },
      exit: () => self.exit(),
      reboot: () => self.reboot(),
      notify: (msg, level = 'info') => { dev.serial(`[I][ui] ${msg}`, level); self.emit('toast', { msg, level }); },
      crash: e => self.crash(e),
      // simple reusable widgets so app code stays short
      ui: makeWidgets(lcd, COLORS),
    };
    function api0(d) {
      return {
        mounted: () => d.sd.inserted,
        read: p => d.sd.readText(p),
        write: (p, s) => d.sd.writeText(p, s),
        list: p => d.sd.list(p),
        info: () => d.sd.info(),
      };
    }
    this._api = api;
    return api;
  }
}

function makeWidgets(lcd, C) {
  return {
    header(title, right = '') {
      lcd.fillRect(0, 0, lcd.width, 13, C.PANEL);
      lcd.drawString(3, 3, title, C.WHITE, 1);
      if (right) lcd.drawRightString(right, lcd.width - 3, 3, C.AMBER, 1);
    },
    footer(text) {
      lcd.fillRect(0, lcd.height - 11, lcd.width, 11, C.PANEL);
      lcd.drawString(3, lcd.height - 9, text, C.LIGHTGREY, 1);
    },
    statusBar(dev) {
      const pct = Math.round(dev.power.percent);
      lcd.fillRect(0, 0, lcd.width, 10, C.PANEL);
      lcd.drawString(2, 2, dev.variant.sku, C.LIGHTGREY, 1);
      lcd.drawRightString(`${pct}%${dev.power.charging ? '+' : ''}`, lcd.width - 2, 2, pct < 20 ? C.RED : C.GREEN, 1);
      lcd.drawRightString(dev.wifiIcon ? 'wifi' : '', lcd.width - 40, 2, C.CYAN, 1);
    },
    list(items, sel, { x = 4, y = 16, w = 232, rowH = 12, color = C.WHITE, selColor = C.AMBER } = {}) {
      items.forEach((it, i) => {
        const yy = y + i * rowH;
        if (yy + rowH > lcd.height - 12) return;
        if (i === sel) {
          lcd.fillRect(x - 2, yy - 1, w, rowH, C.PANEL);
          lcd.fillRect(x - 2, yy - 1, 2, rowH, selColor);
        }
        lcd.drawString(x + 2, yy + 1, String(it.label ?? it), i === sel ? selColor : color, 1);
        if (it.right) lcd.drawRightString(String(it.right), x + w - 4, yy + 1, i === sel ? selColor : C.GREY, 1);
      });
    },
    gauge(x, y, w, h, pct, fg = C.GREEN, bg = C.DARKGREY) {
      lcd.fillRect(x, y, w, h, bg);
      lcd.fillRect(x, y, Math.round(w * clamp(pct, 0, 1)), h, fg);
    },
  };
}

// ────────────────────────────────────────────── js/apps/apps.js
// =============================================================================
//  Firmware apps. Each one is a tiny Arduino-style program: setup() + loop().
//  They draw straight into the emulated ST7789 framebuffer and read the
//  emulated keyboard / modules, exactly like firmware on real hardware.
// =============================================================================

const hex2 = n => '0x' + (n >>> 0).toString(16).toUpperCase().padStart(2, '0');

// ----------------------------------------------------------------- launcher --
const launcher = {
  id: 'launcher', name: 'CardputerOS', short: 'Home', icon: 'OS', color: '#60a5fa', system: true, version: '1.0.0',
  about: 'Home screen. Arrow keys (Fn + ; . , /) to move, ENTER to launch, Fn+` to go back.',
  setup(api) {
    this.sel = 0; this.page = 0;
    this.apps = api.apps.list().filter(a => !a.system);
    this.t0 = 0;
  },
  loop(api, dt) {
    const L = api.lcd, K = api.COLORS;
    if (!this.apps || this.apps.length !== api.apps.list().filter(a => !a.system).length) this.setup(api);
    const inp = api.input();
    const cols = 3, rows = 4, perPage = cols * rows;
    const pages = Math.max(1, Math.ceil(this.apps.length / perPage));
    if (inp.right) this.sel = (this.sel + 1) % this.apps.length;
    if (inp.left) this.sel = (this.sel + this.apps.length - 1) % this.apps.length;
    if (inp.down) this.sel = (this.sel + cols) % this.apps.length;
    if (inp.up) this.sel = (this.sel + this.apps.length - cols) % this.apps.length;
    this.page = Math.floor(this.sel / perPage);
    if (inp.enter) { const a = this.apps[this.sel]; api.M5.Speaker.tone(1200, 24, 'square', 0.12); return api.apps.launch(a.id); }

    L.fillScreen(api.color565(6, 8, 12));
    // top bar
    L.fillRect(0, 0, 240, 12, api.color565(26, 32, 44));
    L.drawString(4, 3, 'CardputerOS', K.WHITE, 1);
    L.drawRightString(`v${api.version}`, 236, 3, api.color565(120, 130, 150), 1);
    const pct = api.power.percent();
    L.drawRightString(`${pct}%${api.power.charging() ? '+' : ''}`, 196, 3, pct < 20 ? K.RED : K.GREEN, 1);
    // module + wifi indicators
    const mods = api.modules.list().length;
    L.drawString(150, 3, `${mods}mod`, mods ? K.CYAN : api.color565(90, 96, 110), 1);

    const start = this.page * perPage;
    for (let i = 0; i < perPage; i++) {
      const app = this.apps[start + i];
      if (!app) break;
      const cx = 3 + (i % cols) * 79, cy = 15 + Math.floor(i / cols) * 23;
      const selected = start + i === this.sel;
      const accent = hexColor(app.color || '#64748b');
      L.fillRoundRect(cx, cy, 76, 21, 3, selected ? api.color565(48, 56, 72) : api.color565(24, 29, 38));
      if (selected) L.drawRoundRect(cx, cy, 76, 21, 3, K.AMBER);
      L.fillRoundRect(cx + 2, cy + 3, 15, 15, 3, accent);
      L.drawString(cx + 5, cy + 7, app.icon.slice(0, 2), api.color565(9, 11, 16), 1);
      L.drawString(cx + 21, cy + 3, (app.short || app.name).slice(0, 9), selected ? K.AMBER : api.color565(244, 248, 255), 1);
      L.drawString(cx + 21, cy + 12, (app.category || '').slice(0, 9), api.color565(138, 150, 170), 1);
    }
    // page dots
    for (let pg = 0; pg < pages; pg++) L.fillCircle(112 + pg * 10, 112 + (pages > 1 ? 0 : 0), 2, pg === this.page ? K.AMBER : api.color565(60, 68, 84));
    // bottom bar
    L.fillRect(0, 124, 240, 11, api.color565(26, 32, 44));
    L.drawString(4, 126, `${this.sel + 1}/${this.apps.length}  ${this.apps[this.sel]?.name || ''}`, K.LIGHTGREY, 1);
    L.drawRightString(`page ${this.page + 1}/${pages}`, 236, 126, api.color565(120, 130, 150), 1);
  },
};

function hexColor(h) {
  const n = parseInt(String(h).replace('#', ''), 16);
  const r = (n >> 16) & 0xff, g = (n >> 8) & 0xff, b = n & 0xff;
  return ((r & 0xf8) << 8) | ((g & 0xfc) << 3) | (b >> 3);
}

// ----------------------------------------------------------------- terminal --
const terminal = {
  id: 'terminal', name: 'Terminal', short: 'Terminal', icon: '>_', color: '#22c55e', category: 'tools', version: '1.2.0',
  about: 'CardputerOS shell: i2c scan, gpio, wifi, sd, modules, ir, led, reboot…',
  setup(api) {
    this.lines = ['CardputerOS shell — type "help"', ''];
    this.input = '';
    this.hist = []; this.histIdx = 0;
    this.blink = 0;
    api.serial.println('shell started');
  },
  loop(api, dt) {
    const inp = api.input();
    this.blink += dt;
    for (const ch of api.chars()) {
      if (ch === '\n') { this.run(api, this.input.trim()); this.input = ''; }
      else if (ch === '\b') this.input = this.input.slice(0, -1);
      else if (ch >= ' ' && ch.length === 1) this.input += ch;
    }
    if (inp.esc) return api.exit();
    const L = api.lcd, K = api.COLORS;
    L.fillScreen(api.color565(6, 10, 8));
    const rows = 12;
    const inputY = 125;
    const prompt = '> ' + this.input.slice(-36);
    L.drawString(2, inputY, prompt, K.WHITE, 1);
    if (Math.floor(this.blink * 2) % 2 === 0) L.fillRect(2 + prompt.length * 6, inputY, 5, 7, K.GREEN);
    L.fillRect(0, inputY - 3, 240, 1, api.color565(20, 50, 34));
    const view = this.lines.slice(-rows);
    const top = inputY - 6 - view.length * 9;
    view.forEach((line, i) => {
      const isErr = /^(err|E:)/.test(line);
      L.drawString(2, top + i * 9, line.slice(0, 39), isErr ? K.RED : api.color565(150, 235, 170), 1);
    });
  },
  out(line) { this.lines.push(String(line)); if (this.lines.length > 120) this.lines.shift(); },
  run(api, cmd) {
    if (!cmd) return;
    this.out('> ' + cmd);
    const [c, ...args] = cmd.split(/\s+/);
    try { this.cmd(api, c.toLowerCase(), args); }
    catch (e) { this.out('err: ' + e.message); }
  },
  cmd(api, c, a) {
    const d = api.device;
    switch (c) {
      case 'help':
        this.out('ls cat echo mod i2c gpio wifi ble sd bat');
        this.out('led beep ir app run reboot time free clear');
        break;
      case 'clear': this.lines.length = 0; break;
      case 'mod': {
        const m = api.modules.list();
        if (!m.length) return this.out('no modules attached');
        m.forEach(x => this.out(` ${x.eco.padEnd(6)} ${x.name} (${x.id})`));
        this.out(`i2c grove: ${api.M5.Ex_I2C.scan().map(hex2).join(' ') || '-'}`);
        break;
      }
      case 'i2c': {
        const bus = a[0] === 'in' ? api.M5.In_I2C : api.M5.Ex_I2C;
        const found = bus.scan();
        this.out(`scan ${a[0] === 'in' ? 'internal' : 'grove'}: ${found.length} dev`);
        found.forEach(x => this.out(`  ${hex2(x)}  ${d.buses[a[0] === 'in' ? 'internal' : 'grove'].clients.get(x).name}`));
        if (!found.length) this.out('  (nothing responded)');
        break;
      }
      case 'gpio': {
        const pin = +(a[0] || 2);
        this.out(`gpio${pin} digital=${api.gpio.digitalRead(pin)} analog=${api.gpio.analogRead(pin)}`);
        break;
      }
      case 'ls': {
        if (!api.sd.mounted()) return this.out('err: no SD card');
        api.sd.list('/').forEach(f => this.out(` ${f.dir ? 'd' : '-'} ${f.name}`));
        break;
      }
      case 'cat': {
        const t = api.sd.read(a[0] || '/README.txt');
        if (t == null) return this.out('err: not found');
        t.split('\n').slice(0, 6).forEach(l => this.out(' ' + l));
        break;
      }
      case 'wifi': {
        if (a[0] === 'scan' || !a.length) {
          api.wifi.scan();
          const res = d.radio.listAccessPoints();
          res.forEach(ap => this.out(` ${ap.ssid.padEnd(16)} ${ap.rssi}dB ${ap.auth}`));
        } else if (a[0] === 'conn' || a[0] === 'connect') {
          const r = api.wifi.connect(a[1], a[2] || 'cardputer123');
          this.out(r.ok ? `connecting to ${a[1]}...` : 'err: ' + r.error);
        } else if (a[0] === 'status') {
          const s = api.wifi.status(); this.out(` ${s.state} ${s.ssid || '-'} ${s.ip}`);
        } else this.out('usage: wifi scan|connect <ssid> [pass]|status');
        break;
      }
      case 'ble': d.radio.bleScan().forEach(b => this.out(` ${b.name} ${b.rssi}dB`)); break;
      case 'sd': {
        const i = api.sd.info();
        this.out(` card ${i.inserted ? 'mounted' : 'absent'} ${(i.used / 1024).toFixed(1)}/${(i.capacity / 1024 ** 3).toFixed(0)}GB`);
        break;
      }
      case 'bat': {
        const p = api.power;
        this.out(` ${p.percent()}% ${p.voltage().toFixed(2)}V ${p.milliamps().toFixed(0)}mA ${p.charging() ? 'charging' : ''}`);
        break;
      }
      case 'led': api.power.led(+a[0] || 0, +a[1] || 0, +a[2] || 0); this.out('led set'); break;
      case 'beep': api.M5.Speaker.tone(+(a[0] || 880), +(a[1] || 120)); this.out(`beep ${a[0] || 880}Hz`); break;
      case 'ir': {
        if (a[0] === 'log') return api.M5.IR.log.slice(0, 5).forEach(x => this.out(` ${x.protocol} ${hex2(x.addr)} ${hex2(x.cmd)}`));
        const e = api.M5.IR.sendNec(parseInt(a[0] || '0x00', 16), parseInt(a[1] || '0x45', 16));
        this.out(`sent NEC ${hex2(e.addr)}:${hex2(e.cmd)}`);
        break;
      }
      case 'app': case 'apps': api.apps.list().forEach(x => this.out(` ${x.id.padEnd(10)} v${x.version || '1.0'}`)); break;
      case 'run': return api.apps.launch(a[0]);
      case 'time': this.out(' ' + new Date().toTimeString().slice(0, 8)); break;
      case 'free': this.out(` heap ${(180 + Math.round(Math.random() * 40))}KB  psram 0  cpu ${(d.cpuLoad * 100).toFixed(0)}%`); break;
      case 'reboot': return api.reboot();
      case 'poweroff': return api.device.powerOff();
      case 'echo': this.out(' ' + a.join(' ')); break;
      default: this.out(`err: ${c}: command not found`);
    }
  },
};

// -------------------------------------------------------------------- snake --
const snake = {
  id: 'snake', name: 'Snake', icon: 'SN', color: '#f97316', category: 'games', version: '1.0.2',
  about: 'Classic snake. Steering: Fn + ; . , /  — Fn+` quits.',
  setup(api) { this.reset(api); this.acc = 0; },
  reset(api) {
    this.body = [{ x: 20, y: 11 }, { x: 19, y: 11 }, { x: 18, y: 11 }];
    this.dir = { x: 1, y: 0 }; this.next = { x: 1, y: 0 };
    this.score = 0; this.dead = false;
    this.food = { x: 30, y: 11 };
    this.speed = 0.13;
    this.w = 48; this.h = 23;   // 5px cells inside a 240x115 field
  },
  loop(api, dt) {
    const inp = api.input(), L = api.lcd, K = api.COLORS;
    if (inp.esc) return api.exit();
    if (this.dead) {
      if (inp.enter) { this.reset(api); api.M5.Speaker.tone(660, 60); }
      L.fillScreen(api.color565(14, 8, 8));
      L.drawCentreString('GAME OVER', 120, 44, K.RED, 2);
      L.drawCentreString(`score ${this.score}`, 120, 68, K.WHITE, 1);
      L.drawCentreString('ENTER to retry · Fn+` to quit', 120, 88, api.color565(150, 150, 150), 1);
      return;
    }
    if (inp.up && this.dir.y === 0) this.next = { x: 0, y: -1 };
    if (inp.down && this.dir.y === 0) this.next = { x: 0, y: 1 };
    if (inp.left && this.dir.x === 0) this.next = { x: -1, y: 0 };
    if (inp.right && this.dir.x === 0) this.next = { x: 1, y: 0 };

    this.acc += dt;
    if (this.acc >= this.speed) {
      this.acc = 0;
      this.dir = this.next;
      const head = { x: this.body[0].x + this.dir.x, y: this.body[0].y + this.dir.y };
      if (head.x < 0 || head.y < 0 || head.x >= this.w || head.y >= this.h || this.body.some(b => b.x === head.x && b.y === head.y)) {
        this.dead = true;
        api.M5.Speaker.tone(180, 260, 'sawtooth', 0.2);
        return;
      }
      this.body.unshift(head);
      if (head.x === this.food.x && head.y === this.food.y) {
        this.score += 10;
        this.speed = Math.max(0.06, this.speed - 0.004);
        api.M5.Speaker.tone(1500, 40, 'square', 0.12);
        do { this.food = { x: Math.floor(Math.random() * this.w), y: Math.floor(Math.random() * this.h) }; }
        while (this.body.some(b => b.x === this.food.x && b.y === this.food.y));
      } else this.body.pop();
    }
    L.fillScreen(api.color565(8, 16, 10));
    L.fillRect(0, 0, 240, 14, api.color565(20, 30, 22));
    L.drawString(4, 3, `SCORE ${this.score}`, K.GREEN, 1);
    L.drawRightString(`len ${this.body.length}`, 236, 3, api.color565(140, 200, 150), 1);
    L.fillRect(this.food.x * 5, 16 + this.food.y * 5, 5, 5, K.RED);
    this.body.forEach((b, i) => L.fillRect(b.x * 5, 16 + b.y * 5, 5, 5, i === 0 ? K.LIME : api.color565(40, 190, 90)));
  },
};

// -------------------------------------------------------------------- paint --
const paint = {
  id: 'paint', name: 'Paint', icon: 'PT', color: '#a855f7', category: 'tools', version: '1.0.0',
  about: 'Pixel sketcher. Move with arrows, SPACE draws, C cycles colour, X clears, S saves to SD.',
  setup(api) { this.x = 120; this.y = 70; this.ci = 0; this.px = []; this.colors = [COLORS_RGB(255, 80, 80), COLORS_RGB(80, 220, 120), COLORS_RGB(90, 160, 255), COLORS_RGB(255, 220, 90), COLORS_RGB(240, 240, 240)]; this.rep = 0; },
  loop(api, dt) {
    const inp = api.input(), L = api.lcd, K = api.COLORS;
    this.rep += dt;
    const step = 3, repeat = this.rep > 0.18;
    if (repeat && (inp.up || inp.down || inp.left || inp.right)) this.rep = 0;
    if (inp.up && repeat) this.y = Math.max(14, this.y - step);
    if (inp.down && repeat) this.y = Math.min(132, this.y + step);
    if (inp.left && repeat) this.x = Math.max(2, this.x - step);
    if (inp.right && repeat) this.x = Math.min(237, this.x + step);
    const typed = api.typed();
    if (typed.includes('c')) this.ci = (this.ci + 1) % this.colors.length;
    if (typed.includes('s') && api.sd.mounted()) { api.sd.write('/paint.txt', this.px.map(p => `${p.x},${p.y},${p.c}`).join('\n')); api.notify('saved /paint.txt'); }
    if (typed.includes('x')) this.px = [];
    if (inp.esc) return api.exit();
    if (inp.space || api.pressed('space')) this.px.push({ x: this.x, y: this.y, c: this.ci });
    if (this.px.length > 3000) this.px.shift();
    L.fillScreen(api.color565(14, 14, 20));
    for (const p of this.px) L.fillRect(p.x, p.y, 2, 2, this.colors[p.c]);
    L.drawRect(this.x, this.y, 3, 3, K.WHITE);
    L.fillRect(0, 0, 240, 12, api.color565(30, 26, 40));
    L.drawString(3, 2, 'PAINT', K.WHITE, 1);
    L.drawRightString('space=draw c=col x=clear s=save', 237, 2, api.color565(150, 140, 170), 1);
    for (let i = 0; i < this.colors.length; i++) L.fillRect(4 + i * 10, 125, 8, 8, this.colors[i]);
    L.drawRect(4 + this.ci * 10, 125, 8, 8, K.WHITE);
  },
};
function COLORS_RGB(r, g, b) { return ((r & 0xf8) << 8) | ((g & 0xfc) << 3) | (b >> 3); }

const calc = {
  id: 'calc', name: 'Calc', icon: 'CC', color: '#38bdf8', category: 'tools', version: '1.1.0',
  about: 'Four-function calculator. Type an expression, ENTER to evaluate.',
  setup() { this.expr = ''; this.result = ''; this.err = ''; },
  loop(api) {
    const L = api.lcd, K = api.COLORS;
    const inp = api.input();
    for (const ch of api.chars()) {
      if (ch === '\n') { this.evaluate(); continue; }
      if (ch === '\b') { this.expr = this.expr.slice(0, -1); continue; }
      if (/[0-9+\-*/().%^ ]/.test(ch)) this.expr += ch;
    }
    if (inp.esc) return api.exit();
    L.fillScreen(api.color565(10, 16, 26));
    L.fillRect(0, 0, 240, 12, api.color565(20, 34, 50));
    L.drawString(3, 2, 'CALCULATOR', K.WHITE, 1);
    L.drawString(6, 22, '›', api.color565(120, 180, 240), 1);
    L.drawString(18, 20, this.expr.slice(-34), K.WHITE, 1);
    L.fillRect(4, 34, 232, 1, api.color565(50, 70, 100));
    const shown = this.err ? 'error' : (this.result !== '' ? this.result : '0');
    L.drawRightString(String(shown).slice(-22), 234, 42, this.err ? K.RED : K.AMBER, 3);
    L.drawString(4, 84, this.err ? 'err: ' + this.err : 'ENTER = evaluate  Fn+` = quit', api.color565(110, 140, 170), 1);
    L.fillRect(4, 96, 232, 1, api.color565(50, 70, 100));
    L.drawString(4, 103, 'digits   + - * /   ( )   %   ^', api.color565(120, 150, 180), 1);
    L.drawString(4, 115, 'history:', api.color565(90, 120, 150), 1);
    L.drawString(50, 115, this.hist || '', api.color565(200, 210, 220), 1);
  },
  evaluate() {
    const e = this.expr.replace(/\^/g, '**').replace(/%/g, '/100');
    if (!e.trim()) return;
    try {
      if (!/^[\d+\-*/().\s]+$/.test(e)) throw new Error('bad chars');
      const v = Function(`"use strict";return (${e})`)();
      if (!isFinite(v)) throw new Error('not finite');
      this.result = Math.round(v * 1e6) / 1e6;
      this.hist = (this.expr + ' = ' + this.result).slice(-40);
      this.expr = String(this.result);
      this.err = '';
    } catch (err) { this.err = err.message; }
  },
};

// ------------------------------------------------------------- audio out ----
class AudioOut {
  constructor() {
    this.ctx = null;
    this.enabled = true;
    this.master = null;
    this.micStream = null;
    this.micAnalyser = null;
    this.micBuf = null;
  }
  ensure() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return this.ctx; }
    const AC = window.AudioContext || /** @type {any} */ (window).webkitAudioContext;
    if (!AC) return null;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.6;
    this.master.connect(this.ctx.destination);
    return this.ctx;
  }
  tone({ freq, ms, wave = 'square', vol = 0.5, audible = true }) {
    if (!audible || !this.enabled) return;
    const ctx = this.ensure(); if (!ctx) return;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = wave === 'sawtooth' ? 'sawtooth' : wave === 'sine' ? 'sine' : wave === 'triangle' ? 'triangle' : 'square';
    osc.frequency.value = clamp(freq, 30, 12000);
    const t = ctx.currentTime;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(clamp(vol, 0, 1) * 0.18, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0008, t + Math.max(0.03, ms / 1000));
    osc.connect(g).connect(this.master);
    osc.start(t); osc.stop(t + Math.max(0.04, ms / 1000) + 0.02);
  }
  click(strength = 1) {
    if (!this.enabled) return;
    const ctx = this.ensure(); if (!ctx) return;
    const len = Math.floor(ctx.sampleRate * 0.02);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3) * 0.35 * strength;
    const src = ctx.createBufferSource();
    const g = ctx.createGain(); g.gain.value = 0.5;
    src.buffer = buf; src.connect(g).connect(this.master); src.start();
  }
  async enableMic(device) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const ctx = this.ensure();
      const src = ctx.createMediaStreamSource(stream);
      const an = ctx.createAnalyser();
      an.fftSize = 512;
      src.connect(an);
      this.micStream = stream; this.micAnalyser = an;
      this.micBuf = new Float32Array(an.fftSize);
      device.mic.jackSource = () => {
        an.getFloatTimeDomainData(this.micBuf);
        let peak = 0;
        for (const v of this.micBuf) peak = Math.max(peak, Math.abs(v));
        return peak;
      };
      return true;
    } catch (e) {
      return false;
    }
  }
}

// ------------------------------------------------------------- LCD view -----
class ScreenView {
  constructor(canvas, device, dimEl = null) {
    this.canvas = canvas;
    this.device = device;
    this.dimEl = dimEl;
    this.ctx = canvas.getContext('2d', { alpha: false });
    const W = device.display.nativeW, H = device.display.nativeH;
    canvas.width = W; canvas.height = H;
    this.img = this.ctx.createImageData(W, H);
    this.rgba = new Uint8ClampedArray(W * H * 4);
    this.ctx.fillStyle = '#000';
    this.ctx.fillRect(0, 0, W, H);
  }
  render() {
    const d = this.device.display;
    const rgba = d.toRGBA(this.rgba);
    this.img.data.set(rgba);
    this.ctx.putImageData(this.img, 0, 0);
    d.frameCount++;                       // frames actually scanned out to the panel
    d.dirty = false;
    // Backlight/sleep are physical: dim with a black overlay so the pixel grid
    // stays perfectly crisp (a CSS filter would resample the canvas).
    const bl = d.asleep ? 0 : clamp(d.backlight, 0, 1);
    if (this.dimEl) this.dimEl.style.opacity = String(1 - bl * 0.94);
  }
}

// ------------------------------------------------------------ key mapping ---
// host key -> device key id (+ whether Shift must be held)
const HOST_MAP = {
  Backquote: ['`', false], Digit1: ['1', false], Digit2: ['2', false], Digit3: ['3', false], Digit4: ['4', false],
  Digit5: ['5', false], Digit6: ['6', false], Digit7: ['7', false], Digit8: ['8', false], Digit9: ['9', false],
  Digit0: ['0', false], Minus: ['-', false], Equal: ['=', false], Backspace: ['backspace', false],
  Tab: ['tab', false], KeyQ: ['q', false], KeyW: ['w', false], KeyE: ['e', false], KeyR: ['r', false], KeyT: ['t', false],
  KeyY: ['y', false], KeyU: ['u', false], KeyI: ['i', false], KeyO: ['o', false], KeyP: ['p', false],
  BracketLeft: ['[', false], BracketRight: [']', false], Backslash: ['\\', false],
  KeyA: ['a', false], KeyS: ['s', false], KeyD: ['d', false], KeyF: ['f', false], KeyG: ['g', false], KeyH: ['h', false],
  KeyJ: ['j', false], KeyK: ['k', false], KeyL: ['l', false], Semicolon: [';', false], Quote: ["'", false], Enter: ['enter', false],
  KeyZ: ['z', false], KeyX: ['x', false], KeyC: ['c', false], KeyV: ['v', false], KeyB: ['b', false], KeyN: ['n', false],
  KeyM: ['m', false], Comma: [',', false], Period: ['.', false], Slash: ['/', false], Space: ['space', false],
};
// shifted symbols are produced by Shift + the unshifted key
const SHIFT_OF = { '~': '`', '!': '1', '@': '2', '#': '3', '$': '4', '%': '5', '^': '6', '&': '7', '*': '8', '(': '9', ')': '0', '_': '-', '+': '=', '{': '[', '}': ']', '|': '\\', ':': ';', '"': "'", '<': ',', '>': '.', '?': '/' };
// host arrows / esc map onto the Cardputer Fn layer
const FN_LAYER = { ArrowUp: ';', ArrowDown: '.', ArrowLeft: ',', ArrowRight: '/', Escape: '`' };

class KeyboardView {
  /** @param {{onAction?: (type: string, id: string) => void}} [__opts] */
  constructor(root, device, __opts = {}) {
    const { onAction } = /** @type {{onAction?: (type: string, id: string) => void}} */ (__opts);
    this.root = root;
    this.device = device;
    this.keys = new Map();
    this.onAction = onAction || (() => { });
    this.fnLatch = false;
    this.build();
    this.bindHost();
  }
  build() {
    this.root.innerHTML = '';
    this.root.style.setProperty('--cols', '14');
    KEY_ROWS.forEach((row, r) => {
      row.forEach((k, c) => {
        const el = document.createElement('button');
        el.className = 'key';
        el.type = 'button';
        el.dataset.id = k.id;
        el.style.gridRow = String(r + 1);
        el.style.gridColumn = String(c + 1);
        const wide = ['backspace', 'enter', 'space', 'tab', 'shift', 'fn'].includes(k.id);
        if (wide) el.classList.add('key-wide');
        if (['fn', 'shift', 'ctrl', 'opt', 'alt'].includes(k.id)) el.classList.add('key-mod');
        const legend = k.base === ' ' ? '␣' : k.base.length > 1 ? k.base : k.base.toUpperCase();
        el.innerHTML = `<span class="legend">${legend}</span>${k.fn ? `<span class="fnlabel">${k.fn}</span>` : ''}`;
        const press = (ev) => {
          ev.preventDefault();
          if (!this.device.keyboard.isDown(k.id)) {
            this.device.keyboard.down(k.id, this.device.uptime * 1000);
            el.classList.add('down');
            this.onAction('keydown', k.id);
          }
        };
        const release = () => {
          if (this.device.keyboard.isDown(k.id)) {
            this.device.keyboard.up(k.id, this.device.uptime * 1000);
            el.classList.remove('down');
          }
        };
        el.addEventListener('pointerdown', press);
        el.addEventListener('pointerup', release);
        el.addEventListener('pointerleave', release);
        el.addEventListener('pointercancel', release);
        this.keys.set(k.id, el);
        this.root.appendChild(el);
      });
    });
    this.sync();
  }
  sync() {
    for (const [id, el] of this.keys) {
      const down = this.device.keyboard.isDown(id);
      el.classList.toggle('down', down);
    }
  }
  bindHost() {
    window.addEventListener('keydown', e => {
      const tgt = /** @type {HTMLElement} */ (e.target);
      if (tgt && ['INPUT', 'TEXTAREA', 'SELECT'].includes(tgt.tagName)) return;
      if (e.metaKey || (e.ctrlKey && e.code === 'KeyR')) return;    // let browser shortcuts through
      const mods = { Shift: 'shift', Control: 'ctrl', Alt: 'alt', Meta: 'opt', CapsLock: 'fn' };
      if (mods[e.key]) {
        e.preventDefault();
        this.hit(mods[e.key], true);
        return;
      }
      let target = HOST_MAP[e.code];
      let shift = e.shiftKey;
      if (!target && SHIFT_OF[e.key]) { target = [SHIFT_OF[e.key], false]; shift = true; }
      if (!target && FN_LAYER[e.code]) {
        e.preventDefault();
        if (e.repeat) return;
        this.combo(['fn', FN_LAYER[e.code]]);
        return;
      }
      if (!target) return;
      e.preventDefault();
      if (e.repeat) return;
      if (shift) this.hit('shift', true);
      this.hit(target[0], true);
      if (shift) setTimeout(() => this.hit('shift', false), 12);
    });
    window.addEventListener('keyup', e => {
      const tgt = /** @type {HTMLElement} */ (e.target);
      if (tgt && ['INPUT', 'TEXTAREA', 'SELECT'].includes(tgt.tagName)) return;
      const mods = { Shift: 'shift', Control: 'ctrl', Alt: 'alt', Meta: 'opt', CapsLock: 'fn' };
      if (mods[e.key]) { this.hit(mods[e.key], false); return; }
      const target = HOST_MAP[e.code];
      if (target && !FN_LAYER[e.code]) this.hit(target[0], false);
      else if (FN_LAYER[e.code]) { for (const id of ['fn', FN_LAYER[e.code]]) this.hit(id, false); }
      else if (SHIFT_OF[e.key]) this.hit(SHIFT_OF[e.key], false);
    });
    window.addEventListener('blur', () => this.device.keyboard.releaseAll());
  }
  hit(id, down) {
    const d = this.device;
    if (down) {
      if (d.keyboard.isDown(id)) return;
      d.keyboard.down(id, d.uptime * 1000);
    } else d.keyboard.up(id, d.uptime * 1000);
    this.keys.get(id)?.classList.toggle('down', down);
  }
  // press a chord like ['fn', ';'] and auto-release it after ~90 ms
  combo(ids, ms = 90) {
    for (const id of ids) this.hit(id, true);
    this.onAction('keydown', ids[ids.length - 1]);
    setTimeout(() => { for (const id of ids) this.hit(id, false); }, ms);
  }
}
