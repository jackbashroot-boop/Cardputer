<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cardputer EMU — M5Stack Cardputer emulator</title>
<meta name="description" content="Cross-platform M5Stack Cardputer emulator with hot-pluggable Grove modules, auto-updates and a full 240x135 LCD / 56-key hardware model.">
<link rel="stylesheet" href="css/emulator.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="logo">
      <span class="logo-grid" aria-hidden="true"></span>
      <b>CARDPUTER</b><i>EMU</i>
      <span class="logo-sub">M5Stack K132 · ESP32-S3</span>
    </div>
    <div class="spacer"></div>
    <div class="pills" id="statusPills">
      <span class="pill"><span class="dot run" id="statusDot"></span><span id="statusState">booting</span></span>
      <span class="pill pill-action" id="statusVariant" title="click to swap the board (v1.0 → v1.1 → Adv)">Cardputer-Adv</span>
      <span class="pill" id="statusApp">—</span>
      <span class="pill" id="statusModules">0 modules</span>
      <span class="pill" id="statusBattery">—</span>
      <span class="pill accent" id="statusVer">v1.0.0</span>
    </div>
  </header>

  <main>
    <section class="stage" id="deviceStage" aria-label="Emulated Cardputer"></section>
    <aside class="console" id="console" aria-label="Emulator console"></aside>
  </main>

  <footer class="footbar">
    <span>F1 help · F2 modules · Ctrl+Shift+S serial · Ctrl+Shift+U updates</span>
    <span class="spacer"></span>
    <span id="footNative">browser mode</span>
  </footer>

  <div id="toasts" class="toasts" aria-live="polite"></div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
