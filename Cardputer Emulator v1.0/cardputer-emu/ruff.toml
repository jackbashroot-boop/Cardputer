# Lint gate for the Python half of the emulator (stdlib-only, no runtime deps).
#   python3 -m ruff check .        (or: python3 -m ruff check cardputer tools tests)
line-length = 130
target-version = "py39"

[lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "EXE", "PT"]
ignore = [
  "E501",   # long lines are fine in table-heavy code
  "RUF001", "RUF002", "RUF003",  # ambiguous unicode (µ, ², →) is intentional in datasheets
  "B008", "SIM108", "SIM105", "UP031", "UP032", "PT011", "PT012", "PT018",
]

[lint.per-file-ignores]
"tests/*" = ["B011", "E741", "F601", "SIM117", "PT009"]
"tools/*" = ["EXE001"]
